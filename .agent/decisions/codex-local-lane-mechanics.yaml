# OPS-DECISION-003 (extended by OPS-DECISION-004: conflicted_pr_dispatches_no_checks)
#
# Durable execution mechanics for the GitHub delivery lane. It exists because the
# same three mistakes were re-discovered by hand across several candidates:
# a backgrounded local Quick that was silently reaped, a self-matching liveness
# probe that reported a false "running", and a push rejected by generated
# evidence that had gone stale from ordinary source-size changes.

decision:

  id:
    OPS-DECISION-003

  topic:
    codex_local_lane_mechanics

  owner_approval:
    status: directed
    basis: >-
      owner directive 2026-10-07: record accumulated execution lessons so the same
      mistakes are not rediscovered instead of being reused.

  scope:
    - every executor on the GitHub delivery lane of this repository

  decision:

    local_quick_launch:
      required: foreground agent session polled with write_stdin
      forbidden: background nohup/`&` launch; the agent tool reaps the process group when the command returns
      symptom_of_violation: the log stops mid-suite and no receipt is written

    local_quick_liveness:
      forbidden_check: 'pgrep -f "ci.local.quick"'
      why_forbidden: the checking command line itself contains the pattern, so it always self-matches and reports a false RUNNING
      correct_check:
        - poll the running agent session
        - or test the receipt file directly
      receipt_path: .git/codex/evidence/ci.local.quick/<head>.json
      success_signal: "[local_quick_evidence] RECORDED <path>"

    local_quick_cost:
      order_of_magnitude: about ten minutes
      policy: run once per frozen candidate head, never per iteration

    github_merge_lane:
      gate: make pr.merge depends on pr.merge.local_quick_gate
      requirement: exact-head ci.local.quick receipt; head and tree must both match
      reuse_signal: "[pr.merge.local_quick_gate] REUSE: exact-head ci.local.quick evidence verified for <head>"
      no_carry_forward: any later tracked-file commit invalidates the receipt
      owner_rule_scope: >-
        the 2026-09-23 relaxation of the local Quick requirement covers ordinary Gitee
        candidates only; the GitHub entry is unchanged
      sequencing:
        - finish every tracked edit
        - run exactly one Quick at the frozen head
        - prepare and merge without any further commit

    push_preflight:
      gate: make pr.push runs ci.generated_evidence.preflight
      known_stale_on_source_size_change:
        - docs/engineering_convergence/complexity_budget_report.md
        - docs/engineering_convergence/split_plan_queue.md
      correct_order:
        - make ci.delivery.freeze.prepare
        - review the generated diff
        - commit
        - make pr.push

    post_squash_merge_base_normalization:
      trigger: the branch's PR was squash-merged and work continues on the same branch
      action: merge origin/main into the branch before the next push
      why: a squash merge rewrites history, so without normalization the PR base stays the old merge-base and the already-merged content reappears in the diff
      expected_conflicts: record-only files (run records, iteration logs, generated digests)
      resolution: take the branch side
      resolution_justification: main's side equals the already-merged ancestor content, so the merge is content-neutral
      verification: git diff --quiet <pre-merge-branch-head> origin/main must report identical trees

    conflicted_pr_dispatches_no_checks:
      id: OPS-DECISION-004
      statement: >-
        GitHub builds the pull_request merge ref from the base and the head. When the
        branch does not merge cleanly with its base that ref cannot be built, so every
        gate workflow dispatches nothing at all: the pull request reports "no checks
        reported" and reads as "CI is not scheduled yet" instead of as a failure.
      consequence: >-
        a conflicted candidate is indistinguishable from a queued one, so a whole
        cycle is spent waiting before anyone suspects the branch itself
      enforcement:
        gate: make pr.push
        base_ref: GIT_SAFE_PUSH_BASE_REF (default origin/main)
        check: >-
          when the base is not an ancestor of HEAD, dry-run
          git merge-tree --write-tree <base> <head>
        outcome: exit 7 before any remote access, with the reconciliation command
        override: GIT_SAFE_PUSH_ALLOW_CONFLICT=<reason> (the PR then receives no checks)
      why_enforcement_and_not_a_reminder: >-
        post_squash_merge_base_normalization above already recorded this rule, and it
        was violated again on PR #632: a recorded decision does not stop a push, so the
        rule moved from advice into the push gate itself.
      unit_target: make verify.pr.push.unit

    verification_surface_literal_revival:
      id: OPS-DECISION-005
      statement: >-
        the zero-reference surface metric is computed from literal token presence, not
        from intent. A target name written literally inside a binding execution document
        (docs/ops/codex_execution_allowlist.md or docs/ops/codex_workspace_execution_rules.md)
        or anywhere in a non-prose file counts as "referenced", so one sentence that merely
        mentions the auditor un-registers the registered dead surface and trips the ratchet.
      consequence: >-
        the check flips to DENY with stale_target_dispositions, which reads as a regression
        in unrelated work
      correction_rule:
        - do not relax --check
        - do not unregister a still-true disposition
        - do not hand-edit the analyzer-written disposition JSON
        - rephrase the mention so the binding document does not declare the target (name the
          script or describe the role instead)
        - registries, baselines, exemptions and retirement trails narrate the surface and must
          stay out of the consumer index (SELF_DATA_FILES); counting them revived every
          registered entry the moment they were first committed
        - never write a real target or script name inside a tracked non-prose file, source
          comments included; describe the case instead of quoting the name
        - measure only the tracked state; while a registry is untracked, --check passes against
          a surface the scanner cannot see and the first commit fails the frozen head
      why: >-
        the same defect class was already fixed once for prose docs (batch B2); it reappeared
        in a normative doc and a Makefile comment during batch C/D
      unit_target: make audit.verification.lane_coverage.check

    local_quick_sharding_and_receipts:
      id: OPS-DECISION-006
      shards: QUICK_SHARDS (default 4) over the ci.local.quick.run declared recipe
      reuse_signal: a passed part is reused only while head+tree+coverage all match
      dirty_worktree: >-
        ci.local.quick fails closed before running the suite; run make ci.local.quick.diagnostic
        for a receipt-free observation
      receipt_retention: >-
        QUICK_RECEIPT_KEEP (default 50) via make ci.local.quick.gc, always keeping the current
        head and the newest out-of-window ancestor as the incremental base
      recipe_equivalence: >-
        compose re-asserts every declared recipe line and runs git diff --check; an unreproduced
        line fails closed
      contract_unchanged: ci.local.quick.run keeps its original prerequisites and recipe

    lane_telemetry:
      id: OPS-DECISION-007
      statement: >-
        observability only; recording or reporting never changes a lane's pass conclusion and
        never replaces a required check
      lane_names: same single source as the coverage auditor LANES
      record_store: .git/codex/evidence/lane_telemetry/<lane>.jsonl (append-only)
      rates: [pass_rate, degraded_rate, integrity_failure_rate]
      integrity_failure_rate_expected: 0
      entries:
        - make lane.telemetry.record
        - make lane.telemetry.report (TELEMETRY_BY_HEAD=1)
        - make lane.telemetry.check
      auto_report: make ci.local.quick records local.quick itself
      unit_target: make verify.lane.telemetry.unit

  recorded_instances:
    - candidate: e589676c23e4ef54d0dc1cfc9bce1749e5c7eb3a
      pr: 605
      squash: 2ec9d5830993f83a8c37883c429de15330078d90
      observations: >-
        the first local Quick attempt was launched with nohup and reaped; the liveness
        probe self-matched; the push was rejected twice by the complexity report and
        then the split plan queue; origin/main was merged to normalize the base and the
        resulting conflicts resolved to the branch side with identical trees.
    - candidate: 196301ef0b3f6bee4863071bd41c41723f6abd78
      pr: 632
      squash: 79908fdf7e104ceaa284edff71ef93bb6738c10d
      branch: audit/daily-dev-mainline-product-acceptance-closeout-20261009
      observations: >-
        c6937377 was pushed on a branch whose earlier head had already been
        squash-merged by PR #631, so the ledger commit hit an add/add conflict on
        run.json; PR #632 reported mergeable=CONFLICTING and dispatched zero workflow
        runs, which read as a scheduling delay. Reconciling first (git merge
        origin/main, resolving run.json to the branch ledger) produced a tree identical
        to c6937377, after which the gates dispatched normally and all four passed.
    - candidate: 2c61584e682df7b5cb6ca88fffc1e56de5f1dcb6
      branch: audit/daily-dev-mainline-product-acceptance-closeout-20261009
      observations: >-
        batch C/D: while making ci.local.quick shardable and adding lane telemetry, the
        zero-reference surface check flipped to DENY because the new normative-doc paragraph
        and the Makefile comment named make audit.verification.lane_coverage literally; both
        were rephrased (name/describe the auditor instead), no gate was relaxed and no
        registered disposition was unregistered, and the check returned to PASS.
