decision:

  id:
    OPS-DECISION-002

  topic:
    evidence_reuse_identity

  owner_approval:
    status: confirmed
    date: "2026-10-07"

  decision:

    single_reuse_authority:
      - scripts/ops/evidence_scope.py
    unit_surface_contract:
      - declared_units_carry_input_fingerprints
      - recording_accepts_only_executed_units
      - recording_rejects_skipping_a_planned_unit
      - only_passed_checked_declared_reused_are_carried_forward
    entry_policy:
      default: affected_exact_set_reuse_first
      covered_unit_rerun_requires: SC_ENTRY_SCOPE_REVERIFY_REASON
      whole_surface_rerun_requires:
        - SC_ENTRY_SCOPE_FULL=1
        - SC_ENTRY_SCOPE_FULL_REASON
    served_bundle_revision_role: provenance
    validity_key_excludes:
      - served_bundle_revision
    cross_deploy_carry_forward_requires:
      - recorded_deterministic_impact_analysis

  invalidates_a_unit:
    - declared_row_change
    - overlay_behaviour_change
    - derived_denial_change
    - model_or_probe_assertion_change
    - governed_runtime_identity_change   # base url, database, acting login, candidate order

  does_not_invalidate_a_unit:
    - redeploy_of_an_unchanged_surface
    - documentation_only_change

  accepted_risk:

    - id: stale_surface_reuse
      statement: >
        A deploy that changes page behaviour without touching any declared input
        would be carried forward by reuse. Accepted because re-walking the whole
        declared surface on every deploy is the failure mode this decision exists
        to remove.
      control: >
        Carrying evidence across a deploy is now decided by the served artifact
        fingerprint the runtime publishes (`frontend_build_sha256`, computed from
        the served dist by the governed frontend build entry): a deploy that served
        another bundle invalidates every declared unit, and a deploy that served the
        same bundle cannot have changed the rendering surface. No per-deploy human
        judgement is required, and when the runtime publishes no artifact
        fingerprint the identity degrades to the deployed revision in a recorded,
        visible way instead of reusing across bundles.

  enforcement:

    code_authority:
      - scripts/ops/agent_run_context.py#resolve_run
      - scripts/ops/agent_run_context.py#summary
      - scripts/verify/business_entry_matrix_model.mjs#reuseIdentityKey
      - scripts/verify/business_entry_matrix_model.mjs#environmentIdentity
      - scripts/verify/business_entry_matrix_browser.mjs#served_bundle_binding
      - scripts/verify/business_entry_matrix_incremental.py#resolve_reuse_bundle_identity
      - scripts/ops/evidence_scope.py#plan_units

    mechanised_control:
      ledger_declaration_integrity:
        enforcement: scripts/ops/agent_run_context.py#resolve_run (fail-closed)
        rules:
          - every check must declare kind offline|runtime; an undeclared kind is read as runtime and can never be reused
          - every check must name a make target a Makefile fragment defines; an unexecutable check can never be recorded
          - a declaration-level status/detail verdict is rejected; only the begin/record receipt is a verdict
        added: "2026-10-09"
        evidence: docs/ops/iterations/daily_dev_mainline_product_acceptance_closeout_20261009.md#8
      served_artifact_fingerprint_key: frontend_build_sha256
      served_artifact_fingerprint_source: /api/runtime-version (declared by make daily.runtime.frontend.build)
      served_artifact_fingerprint_asserted_by_probe: SC_ACCEPTANCE_FRONTEND_BUILD_SHA
      degradation_when_absent: served_revision
      degradation_visibility: provenance.reuse_identity_key
      outcome_fields_excluded_from_fingerprints:
        - acceptance_status

    compliance_gap_closed:
      date: "2026-10-09"
      statement: >
        Between 2026-10-07 and 2026-10-09 the code bound `served_revision` as a
        validity input, contradicting `validity_key_excludes` above. Every mainline
        deployment therefore re-opened every declared unit, including deployments
        that never rebuilt the frontend: three consecutive 89-key re-walks were
        observed on one unchanged governance runtime, and a targeted 6-key request
        was absorbed into a full re-walk. The recorded decision was not enforced by
        any mechanism, which is the durable lesson: a recorded reuse rule without a
        code authority is indistinguishable from an unrecorded one.
      evidence: docs/ops/iterations/hierarchical_worksheet_usable_ready_20261008.md#11

  reason:

    - no_mechanism_computed_an_affected_set_so_closures_degraded_into_full_reruns
    - key_level_binding_is_required_for_declaration_driven_surfaces
    - per_check_caches_do_not_generalize_systemic_reuse_does
    - owner_approved_that_a_head_difference_alone_must_not_force_revalidation

  related_goals:

    - FE-BUSINESS-ENTRY-ACCEPTANCE-GAP-CLOSURE

  status:
    active
