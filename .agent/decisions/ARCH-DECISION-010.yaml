decision:
  id: ARCH-DECISION-010
  topic: fact_layer_is_the_single_maintenance_source
  bnva_stage: BNVA-04-15C-06E-08
  owner_approval:
    status: confirmed
    date: "2026-11-02"
  decision:
    fact_layer_definition: model_view_permission_group
    only_fact_layer_is_maintained: true
    fact_layer_is_the_single_authority_for_business_configuration: true
    scenario_projection_is_read_only_over_fact_layer: true
    role_surface_and_navigation_are_read_only_projections: true
    no_mechanism_may_own_or_modify_fact_layer_data: true
    product_exposure_must_derive_from_native_model_view_permission_group: true
    product_entry_visibility_is_decided_by_native_menu_and_action_groups: true
    role_surface_primary_menu_lists_are_a_temporary_projection_and_must_not_be_extended: true
    exposure_changes_belong_only_to_fact_layer_group_binding: true
    forbidden_other_maintenance_surfaces: python_role_surface_hardcoded_lists_and_frontend_hardcoded_entries
  strict_constraint:
    - 未来只维护事实层数据（模型 / 视图 / 权限 / 分组）。
    - 场景投影、role_surface、导航与前端只能读取和投影事实，永远不能改写或替代事实。
    - 菜单与动作的可见性由原生 menu / action 的 groups 与 ACL 决定。
    - 任何产品入口暴露调整，只能落到事实层的分组绑定，不得落到机制层。
    - 场景层只能编排已有事实；不得新声明入口 route、menu_xmlid、action_xmlid、model、visibility、permission 或 group 事实。
    - 问题定位先判定“事实不足”还是“事实完整但编排错误”：事实不足回事实所有者层，事实完整才允许在场景编排层修复组合。
    - route 不是事实层数据；原生 action、产品入口选择和场景编排都不得维护 URL。
    - "最终导航投影按最终节点身份派生 route：场景节点为 `/s/{scene_key}`，普通动作为 `/a/{action_id}?menu_id={menu_id}`，目录为 `/m/{menu_id}`。"
    - "`system.init` 只返回同一棵最终场景化导航及其同源 route authority，不再读取另一份 route 事实。"
    - "场景化前的产品发布选择只是候选与发布资格输入，不是最终 P1 产品策略，也不代表用户可见入口。"
    - "对消费方发布的 P1 产品策略必须从最终场景化 `navigation.nav` 反向投影，计数和 menu/action/scene/route 身份必须与最终导航同源。"
    - "角色可达性与产品发布入口总数是不同问题；角色暴露守卫不得用产品发布计数反推后端能力或用户可见面。"
  enforcement:
    - 新增或调整角色可见入口时，先核对原生 menu / action 的 groups 绑定，再改事实层。
    - 禁止在 role_surface / 场景投影 / 前端新增硬编码入口清单。
    - 对机制层事实代持（如 role_surface primary_menu_xmlids）仅允许逐步收敛到事实层派生，不允许继续扩展。
    - "`verify.scene.fact_data.boundary.unit` 锁定场景层 route 事实签名；新增或变化即失败，迫使入口事实回到原生/产品事实层。"
    - "原生 action 的 `sc_web_route`、场景数据/注册中的硬编码 route、P1 产品入口源中的 route 字段均为禁止载体；只允许最终契约输出派生 route。"
  related:
    - .agent/decisions/ARCH-DECISION-009.yaml
    - .agent/decisions/data-authority-boundary.yaml
  status: active
