    capability: lowcode_configuration_editing_and_publication
    configuration_metadata: ui_business_config_contract
    business_data: odoo_business_models
  rules:
    - lowcode_never_owns_business_records
    - configuration_metadata_never_becomes_a_business_fact
    - xml_seed_is_default_not_tenant_data
    - user_override_is_tenant_metadata_not_code_seed_mutation
    - resolver_projects_config_onto_existing_odoo_models_only
  related:
    - .agent/decisions/ARCH-DECISION-004.yaml
