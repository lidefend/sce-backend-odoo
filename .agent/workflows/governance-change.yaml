workflow:
  id: governance-change
  purpose: governed_repository_work_environment_change
  capability: governance

  inputs:
    - selected_goal
    - baseline_full_sha
    - current_branch
    - complete_worktree_status

  steps:
    - load_authority_chain
    - inventory_registered_worktree_and_governed_infrastructure
    - identify_and_exclude_preexisting_changes
    - load_goal_and_active_decisions
    - declare_formal_product_layer_and_blast_radius
    - freeze_single_objective_batch_and_exact_file_scope
    - create_or_resume_run_record
    - implement_only_within_frozen_scope
    - record_commands_and_evidence_truthfully
    - run_lightweight_iteration_and_affected_registered_targeted_guards
    - collect_independent_same_layer_failures_and_resolve_delivery_blockers
    - update_one_result_index_with_original_evidence_references
    - only_when_delivery_ready_prepare_generated_evidence_commit_and_freeze
    - only_for_final_delivery_run_exact_head_quick_then_governed_publication
    - document_risk_rollback_and_next_step
    - close_run_only_after_required_evidence_passes

  stop_conditions:
    - authority_conflict
    - unowned_new_worktree_change
    - requested_change_outside_frozen_scope
    - unresolved_runtime_or_database_identity
    - zero_tests_collected
    - required_guard_failure
    - evidence_fingerprint_drift

  outputs:
    - updated_agent_context
    - run_record
    - verification_evidence
    - rollback_path
