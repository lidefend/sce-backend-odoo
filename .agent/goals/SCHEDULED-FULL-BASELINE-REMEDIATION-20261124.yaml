schema_version: 1

goal:
  id: SCHEDULED-FULL-BASELINE-REMEDIATION-20261124
  title: Remediate defects exposed by the all-tests scheduled backend baseline
  status: active
  formal_product_layer: P4 test harness plus owner-layer test fixtures and assertions
  layer_target: scheduled full backend suite
  module:
    - smart_construction_acceptance_fixture
    - smart_core
    - smart_construction_core
    - smart_construction_demo
  standard_vs_user_specific: platform_engineering_standard
  objective: >-
    Make the newly enabled all-tests backend suite self-contained and truthful by
    fixing the test database identity handoff, missing scenario preconditions and
    the two failing assertions it exposed.
  why_here: >-
    The failures are in test selection, attempt identity, fixture setup or test
    assertions first exercised by the P4 full lane. No production workflow,
    permission policy or business model semantics should change to satisfy them.
  why_not_elsewhere:
    - Do not weaken the all-tests selector.
    - Do not skip the exposed tests or quarantine failures.
    - Do not change ACL, Record Rules or production business behavior.
    - Do not make every ordinary PR run the exhaustive scheduled suite.
  blast_radius:
    paths:
      - .agent/active-runs.json
      - .agent/context.yaml
