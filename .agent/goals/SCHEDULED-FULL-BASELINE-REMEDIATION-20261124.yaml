  acceptance:
    - attempt database identity reaches tests as SC_TEST_DB_NAME
    - fixture tests seed only their own isolated attempt
    - demo ownership tests load required scenario facts inside the test transaction
    - smart_core field-settings assertion reflects the current authoritative contract
    - settlement concurrency assertion observes and explains both outcomes
    - all four affected modules pass their complete test suites
