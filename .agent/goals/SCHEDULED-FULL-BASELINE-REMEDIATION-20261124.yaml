      - .agent/goals/SCHEDULED-FULL-BASELINE-REMEDIATION-20261124.yaml
      - .agent/runs/SCHEDULED-RELEASE-FULL-CLOSEOUT-20261124/run.json
      - .agent/runs/SCHEDULED-FULL-BASELINE-REMEDIATION-20261124/run.json
