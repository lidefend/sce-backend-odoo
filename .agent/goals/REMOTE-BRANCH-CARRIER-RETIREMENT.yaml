      title: clear_runtime_carrier_reference_and_retire_the_branch
      status: completed
      evidence:
        - goal_baseline_and_completed_run_retained_list_no_longer_name_the_branch
        - carrier_scan_over_scripts_config_deploy_make_agent_github_is_empty
        - dry_run_eligible_1_skipped_0
