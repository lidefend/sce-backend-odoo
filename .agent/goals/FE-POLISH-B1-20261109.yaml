  layer_target: Product shell footer order, work card title readability, role-home fact de-duplication, mobile topbar label
  module: AppShell, MyWorkApprovalWorkspace, WorkspaceHome
  standard_vs_user_specific: platform_engineering_standard
  why_here: >
    All four findings are presentation defects inside existing P0 page patterns and the
