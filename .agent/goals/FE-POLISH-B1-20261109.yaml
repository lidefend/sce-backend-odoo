    product_behavior: >
      The shell footer stays below the routed page body, the work card title keeps the
      record number readable on a second line, the role-home task card no longer repeats
      the amount already shown by its money chip, and the narrow topbar no longer clips
      the interface-style label.
  objective: >
    Close the four verifiable presentation defects reported by the owner demo review in
    one independently acceptable batch, without touching contract structure.
  acceptance:
    - the content footer renders after the routed page body at 1440 and 390 widths
    - the work card title wraps to two lines so the record code is not clipped
    - the role-home task card does not repeat a money fact already shown by its chip
    - the style profile label is not clipped on a 390 wide topbar
    - targeted unit, guard, strict typecheck, lint and governed 1440/390 browser evidence pass
