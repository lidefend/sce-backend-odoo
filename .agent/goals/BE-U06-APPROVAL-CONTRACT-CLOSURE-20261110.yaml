    full_sha: 54dbbc1e9ae5864030ea9dfd8cd2b4409ef7f6cd
    source: reviewed_be_u01_u05_candidate
  objective: >-
    用真实 tier.review 任务贯通审批待办、最终 UiContractV2 页面、允许的审批动作、
    服务端来源重验、业务状态转换、权威回读和待办消失。以日常合同为主样本，
    证明只有读权限的审批人可以通过真实任务来源执行明确审批动作；再以付款申请
    为跨业务对照样本。验证重点是原生视图/动作/当前权限加工成最终契约，不证明
    Odoo 模型 ACL 自身的实现。
  product_boundary:
    standard_vs_user_specific: platform_mechanism_and_construction_standard
    why_here: >-
      最终页面和动作契约由 P0 UiContractV2Handler/ExecuteButtonHandler 装配与重验；
      真实审批任务、业务状态和回调由 P1 tier.review、审批策略及业务模型维护。
    why_not_elsewhere:
      - no_frontend_approval_special_case
      - no_new_approval_engine_or_page_configuration_system
      - no_duplicate_model_acl_or_record_rule_engine
      - no_release_deployment_or_product_acceptance_claim
    blast_radius:
      - focused approval contract ORM regression
      - focused frontend approval-contract consumption regression
      - focused review-origin method-boundary regression
      - governed My Work approval page browser journey
      - narrow payment-review decision-method authorization
      - registered make verification entry
      - U06 run and batch record
      - authority closure documentation references
  constraints:
    - use_real_tier_review_created_by_existing_approval_policy
    - final_contract_must_come_from_ui_contract_v2_handler
    - approval_action_must_come_from_delivered_contract_row
    - declared_decision_required_params_must_survive_frontend_normalization
    - execute_button_must_revalidate_current_task_and_current_contract
    - operation_approval_must_not_grant_general_business_write
    - payment_review_origin_accepts_only_declared_payment_decision_methods
    - business_state_and_review_status_must_both_be_read_back
    - completed_task_must_disappear_from_current_work_items
    - generic_odoo_model_acl_behavior_is_not_the_primary_acceptance_target
  exclusions:
    - frontend_changes
    - schema_or_migration_changes
    - production_or_acceptance_database_mutation
    - browser_journey
    - publication_or_deployment
    - broad_historical_approval_tag_import
  acceptance:
    - primary_general_contract_task_produces_separate_approve_and_reject_actions_in_final_contract
    - payment_request_control_produces_its_declared_approve_and_reject_actions_in_final_contract
    - payment_review_origin_accepts_action_approval_decision_but_not_arbitrary_business_methods
    - work_item_route_and_contract_resolve_the_same_model_and_record
    - stale_contract_action_is_denied_after_task_completion
    - frontend_presents_only_delivered_decision_actions_and_collects_their_declared_reason
    - approval_execution_updates_review_and_business_state_then_removes_current_task
    - focused_orm_executes_with_non_zero_count
    - focused_frontend_contract_consumer_test_executes_with_non_zero_cases
  rollback: >-
    Revert the BE-U06 verification commit. No schema, business data, ACL, route,
    publication, frontend or deployed artifact is changed by the test itself.
  next_exact_step: >-
    Run the focused approval contract ORM entry and classify any failure before
    changing product code.
