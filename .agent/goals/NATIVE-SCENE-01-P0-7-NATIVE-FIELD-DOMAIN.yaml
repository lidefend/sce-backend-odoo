schema_version: 1
goal:
  id: NATIVE-SCENE-01-P0-7-NATIVE-FIELD-DOMAIN
  title: Native field domain passthrough closure
  status: completed
  formal_product_layer: P0 platform kernel product
  layer_target: Odoo View field-domain passthrough into the existing bounded relation-domain expression
  module:
    - addons/smart_core
  baseline:
    branch: main
    full_sha: c36f3a1d3e9231097388b970421dbe13cdb7281d
    prerequisites:
      - NATIVE-SCENE-01-B-S3-WIDGET-CONVERSION
      - NATIVE-SCENE-01-P0-4-OCCURRENCE-IDENTITY
      - NATIVE-SCENE-01-P0-6-WIDGET-PROVENANCE
  objective: >-
    Preserve an explicit Odoo View field Domain in the existing field descriptor,
    reuse the existing bounded relation-domain compiler and the existing frontend
    evaluation path, and avoid introducing a parallel Domain expression contract.
  product_boundary:
    standard_vs_user_specific: platform-neutral native View field behavior
    why_here: >-
      Odoo View field parsing, the existing bounded Domain compiler and the
      existing frontend evaluator are generic P0 mechanisms shared by every
      Odoo module.
    why_not_elsewhere:
      - no industry model, customer preference or low-code layout is introduced
      - the frontend only evaluates the backend-declared expression
      - no Renderer redesign or Parser/AST rewrite is included
      - no persistent model or database behavior is introduced
  deliverables:
    - "addons/smart_core/app_config_engine/services/view_Parser/parsers Tree Form.py"
    - addons/smart_core/core/unified_page_contract_v2_assembler.py
    - focused backend and frontend tests
    - docs/audit/native-scene-01/p0-7-native-field-domain/implementation_record.md
  acceptance:
    - the exact raw Domain enters the Widget contract without frontend XML parsing
    - supported Domain expressions use the existing bounded compiler
    - unsupported Domain expressions retain the existing fail-closed evaluator behavior
    - relation option queries consume the compiled Domain expression
    - no parallel Domain projection object or frontend Domain implementation is added
    - non-zero targeted backend and frontend contract tests pass
  exclusions:
    - Context compilation and context execution
    - Widget options support-matrix implementation
    - embedded <widget name> nodes and QWeb rendering
    - List/Kanban/Activity Widget Renderer implementation
    - Gantt, Calendar, Pivot, Graph or Dashboard work
    - Parser/AST rewrite, database, ACL, record-rule or business-data changes
    - deployment or product acceptance
  rollback: Revert the parser/assembler Domain passthrough, cache re-pin and focused tests together.
