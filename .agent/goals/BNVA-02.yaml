      BNVA-019 已让后端正确理解 Odoo 原生视图；BNVA-02 要解决后端如何准确表达
      企业业务，把业务结构/归属/展示/加载全部落为显式、可审计的配置事实。
    why_not_elsewhere:
      - no_new_parallel_lowcode_schema
      - no_frontend_side_business_semantics
      - no_name_or_orm_type_based_guessing
      - no_permission_acl_or_record_rule_change
    blast_radius:
      - ui.business.config.contract
      - formStructureContract slots fieldGroups fieldOwnership
      - layoutContract.containerTree
      - five pages plus PC-01/PC-02
  constraints:
    - reuse_existing_config_contracts_without_parallel_schema
    - identity_section_ownership_must_be_explicit_declarations
    - section_titles_do_not_imply_field_membership
    - configuration_existence_is_not_runtime_consumption
  acceptance:
