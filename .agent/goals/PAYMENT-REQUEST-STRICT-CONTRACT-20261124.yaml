schema_version: 1

goal:
  id: PAYMENT-REQUEST-STRICT-CONTRACT-20261124
  title: Close Contract V2 strict field descriptors for payment request
  status: active
  formal_product_layer: P0 platform kernel plus P1 construction semantics
  layer_target: Contract V2 strict descriptor producer and consumer
  module:
    - smart_core
    - smart_construction_core
    - frontend/apps/web
  standard_vs_user_specific: platform_and_industry_standard
  objective: >-
    Make the real payment.request form contract decode successfully under
    Contract V2 2.6 by aligning canonical field identity, monetary precision,
    declared semantic keys and attachment-role metadata.
  why_here: >-
    The strict descriptor is produced by smart_core and P1 declares the
    construction field meaning and attachment role. The frontend decoder must
    consume the canonical fields without inventing defaults.
  why_not_elsewhere:
    - Do not add a frontend fallback or special-case payment.request.
    - Do not weaken strict Contract V2 validation.
    - Do not change ACL, Record Rules, workflow state or database structure.
    - Do not absorb the complete P0-B attachment-fact package into this fix.
