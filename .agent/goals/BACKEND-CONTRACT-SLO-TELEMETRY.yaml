    - no_new_compose_project_database_port_volume_or_credential
    - aggregation_must_not_fabricate_rates_for_empty_windows
    - malformed_observations_are_counted_and_never_silently_dropped
    - no_module_upgrade_and_no_odoo_model_in_this_batch
  next_exact_step: >-
