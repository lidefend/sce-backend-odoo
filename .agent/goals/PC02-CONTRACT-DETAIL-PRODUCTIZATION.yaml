schema_version: 1
goal:
  id: PC02-CONTRACT-DETAIL-PRODUCTIZATION
  status: active
  title: Contract-center detail page productization on sc.general.contract
  objective: >-
    Complete PC-02 contract detail productization on the released
    sc.general.contract entry (menu_sc_p1_daily_contract / action_sc_general_contract)
    and prove the P1 identity band and P2 five-layer amount band through isolated
    candidate runtime acceptance for both income and expense directions across
    1440/1024/768/390 viewports.
  formal_product_layer: P1 construction industry standard product
  layer_target: smart_construction_core view_sc_general_contract_form presentation
  module: smart_construction_core
  standard_vs_user_specific: construction standard form presentation
  why_here: >-
    The released contract-center entry is sc.general.contract; productization must
    follow the authoritative released navigation target and its native form arch.
  why_not_elsewhere:
    - Not on construction.contract / income / expense: those are not the released contract-center entry.
    - Not in the frontend renderer: native view reuse renders declared arch, no contract-specific Vue.
    - Not in amount computes / ACL / record rules / approval: those product semantics are frozen.
  scope:
    - scripts/dev/frontend_acceptance_runtime.sh
    - scripts/verify/frontend_delivery_hardening_runtime_ids.py
    - scripts/verify/frontend_contract_form_presentation_browser.mjs
    - .agent/goals/PC02-CONTRACT-DETAIL-PRODUCTIZATION.yaml
    - .agent/runs/PC02-CONTRACT-DETAIL-PRODUCTIZATION/run.json
    - docs/ops/iterations/contract-detail-productization-01/pc-02-batch-record.md
  exclusions:
    - amount computes, ACL, record rules, approval logic
    - authoritative_navigation.json
    - business data creation or mutation
    - push, merge, deploy
  acceptance:
    - sc.general.contract income and expense runtime acceptance pass on candidate profile
    - identity band fields render correctly with state/validation_status independent
    - amount_total contextual labeling avoids double-amount confusion
    - change_amount_total zero is not presented as "no change"
    - 1440/1024/768/390 have no horizontal overflow and no console errors
