    return a bounded list instead of 400 when no job_id is supplied.
  baseline:
    branch: fix/daily-platform-job-status-20261018
    full_sha: 3145206129a4ac2cc845250b8c9ac86b10281ed0
  exclusions:
    - No direct main push, force push, or required-check bypass.
    - No hand-built job table in the frontend panel.
  acceptance:
    - platform.job_status resolves to /a/<action_id> and renders with ActionViewShell.
    - GET /api/ops/job/status without job_id returns a bounded jobs list.
    - Focused contract tests and frontend typecheck pass.
  rollback: >-
    Revert this branch's tracked changes; the previous API-only duty route and
    the existing platform panel remain recoverable from main.
