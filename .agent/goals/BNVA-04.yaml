  objective: >-
    以 Odoo 标准业务能力为基础、以建筑行业专业模型和业务流程为核心、以统一平台内核和
    Vue 前端提供一致产品体验。审计并治理 Odoo 标准模块与行业模块之间的继承、组合、依赖
