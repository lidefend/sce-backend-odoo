    why_here: >-
      Smart Construction 是构建在 Odoo 标准能力之上的行业产品，平台内核负责整合治理，
      行业模块负责行业业务事实；不得为每个标准模型复制平行 sc.* 模型。
    why_not_elsewhere:
      - no_parallel_sc_models_for_odoo_standard_capabilities
      - no_platform_kernel_owning_industry_business_facts
      - no_frontend_reimplementing_backend_authority
    blast_radius:
      - project/purchase/stock/account/product/hr/mail/resource standard modules
      - smart_core / smart_construction_core inherit and composition edges
      - 17 orphan action candidates
