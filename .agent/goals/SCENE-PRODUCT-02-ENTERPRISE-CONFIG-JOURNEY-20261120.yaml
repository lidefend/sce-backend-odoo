schema_version: 1

goal:
  id: SCENE-PRODUCT-02-ENTERPRISE-CONFIG-JOURNEY-20261120
  title: enterprise_configuration_admin_journey_and_usability_closure
  status: active
  formal_product_layer: P1/P4
  layer_target: >-
    Existing enterprise initialization entries, native company/organization/
    position/user/permission facts, enterprise scene selection and the custom
    frontend that consumes those declarations.
  module:
    - addons/smart_construction_core
    - addons/smart_construction_scene
    - frontend/apps/web
    - scripts/verify
    - scripts/audit
    - scripts/dev/local_dev_product_release_prepare.py
    - config
    - docs/product
    - make/dev.mk
    - docs/ops/iterations
  standard_vs_user_specific: construction_product_standard_with_company_runtime_configuration
  objective: >-
    First organize all 132 released handling surfaces into the fixed workbench
    plus ten-center skeleton using explicit business-result groups. Every page
    must state its purpose, prerequisite/related step, continuation and entry
    context. Cross-center handoffs and workbench routing must retain the same
    stable object identity and return path. Only after this organization is
    reviewed may the runtime scenario seed, release snapshot and the enterprise
    configuration journeys consume it.
  product_result: >-
    A complete product-owner review set: one 132/132 organization table, a
    center-by-center user directory, workbench routing, cross-center handoffs,
    and a bounded gap list. Machine-readable output is generated from the real
    released menu source rather than copied counts. Runtime product changes are
    not made until this design is reviewed.
  why_here: >-
    The configuration facts belong to construction product models and native
    views. The frontend owns generic form consumption, while the journey probe
    belongs to governed delivery tooling.
  why_not_elsewhere:
    - Platform enterprise creation and first-administrator provisioning remain platform responsibilities.
    - Scene selection does not grant user access or prove role workspace delivery.
    - The frontend must not synthesize readiness counts or permission outcomes.
    - P4 tools must not write business models outside the user-visible application flow.
  blast_radius:
    behavior:
      - current-company enterprise information edit and readback
      - department creation, parent/company relation and later manager assignment
      - position creation and department relation
      - ordinary internal user, employee relation, department and position on the same identity
      - same-user assignable role and allowed-company scope grant/revoke with target-user readback
      - enterprise scene enable/revoke, refreshed catalog and diagnosis
    exclusions:
      - full ORM suites and owning-module baselines
      - full browser matrix and unrelated product centers
      - project creation when an applicable project is absent
      - production deployment and cross-product tenant migration
      - strengthening write permissions beyond the existing native declarations
  rollback: >-
    Revert any owned product or journey-tool fix together with its focused
    regression. Business records created by the journey use a unique batch marker
    and are deleted through the governed probe after authoritative readback unless
    a failure requires retaining them for diagnosis.
  completion:
    batch: approved_scenario_seed_verified_demo_and_clean
    runtime_seed: scenario_surface_generated_46_scenarios_132_bindings
    platform_release_composition: passed_in_separate_sc_platform_control
    independent_review: not_run
    mainline_integration: not_run
    deployment: not_run
    user_acceptance: pending
