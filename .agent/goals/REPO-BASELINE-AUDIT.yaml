goal:
  id: REPO-BASELINE-AUDIT
  title: repository_current_state_and_agent_governance_baseline
  status: active
  formal_product_layer: P4

  objective: establish_a_resumable_governed_repository_work_environment_baseline

  scope:
    include:
      - architecture_inventory
      - contract_inventory
      - frontend_inventory
      - backend_inventory
      - verification_entry_inventory
      - deployment_entry_inventory
      - agent_context_governance
      - parallel_work_isolation
    exclude:
      - product_source_change
      - business_semantic_change
      - contract_snapshot_regeneration
      - runtime_or_database_mutation
      - preexisting_dirty_files

  constraints:
    - audit_and_governance_metadata_only
    - preserve_all_preexisting_changes
    - no_manual_environment_assembly
    - no_unregistered_test_or_runtime_entry
    - one_active_batch

  acceptance:
    - repository_structure_documented
    - current_risks_identified
    - authority_precedence_recorded
    - governed_runtime_profiles_recorded
    - formal_layer_and_batch_mechanism_recorded
    - parallel_dirty_change_isolation_recorded
    - resumable_run_record_created
    - agent_context_guards_pass

  current_batch:
    id: Batch-J
    objective: fix_snapshot_export_internal_argument_forwarding
    status: active

  next_iteration_direction:
    - strengthen_agent_context_schema_guards
    - reconcile_legacy_readme_and_runtime_entry_documentation
