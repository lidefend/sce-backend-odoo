schema_version: 1
goal:
  id: NATIVE-SCENE-01-P0-4-OCCURRENCE-IDENTITY
  title: Unify deterministic native View occurrence identity
  status: active
  formal_product_layer: P0 platform kernel product
  layer_target: Canonical native View identity and Form/List occurrence projection
  module:
    - addons/smart_core
    - frontend/apps/web
  baseline:
    branch: main
    full_sha: 7dc7f393aafd3ccd4e35fed45d75108993155324
    prerequisites:
      - NATIVE-SCENE-01-P0-1-ACTION-VIEW-SET
      - NATIVE-SCENE-01-P0-2-SEARCH-VIEW-CONTRACT
      - NATIVE-SCENE-01-P0-3-P0-5-NATIVE-ACTION-CONTRACT
  objective: >-
    Publish one deterministic native View identity and occurrence identity shape
    across Form fields/containers, List columns and native buttons, while
    preserving runtime View IDs, XMLID portability, display-independent
    structure fingerprints and explicit Domain/Context/options provenance.
  product_boundary:
    standard_vs_user_specific: platform-neutral Odoo native View semantics
    supporting_layers:
      - P4 validation impact routing, candidate runtime identity and merge-evidence recording
    why_here: >-
      View identity, locator interpretation and deterministic occurrence keys
      are generic contract concerns shared by every Odoo module.
    why_not_elsewhere:
      - no P1 industry view defaults
      - no P2 customer page configuration
      - no P3 low-code identity semantics
      - no frontend generation of missing occurrence identity
      - no Parser or Renderer rewrite
  deliverables:
    - addons/smart_core/core/native_view_occurrence.py
    - addons/smart_core/app_config_engine/services/assemblers/page_assembler.py
    - addons/smart_core/core/unified_page_contract_v2_assembler.py
    - addons/smart_core/core/contract_lifecycle.py
