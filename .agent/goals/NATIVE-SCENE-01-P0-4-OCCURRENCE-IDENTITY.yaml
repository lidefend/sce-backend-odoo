  acceptance:
    - each active native View publishes model/type/current view ID/XMLID/content hash/structure key
    - viewContentHash changes on display-only edits while occurrenceKey remains stable
    - viewStructureKey and occurrenceKey change only for structural changes
    - Form field and container occurrences publish one deterministic nativeIdentity shape
    - List listProfile.columnOccurrences preserves duplicate same-name occurrences and deduplicates only by occurrenceKey
    - native button identities use the same View identity and occurrence key contract
    - Domain/Context/options provenance is explicit in occurrence projections
    - frontend Decoder rejects malformed native identity and does not generate occurrence keys
    - real Odoo Form/List Action integration produces non-zero passing tests
    - contract version, schema hash and assembled cache version are synchronized
    - unknown validation inputs still fail closed while exact contract inputs route only to declared checks
    - candidate runtime identity is produced from authoritative DB readback and rejects stale identity
    - the integration entry records all affected merge evidence without manual path discovery
  exclusions:
    - Parser/AST rewrite
    - Renderer or component interaction redesign
    - Calendar, Gantt, Dashboard, Pivot or Graph renderer implementation
    - business model, ACL, record rule or data changes
    - persistent schema migration, deployment or scene composition expansion
  rollback: Revert the P0-4 contract producer, schema/Decoder and focused-test commits together.
