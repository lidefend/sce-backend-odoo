goal:
  id: SCHEDULED-CI-RUNTIME-NAV-20261109
  title: close scheduled CI by removing the obsolete static navigation expectation
  status: verification_pending
  formal_product_layer: P4 ops delivery tool
  layer_target: scheduled frontend release navigation audit
  module: frontend page identity audit and release evidence validation
  standard_vs_user_specific: platform delivery verification standard
  why_here: >
    Runtime navigation is generated from scene and product delivery state. The
    checked-in static 63/89 expectation is no longer an authoritative gate and
    caused scheduled CI to fail after legitimate product evolution. The full
    release lane also exposed a new probe-level inline geometry assertion that
    belongs to the P4 browser verification tool. The explicit full local gate
    then exposed a stale schema-guard expectation and undispositioned active
    guards, both owned by the verification system.
  why_not_elsewhere: >
    Do not change product menus, ACL, role policy or runtime navigation to
    satisfy a stale declaration. Do not create the future dynamic navigation
    expectation engine inside this CI-fix batch.
  blast_radius:
    product_behavior: none
    verification: page identity audit and release evidence navigation observation
    exclusions:
      - no manifest count update
      - no backend product or permission changes
      - no browser database write
      - no deployment
  objective: >
    Keep runtime navigation observation, structural identity validation and page
    identity checks while removing obsolete static expected-set equality from
    scheduled CI.
  acceptance:
    - scheduled audit no longer compares runtime navigation to static 63/89 sets
    - actual navigation must be non-empty, structurally valid and duplicate-free
    - page identity, console, HTTP, accessibility and journey checks remain
    - release evidence validates observation invariants without static counts
    - playwright probe coupling guard passes after removing transient geometry
    - unified page contract schema guard recognizes the declared notice surface
    - every unwired active guard has a wire-or-retire disposition
    - the clean-HEAD full local gate passes
    - affected unit and incremental gates pass
  rollback: Revert this batch; no database or deployed runtime state is changed.
  next_exact_step: Commit the baseline guard fixes, rerun the full clean-HEAD local gate, then update PR #852 and rerun the exact-head full release gate.
