    branch: feature/p0-workflow-authority-input-validation-v1
    baseline_sha: 3cb69dc8150de4acd9384ce734166801ceebece7
    implementation:
      resolver: frontend/apps/web/src/app/contracts/v2/workflowActionAvailability.ts
      canonical_consumer: frontend/apps/web/src/app/presentation/contractFormPresenter.ts
