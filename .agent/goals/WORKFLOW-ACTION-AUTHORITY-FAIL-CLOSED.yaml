    current_source: frontend/apps/web/src/pages/contractForm/workflowContract.ts
    legal_uniqueness_scope: >-
      For one executable action, the union of exact method, exact action key and
      declared alias matches must resolve to exactly one availableActions row.
      Multiple matching rows are ambiguous even when their enabled values agree.
      Malformed unrelated rows must not disable a genuinely unrelated action.
    observations:
      legal_unique_boolean_row: remains_enabled
      duplicate_execution_identity: remains_enabled_instead_of_failing_closed
      malformed_available_actions_row: filtered_and_authority_remains_enabled
      non_boolean_enabled_value: treated_as_enabled
    old_asset_boundary: >-
      The old workflowActionAvailability resolver and its generic counterexamples
      are reusable design evidence; payment fixture, payment probes and demo data
      are stale and must not be restored.
