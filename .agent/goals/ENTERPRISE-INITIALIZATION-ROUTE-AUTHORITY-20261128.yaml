      outcome: Validate the initialization menu and action through an isolated module test and clean runtime.
  acceptance:
    - The exact initialization menu/action survives when no business scenario is enabled.
    - Ordinary unselected business entries remain denied.
    - Unauthorized and self-declared initialization routes remain fail-closed.
    - Frontend consumes the same published authority without special casing.
