    The initialization lifecycle belongs to the construction industry scene layer.
    The existing P0 producer already publishes the native menu/action through the
    product-policy projection; P1 incorrectly removes that route as an unselected
    business scenario.
  why_not_elsewhere:
    - The frontend must continue consuming route authority and must not synthesize an initialization entry.
    - P0 generic delivery must not acquire construction initialization semantics.
    - P3 runtime configuration must not repair a standard product lifecycle defect.
  blast_radius: >
    Only native rows with the declared enterprise-initialization menu/action identity
    and an authorized producer source may survive business-scene filtering. Ordinary
    business scenes, role permissions, model ACLs and execution contracts remain unchanged.
  exclusions:
    - frontend source changes
    - demo or seed changes
    - persistent database migration
    - business-scene auto-enablement
    - platform-admin widening
