schema_version: 1
goal:
  id: FE-RENDERER-V1
  title: Contract-Driven Unified TDesign Component Delivery
  status: verification_pending
  formal_product_layer: P0 platform kernel product
  layer_target: Frontend Contract V2 component identity, binding and unified Sc/TDesign implementation
  module: Semantic Registry, Component Registry, Canonical Form Render Model, Professional Component Registry, FormSection, Sc Design System, TDesign Bridge, Page/Action/Professional hosts
  standard_vs_user_specific: platform_engineering_standard
  why_here: >
    The component declaration vocabulary, componentKey resolution, fail-closed
    behavior, business-value presentation boundary and unified TDesign base-control
    implementation are consumed by every product page. Leaving these decisions in
    page-specific branches would make every business module carry its own component
    infrastructure.
  why_not_elsewhere: >
    Business modules must declare semantics and flags through Contract V2 rather than
    naming TDesign or Vue components. Page hosts must keep their existing composition
    responsibilities. @sc/ui must remain scene composition. TDesign must remain behind
    the Sc implementation boundary. No page may infer component identity from a model
    name, field name or menu label, and no business rule may move into a base control.
  blast_radius:
    paths:
      - .agent/active-runs.json
      - .agent/goals/FE-RENDERER-V1.yaml
      - .agent/runs/FE-RENDERER-V1/run.json
      - contracts/registry/semantic.yaml
      - contracts/registry/component.yaml
      - scripts/contract/generate_semantic_registry.py
      - frontend/apps/web/src/app/presentation
      - frontend/apps/web/src/components/design-system
      - frontend/apps/web/src/components/template/FormSection.vue
      - frontend/apps/web/scripts
      - scripts/verify
      - docs/architecture/renderer_v1_contract_tdesign_plan_20261108.md
      - docs/architecture/renderer_v1_contract_tdesign_plan_20261108.en.md
  objective: >
    Deliver Contract First + Unified TDesign Component Rendering by reusing the
    existing semantic/component registries and page hosts, adding one authoritative
    componentKey-to-Sc binding map where it removes duplicated FormSection branches,
    and proving the unified authority through Contract Form, Payment Request and
    the currently enabled ActionView collection. Product enablement of
    SceneCollectionSurface is explicitly deferred to a separate feature-gated
    acceptance batch.
  acceptance:
    - Produce a complete componentKey inventory and current implementation map from the latest main basis
    - Reconcile PR #845 as an asset source without treating it as merged architecture
    - Define one authoritative componentKey to Sc component binding without adding a second componentKey vocabulary
    - Keep Contract V2 structure, permissions, business values and action authority unchanged
    - Reuse existing Sc and TDesign wrappers and standardize only real capability gaps
    - Make unknown, incompatible or capability-mismatched component bindings fail closed
    - Prove Contract Form, Payment Request and the currently enabled collection surface use the same component authority
    - Record direct SceneCollectionSurface enablement as a deferred feature-gated boundary rather than substituting ActionView as equivalent evidence
    - Require no product-source change to add a standard ordinary business model and Contract fixture
    - Record component counts, duplicated branches, registry paths and complexity change against the baseline
    - Run affected non-zero tests, strict typecheck, lint, guard checks, incremental iteration and required integration gates
  results:
    v1_00_component_mapping_audit: PASS
    v1_01_contract_component_binding: PASS
    v1_02_tdesign_component_interaction: PASS
    v1_03_existing_page_hosts_preserved: PASS
    v1_04_business_value_and_action_authority: PASS_UNCHANGED
    v1_05_contract_form: PASS
    v1_05_payment_request_settlement_journey: PASS
    v1_05_collection_list_and_readonly: PASS
    v1_05_direct_scene_collection_surface: DEFERRED_BY_EXPLICIT_SCOPE
    v1_05_contract_only_new_model_fixture: PASS
    review_fix_date_change_and_clear_events: PASS
    review_fix_textarea_input_change_semantics: PASS
    frontend_build: PASS_5374_MODULES
    ci_local_iteration: PASS_8_TARGETS
    strict_typecheck: PASS
    lint: PASS_WITH_PREEXISTING_OUT_OF_SCOPE_WARNING
    independent_review: REQUEST_CHANGES_FIXED_PENDING_REREVIEW
    next_exact_step: >
      Commit the review fixes, push the updated candidate, and request a second
      exact-head independent review. Do not merge or enable SceneCollectionSurface.
  exclusions:
    - multi_renderer_runtime
    - dynamic_plugin_marketplace
    - react_host
    - complete_native_component_library
    - contract_v2_restructure
    - permission_mechanism_change
    - business_value_presentation_change
    - full_page_rewrite
    - scene_collection_product_enablement
    - irreversible_legacy_removal
    - deployment
    - merge_without_independent_review
  rollback: >
    Revert the V1 binding-map, component standardization, host integration, tests and
    evidence commits in reverse layer order. Keep Contract V2, Sc primitives captured
    from prior merged main, business-value presentation and backend permissions.
