    full_sha: 991a9d9b57525850f99a8643ce3f4f0d322d00dd
    source: origin/main_5dd4a846_plus_FE-CONTRACT-RUNTIME-00_deliverables
  objective: >-
    Converge the two private skill vocabularies (backend
    unified_page_contract_v2_assembler._component_key and frontend
    professionalComponentRegistry.ts) into one declared authority so a new
    business field needs only a semantic declaration and no new front/back
    mapping code. A: registry + schema + lint. B: backend resolves through the
    registry, keeping the legacy componentKey as a deprecated fallback.
    C: frontend consumes the same declaration. D: payment.request becomes the
    first object that actually runs on the Contract Runtime. E: freeze state
    ownership boundaries without building a state machine.
  product_boundary:
    standard_vs_user_specific: platform_mechanism
    why_here: >-
      The semantic/component vocabulary is a P0 contract-runtime mechanism every
      product inherits; it has no construction-industry or customer semantics.
    why_not_elsewhere:
      - no_business_page_rewrite_and_no_payment_model_special_case
      - no_new_component_unless_a_semantic_has_no_renderer
      - no_lowcode_designer_and_no_state_machine_dsl_this_goal
      - no_new_environment_fixture_authority_or_release
    blast_radius:
      - contracts_registry_and_registry_yaml
      - smart_core_contract_v2_assembler_component_resolution
      - frontend_professional_component_registry_consumption
  constraints:
    - contract_is_the_only_authority_for_business_semantics
    - frontend_owns_presentation_and_safe_interaction_only
    - missing_contract_declaration_is_a_contract_defect_not_a_frontend_fallback
    - keep_legacy_component_key_working_with_a_deprecation_warning
    - reuse_existing_evidence_and_run_incremental_checks
  next_exact_step: >-
    FE-CONTRACT-RUNTIME-01-A is written and its non-zero targeted check passes.
    Commit 01-A, then start 01-B: replace the private _component_key mapping in
    addons/smart_core/core/unified_page_contract_v2_assembler.py with a resolvers
    that reads contracts/registry/semantic.yaml, keeping componentKey as a
    deprecated fallback and proving payment.request rendering is unchanged.
  completion:
