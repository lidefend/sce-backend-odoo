schema_version: 1
goal:
  id: PLATFORM-ADMIN-CREDENTIAL-MECHANISM-20261020
  status: active
  objective: 把平台管理员凭据从一次性 ORM 操作升级为平台控制职责的受管声明，保证运行状态校验、缺失 fail-closed、重建后可恢复且不泄露口令
  formal_product_layer: P4 ops delivery tool
  exclusions:
    - 不修改平台/租户身份边界或认证协议
    - 不修改用户模块、Demo 业务数据或前端构建
    - 不在仓库、日志、argv 或报告中保存口令值
    - 不触碰生产环境
