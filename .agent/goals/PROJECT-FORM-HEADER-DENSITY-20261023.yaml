schema_version: 1
goal:
  id: PROJECT-FORM-HEADER-DENSITY-20261023
  status: active
  title: Compact the shared product form header without changing product semantics
  objective: >-
    Remove excessive empty space from the shared product form header on desktop
    and narrow viewports while preserving the single ProductPageHeader
    authority, title, status, action settlement, contract inputs and permissions.
  formal_product_layer: P0 platform kernel product
  layer_target: shared product page header and form header presentation
  modules_or_tools:
    - frontend/apps/web/src/components/product-page-header/ProductPageHeader.vue
