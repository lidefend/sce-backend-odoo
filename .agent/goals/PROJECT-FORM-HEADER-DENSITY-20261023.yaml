  product_boundary:
    standard_vs_user_specific: platform_generic_presentation_mechanism
    why_here: >-
      The project form symptom is produced by the shared ProductPageHeader and
      form-header consumer allocating unused status width and stacking each slot
      on narrow screens. Fixing the shared mechanism avoids a project-specific
      frontend branch or duplicated layout authority.
    why_not_elsewhere:
      - no project field, action, permission or state semantic change
      - no backend contract or runtime low-code configuration change
      - no project.model special case in the frontend
      - no ACL, role or visibility change
    blast_radius:
      - every direct consumer of ProductPageHeader
      - contract form header action and status placement
      - desktop, tablet and mobile form-header density
  exclusions:
    - no business contract changes
    - no ACL, role, visibility, required, readonly or action changes
    - no project.project special case
    - no direct database or runtime configuration write
  acceptance:
    - desktop header no longer reserves an empty status column
    - narrow header places status and actions on one compact row beneath identity
    - a structural form header with a sparse fact row sizes to its declared content instead of stretching a one-item descriptions table across the entire body
    - project form remains free of horizontal overflow
    - project form page still has one title, one status authority and the declared actions
  rollback:
    - revert this topic commit; no data migration or runtime configuration rollback is required
  next_exact_step: >-
    Register the run, implement the shared header layout correction and its
    non-zero guard, then capture before/after project-form geometry.
