schema_version: 1
goal:
  id: FE-RELATION-INTERACTION-01-20261117
  status: active
  formal_product_layer: P0
  layer_target: generic Contract V2 relation, action execution-state and create-cache interaction convergence
  module: frontend/apps/web
  standard_vs_user_specific: platform_standard
  reason: Declared child modifiers/warnings are rejected by the relationship loader, inline canonical actions expose only a raw reason code through title, action loading is not shared across header/body/overflow surfaces, and create-contract caching treats etag as reusable despite the shared runtime requiring server revalidation.
  why_here: Relation interaction lifecycle, row hint presentation, action execution presentation and contract cache policy are generic frontend mechanisms shared by all models.
  why_not_elsewhere: No schema, model, backend action, industry rule, page special case or new component authority is required; the executing action identity is ephemeral frontend state, not a business contract fact.
  blast_radius: All Contract V2 one2many Add Row/row-onchange paths, canonical header/body/overflow actions during execution, and record-free create contract loads.
  exclusions:
    - backend contract or model changes
    - nested child one2many line_patches execution
    - model-specific project, contract or payment branches
    - new design-system component tree
    - deployment or L4 user acceptance before source checks pass
  product_result: One2many rows consume declared modifier/warning effects, denied reasons and executing-action loading are consistent across canonical action surfaces, and only snapshot-declared create contracts use local reuse.
