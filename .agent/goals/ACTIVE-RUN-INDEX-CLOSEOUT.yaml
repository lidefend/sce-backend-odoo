schema_version: 1
goal:
  id: ACTIVE-RUN-INDEX-CLOSEOUT
  title: clear_the_dangling_active_run_index_entry
  status: completed
  formal_product_layer: P4
  layer_target: engineering_context_run_index
  module:
    - .agent
  objective: >-
    Return .agent/active-runs.json to the intentionally empty branches map after
    the carrier-retirement round merged, so no active-run mapping points at a
    branch that has been or is about to be retired. Metadata only.
  baseline:
    branch: main
    full_sha: bcd6c47ee727aa957285204df986e9f3f1f4a01e
    source: clean_main_after_pr_557
  product_boundary:
    standard_vs_user_specific: ops_delivery_governance
    why_here: >-
      The run index is engineering-context delivery metadata owned by the P4 ops
      layer; clearing a stale binding changes how the repository tracks its own
      runs, not what the product does.
    why_not_elsewhere:
      - no_p0_frontend_contract_or_platform_mechanism
      - no_p1_construction_industry_semantics
      - no_p2_customer_preference_or_data_baseline
      - no_p3_runtime_configuration
      - no_database_fixture_migration_release_or_deployment
    blast_radius:
      - one_stale_branch_to_run_mapping_in_the_active_run_index
  batches:
    - id: A
      title: clear_the_index
      status: completed
      evidence:
        - active_runs_branches_is_an_empty_object
        - verify_agent_resume_unit_30_passed
  exclusions:
    - no_change_to_any_run_record_goal_or_manifest
    - no_remote_reference_is_deleted_by_this_batch
  rollback:
    - re-add the single mapping if the round must be resumed
  next_exact_step: >-
    Closed 2026-10-04: the active-run index is empty again and the round's run is
    recorded; publishing this metadata-only candidate through the ordinary PR lane.
