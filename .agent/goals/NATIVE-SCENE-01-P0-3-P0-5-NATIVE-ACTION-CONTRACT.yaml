    - scripts/verify/test_page_composition_integrity_guard_rules.py
    - scripts/verify/test_product_view_contract_carriers.py
    - make/guards.mk
    - make/ci.mk
    - scripts/verify/frontend_dev_incremental.py
    - scripts/verify/test_frontend_dev_incremental.py
    - scripts/verify/frontend_v2_policy_projection_guard.py
    - scripts/verify/test_frontend_professional_component_registry_guard.py
    - scripts/verify/test_node_component_registry.py
    - scripts/verify/test_semantic_registry_lint.py
    - scripts/verify/test_coverage_registry.yaml
    - docs/audit/native-scene-01/p0-3-p0-5-native-action-contract/
    - docs/audit/native-scene-01/inventories/
    - docs/audit/test_coverage_registry/
    - docs/engineering_convergence/
  acceptance:
    - an Odoo Window Action publishes one stable nativeActionContract identity
    - ordered views retain effective action.views order, IDs, duplicate types and source authority
    - active/default view agree with pageInfo and remain consistent when switching view type
    - Action scope is projected once and Search identity agrees with searchContract.nativeIdentity
    - backend contract, client renderer and business execution readiness remain separate
    - the frontend Decoder strictly accepts the new nativeActionContract root and rejects malformed shapes
    - ActionView view selection consumes orderedViews/selectable from the contract and does not guess from view names
    - model-only pages without an Action remain on the existing model projection path
    - focused backend, schema, decoder and frontend tests pass with non-zero collection
  exclusions:
    - P0-4 occurrence unification
    - Canonical Native View AST migration
    - Widget and Renderer redesign
    - Calendar, Gantt or Dashboard implementation
    - database models or business data changes
    - deployment
  rollback: Revert the P0-3/P0-5 contract producer, Decoder and ActionView consumption commits together.
