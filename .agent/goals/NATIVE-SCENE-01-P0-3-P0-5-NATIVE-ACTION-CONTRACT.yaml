schema_version: 1
goal:
  id: NATIVE-SCENE-01-P0-3-P0-5-NATIVE-ACTION-CONTRACT
  title: Publish and consume the Native Action Contract atomically
  status: active
  formal_product_layer: P0 platform kernel product
  layer_target: Unified Page Contract V2 Native Action Contract producer and Decoder
  module:
    - addons/smart_core
    - frontend/apps/web
  baseline:
    branch: main
    full_sha: 56ded801d95cd2a30c9c8f976379e060936a9c3d
    prerequisites:
      - NATIVE-SCENE-01-P0-1-ACTION-VIEW-SET
      - NATIVE-SCENE-01-P0-2-SEARCH-VIEW-CONTRACT
  objective: >-
    Promote the already-resolved native Action identity, ordered View Set,
    active/default view, Search identity, Action scope and three-axis readiness
    into the public Unified Page Contract V2, then make ActionView consume that
    contract for view navigation with one atomic backend/frontend delivery.
  product_boundary:
    standard_vs_user_specific: platform-neutral native Action contract mechanism
    why_here: >-
      Native Action, View Set, Search identity and page-contract decoding are
      generic Odoo semantics shared by every business module.
    why_not_elsewhere:
      - no P1 industry view defaults
      - no P2 customer page configuration
      - no P3 low-code contract semantics
      - no frontend inference of missing Action/View identity
      - no Parser or Renderer rewrite
  deliverables:
    - addons/smart_core/core/native_action_contract.py
    - addons/smart_core/core/unified_page_contract_v2_assembler.py
    - addons/smart_core/core/contract_lifecycle.py
    - addons/smart_core/app_config_engine/services/assemblers/page_assembler.py
    - addons/smart_core/handlers/ui_contract_v2.py
    - addons/smart_core/tests/test_native_action_contract_integration.py
    - addons/smart_core/tests/test_native_action_view_set_integration.py
    - addons/smart_core/tests/__init__.py
    - docs/architecture/unified_page_contract_v2/
    - contracts/registry/component.yaml
    - frontend/apps/web/src/app/contracts/v2/types.ts
    - frontend/apps/web/src/app/contracts/v2/schema.ts
    - frontend/apps/web/src/app/contracts/actionViewSurfaceContract.ts
    - frontend/apps/web/src/app/action_runtime/useActionViewModeRuntime.ts
    - frontend/apps/web/src/views/ActionView.vue
    - frontend/apps/web/scripts/collection_view_semantics_test.ts
    - frontend/apps/web/scripts/canonical_form_presenter_test.ts
    - frontend/apps/web/scripts/professional_component_registry_test.ts
    - frontend/apps/web/src/app/presentation/semantic_registry.generated.ts
    - frontend/apps/web/src/app/presentation/industry_renderer_manifest.generated.ts
