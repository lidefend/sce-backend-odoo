schema_version: 1
goal:
  id: FE-TPL-OFFICIAL-TEMPLATE-ADOPTION
  title: custom_frontend_rendering_and_interaction_return_to_official_template_compositions
  status: active
  formal_product_layer: P0
  supporting_layer: P4
  layer_target: frontend_contract_consumption_and_standard_page_compositions
  module:
    - frontend/apps/web
    - scripts/verify
    - make
    - docs/ops/iterations
  baseline:
    branch: feature/web-official-template-adoption
    full_sha: 510a37d5f784b36f1e1ad4d7d02dbd1331f673f5
    source: owner_confirmed_segment_52_handoff
  objective: >-
    Keep the custom web frontend rendering, interaction and page composition on
    the official TDesign starter compositions, driven only by the effective
    business contract, while the mainline (strategic) agent collaboration flow is
    adopted for continuation.
  product_boundary:
    standard_vs_user_specific: platform_mechanism
    why_here: >-
      Official page compositions, contract consumption adapters and shared layouts
      are generic frontend platform mechanisms; they must not encode
      construction-industry or customer-specific business semantics.
    why_not_elsewhere:
      - no_p1_industry_or_p2_customer_semantics_in_frontend
      - no_p3_low_code_editable_configuration_shortcut
      - required_contract_producer_changes_stay_with_their_p0_p1_p2_owner
      - no_new_fixture_or_environment_authority_and_no_target_release
    blast_radius:
      - standard_list_form_detail_and_master_detail_compositions
      - contract_shaped_collection_and_form_adapters
      - shell_breadcrumb_footer_and_scroll_owner
      - targeted guard_and_unit_entries_under_scripts_verify
  constraints:
    - contract_is_the_only_authority_for_business_semantics
    - frontend_owns_presentation_and_safe_interaction_only
    - no_second_list_or_form_renderer_path
    - tone_and_visual_tokens_never_enter_the_business_contract
  next_exact_step: >-
    Complete the full-system contract-driven official rendering and interaction
    system, including missing contracts for confirmed business responsibilities.
    Reuse the existing 67-entry ledger and 16 owned gaps; close producer and consumer
    responsibilities together, retire duplicate legacy paths, and verify real loops.
    Template demo features do not invent business requirements. Keep local-only delivery.
