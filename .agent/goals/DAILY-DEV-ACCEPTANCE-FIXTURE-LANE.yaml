goal:
  id: DAILY-DEV-ACCEPTANCE-FIXTURE-LANE
  status: completed
  formal_product_layer: P4
  module: ops_delivery_tool
  objective: >-
    Let the daily development runtime database sc_demo carry the governed
    acceptance fixture so the daily readonly acceptance probe can produce its
    exact-instance backend contract receipt legitimately, instead of reporting
    record_resolution_missing. Add a declared daily fixture scope, a daily
    contract declaration, a governed daily contract-identity resolution entry
    and a separate contract credential for the probe; never weaken the existing
    sc_frontend_acceptance acceptance scope guard.
  layer_target:
    - acceptance fixture carrier scope (addons/smart_construction_acceptance_fixture addon tool)
    - daily development runtime lane (make/dev.mk entries and the acceptance probe tool)
  standard_vs_user_specific: >-
    Operations delivery tooling for the existing daily development runtime
    profile; no product semantics, no customer baseline, no platform mechanism.
  why_here: >-
    The fixture builder, the acceptance probe and the daily lane already own
    this responsibility; the owner authorized the daily database to carry the
    acceptance fixture, so the scope belongs beside the existing guard.
  why_not_elsewhere: >-
    The lane's own deliverable stays in the fixture carrier, the acceptance
    probe and the daily Make entries; it adds no product semantics.  The one
    P0 platform dependency touched here is smart_core's superuser
    res.users._has_group pass-through, which fabricated base.group_public
    membership and made OdooBot look public.  That corrected Odoo audience
    classification is a platform fix with its own non-zero ORM test, not a new
    product rule, and it is required for any fixture user provisioning.  Not
    the frontend renderer, not low-code runtime configuration and not a
    migration script.
  blast_radius: >-
    The default acceptance scope (sc_frontend_acceptance) keeps its exact guard.
    The new daily_dev scope is reachable only through a governed confirmed Make
    entry and only for DB_NAME=sc_demo with SC_ENVIRONMENT=dev. Fixture data is
    added to sc_demo only; sc-local-*, the isolated acceptance runtime,
    production tenants and the generic login default are unchanged.
    The smart_core change only narrows the superuser pass-through for
    base.group_public/base.group_portal; every SC capability guard keeps the
    pass-through, and no SC code reads those two groups.
    The daily fixture entry commits the deterministic fixture before its
    cross-transaction credential self-check, matching
    scripts/test/frontend_productization_fixture.sh; the isolated acceptance
    entry and every other credential path are unchanged.
  exclusions:
    - production_access
    - weakening_the_acceptance_scope_guard
    - weakening_the_payment_execution_business_guard
    - new_runtime_profiles
    - product_semantic_changes
  acceptance:
    - fixture_scope_unit_non_zero
    - daily_fixture_commits_before_the_credential_self_check
    - acceptance_scope_still_denies_non_acceptance_database
    - superuser_audience_group_boundary_orm_non_zero
    - daily_fixture_provisions_paid_executions_on_a_fresh_database
    - daily_probe_contract_section_pass
