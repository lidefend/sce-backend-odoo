schema_version: 1

goal:
  id: REMOTE-CI-PRECISION-20261124
  title: Separate remote frontend runtime and test-only backend execution
  status: active
  formal_product_layer: P4 ops delivery tool
  layer_target: exact-head CI risk classification and backend test planning
  module:
    - scripts/ci
    - config/ci
    - .github workflows
  standard_vs_user_specific: platform_engineering_standard
  objective: >-
    Prevent frontend tooling-only changes from running the full frontend runtime
    suite, and allow remote exact changed-test selectors when every impacted
    backend module change is test-only.
  why_here: >-
    The defects are in remote CI path classification and test planning. Product
    runtime, contracts, ACL, workflows and application behavior are unchanged.
  why_not_elsewhere:
    - Do not change product code or tests to satisfy the planner.
    - Do not weaken production module or frontend runtime coverage.
    - Do not add a second CI planner or evidence ledger.
    - Do not remove required exact-head gates.
  blast_radius:
    paths:
      - .agent/active-runs.json
      - .agent/goals/REMOTE-CI-PRECISION-20261124.yaml
      - .agent/runs/REMOTE-CI-PRECISION-20261124/run.json
      - docs/ops/iterations/remote_ci_precision_20261124.md
      - docs/ops/iteration_validation_responsibility_v1.md
      - docs/ops/dual_lane_fast_iteration_v1.md
      - docs/ops/validation_delivery_protocol.md
      - docs/ops/codex_workspace_execution_rules.md
      - config/ci/path_ownership_v1.json
      - scripts/ci/ci_path_ownership.py
      - scripts/ci/ci_risk_classifier.py
      - scripts/ci/gitee_gate_plan.py
      - scripts/ci/test_ci_path_ownership.py
      - scripts/ci/test_ci_risk_classifier.py
      - scripts/ci/test_ci_risk_workflow_contract.py
      - scripts/verify/test_gitee_gate_plan.py
      - scripts/ci/backend_suite_plan.py
      - scripts/ci/test_backend_suite_plan.py
      - .github/workflows/professional_quality_gate.yml
      - .github/workflows/frontend_release_gate.yml
    product_behavior: no product behavior change
  acceptance:
    - frontend runtime and frontend tooling ownership are distinct
    - tooling-only changes skip frontend runtime commands
    - production frontend changes retain standard or full frontend mode
    - test-only backend modules use exact changed-test selectors remotely
    - production backend changes retain full impacted module coverage
    - Gitee gate plans expose frontend runtime separately from tooling
    - unknown paths and mixed production/test changes fail closed to full scope
  exclusions:
    - product_code_change
    - database_or_fixture_write
    - required_gate_removal
    - deployment
  rollback: Revert this branch; no persistent data or deployed state changes.
