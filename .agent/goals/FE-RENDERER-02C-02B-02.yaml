schema_version: 1
goal:
  id: FE-RENDERER-02C-02B-02
  title: Sc Adapter、Scene Provider 与 Button-first 契约切片
  status: verification_pending
  formal_product_layer: P0 platform kernel product
  layer_target: Scene Primitive Port injection, Web Sc Adapter binding and conformance boundary
  module: Sc Design System, "@sc/ui/primitive-port", Scene Provider runtime and frontend verification
  standard_vs_user_specific: platform_engineering_standard
  why_here: >
    Scene 与基础组件之间的依赖倒置、Adapter 绑定、Provider 注入和一致性证明属于所有页面
    共享的前端平台机制。第一阶段必须先核对真实 Sc API、Provider 生命周期、测试能力和
    依赖守卫，再由总控冻结接口，不能直接接线或迁移业务消费者。
  why_not_elsewhere: >
    不在业务页面、行业 Renderer 或旧 Kit Runtime 中定义新的组件权威；不改变 Primitive
    Port 的 Props/Emits/Slots 或 runtime 语义，只为真实 SFC 的实例 bindings 放宽组件
    类型兼容；不改变 Contract V2、业务表达、后端权限或用户偏好，也不重新引入第二套
    基础控件实现。
