    product_behavior: internal_platform_adapter_slice_without_consumer_wiring
    authority: P0_provider_and_button_conformance_only
  objective: >
    在单一主线基线上完成 A/B/C/D 四条只读审计，并由总控冻结“七项 Provider 闭包 +
    Button-first 独立 Conformance”的顺序；实现 fixture-only 的同步零 Driver Scene Primitive
    Provider、真实 ScButton 薄包装及其类型、运行期、bundle 和浏览器契约证明。不接入产品页面，
    不把六项尚未补齐的 Sc Primitive 宣称为 Conformant。
  acceptance:
    - 七个 Sc Primitive 的真实 Props、Emits、Slots、Expose 与能力缺口有源码证据
    - Provider context、props、生命周期、旧 Kit 共存和 fail-closed 失败面形成候选设计
    - Conformance 覆盖编译期正反向、运行期、真实组件行为与虚假通过风险
    - 依赖方向、bundle、应用导入和增量路由形成分阶段守卫设计
    - 明确七 Primitive 全量 Provider 校验与 Button-first 试点之间的接口冲突
    - 第一阶段不修改产品源码、Primitive Port、Sc 组件、Provider、Scene 消费者、Kit 或 Token
      （历史阶段约束；后续当前切片仅按第 8 节放宽实例 bindings 类型）
    - 文档和 Agent 台账验证真实执行，之后等待总控接口冻结评审
    - 总控冻结七项 Provider 闭包与 Button-first 独立推进顺序，不降低 runtime validator
    - Provider 同步校验七项 Adapter、Adapter 变化后重新校验并在失败时隐藏 slot
    - Provider 外调用 context 明确失败，旧 SceneUiProvider 不修改
    - 真实 ScButton wrapper 通过 Props/Emits/Slots 编译期 witness 和浏览器行为契约
    - Button pointer/Enter/Space/programmatic 仅激活一次，disabled/loading 为零激活
    - Button focus/blur、loading ARIA/文案和 accessibleLabel 有真实 DOM 证据
    - scene-adapter、bundle、增量路由和 guard registry 的静态边界通过
    - 不修改产品页面、旧 Kit、Contract V2、后端、数据库或用户偏好
