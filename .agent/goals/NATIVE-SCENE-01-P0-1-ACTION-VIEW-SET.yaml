schema_version: 1
goal:
  id: NATIVE-SCENE-01-P0-1-ACTION-VIEW-SET
  title: Complete native Action identity and effective View Set
  status: active
  formal_product_layer: P0 platform kernel product
  layer_target: ActionResolver and PageAssembler Action/View identity
  module:
    - addons/smart_core
  baseline:
    branch: main
    full_sha: d159514c7bb64a4e99727e4349f5f39146c1c854
    prerequisite_pr: 904
  objective: >-
    Normalize a Window Action into a stable action identity and effective ordered
    View Set sourced from Odoo action.views, retain Action-bound View/Search IDs,
    keep menu/scenario references outside the Action identity, and reject request
    View IDs that are not Action candidates or authorized overrides.
  product_boundary:
    standard_vs_user_specific: platform-neutral Action/View projection mechanism
    why_here: >-
      Action identity, view ordering and request validation are generic P0
      mechanisms shared by all business modules.
    why_not_elsewhere:
      - no P1 industry semantics
      - no P2 customer configuration
      - no P3 low-code runtime configuration
      - no frontend renderer or protocol schema change
  deliverables:
    - addons/smart_core/core/native_action_view_set.py
    - addons/smart_core/app_config_engine/services/resolvers/action_resolver.py
    - addons/smart_core/app_config_engine/services/assemblers/page_assembler.py
    - addons/smart_core/handlers/ui_contract_preview.py
    - addons/smart_core/handlers/ui_contract_v2.py
    - addons/smart_core/tests/test_native_action_view_set_integration.py
    - addons/smart_core/tests/__init__.py
    - scripts/verify/test_native_action_view_set.py
    - scripts/verify/test_coverage_registry.yaml
    - scripts/verify/frontend_dev_incremental.py
    - scripts/verify/test_frontend_dev_incremental.py
    - scripts/verify/unified_page_contract_v2_assembler_guard.py
    - docs/audit/test_coverage_registry/
    - docs/engineering_convergence/complexity_budget_report.md
    - docs/engineering_convergence/split_plan_queue.md
    - docs/engineering_convergence/test_inventory.csv
    - docs/engineering_convergence/test_inventory_summary.md
    - make/guards.mk
    - make/ci.mk
    - docs/audit/native-scene-01/inventories/
    - docs/audit/native-scene-01/p0-1-action-view-set/implementation_record.md
  acceptance:
    - emit stable action identity fields including action XMLID, model, view_mode and search_view_id
    - preserve Odoo effective action.views order and duplicate same-type candidates as an array
    - supplement missing declared view types from view_mode without reordering effective action.views
    - select requested View IDs only from Action candidates or a verified preview override
    - keep menu/scene references out of Action identity
    - pass focused non-zero tests and local iteration gates
  exclusions:
    - Search Contract profile changes
    - Native Action Contract schema/root field
    - occurrence identity changes
    - frontend decoder, ActionView or Renderer changes
    - database, configuration or business-data changes
    - merge or deployment
  rollback: Revert the P0-1 source and focused-test commit; no persistent or schema state is created.
