schema_version: 1
goal:
  id: NATIVE-SCENE-01-P0-6-WIDGET-PROVENANCE
  title: Native Widget provenance and fail-closed resolution
  status: active
  formal_product_layer: P0 platform kernel product
  layer_target: Native View Widget source classification and Contract V2 component resolution
  module:
    - addons/smart_core
    - frontend/apps/web
  baseline:
    branch: main
    full_sha: bb63c755238b27c39844701411de4c4dddd8c17e
    prerequisites:
      - NATIVE-SCENE-01-B-S3-WIDGET-CONVERSION
      - NATIVE-SCENE-01-P0-4-OCCURRENCE-IDENTITY
  objective: >-
    Preserve whether a field Widget came from explicit Odoo View XML, field
    metadata, or a compatibility default, and prevent an unsupported explicit
    Widget from silently becoming an unrelated type-derived input control.
  product_boundary:
    standard_vs_user_specific: platform-neutral native View semantic
    why_here: >-
      Widget provenance, semantic resolution and fail-closed component identity
      are generic Contract V2 mechanisms shared by every Odoo module.
    why_not_elsewhere:
      - no industry model or customer preference belongs in P0
      - no page-specific frontend fallback is accepted as native authority
      - no Renderer redesign is included
      - no persistent model or low-code configuration is introduced
  deliverables:
    - addons/smart_core/app_config_engine/services/view_Parser/base.py
    - "addons/smart_core/app_config_engine/services/view_Parser/parsers Tree Form.py"
    - addons/smart_core/core/unified_page_contract_v2_assembler.py
    - addons/smart_core/core/contract_runtime/semantic_resolver.py
    - contracts/registry/semantic.yaml
    - contracts/registry/component.yaml
    - frontend/apps/web/src/app/contracts/v2/types.ts
    - frontend/apps/web/src/app/contracts/v2/schema.ts
    - scripts/verify/frontend_dev_incremental.py
    - make/ci.mk
    - make/guards.mk
    - make/frontend.mk
    - focused backend and frontend tests
    - docs/audit/native-scene-01/p0-6-widget-provenance/implementation_record.md
  acceptance:
    - explicit Odoo XML Widget source is distinguishable from field-type derivation
    - type-derived and compatibility defaults never publish as nativeWidget
    - unsupported explicit Widget resolves to an explicit fail-closed component status
    - known explicit Widget behavior remains unchanged
    - frontend Decoder validates the Widget provenance shape
    - producer and decoder changes ship in the same candidate
    - local iteration and freeze preparation evaluate merge-stage runtime evidence while deployment-only evidence remains deferred
    - non-zero targeted backend and frontend tests pass
  exclusions:
    - List/Kanban/Activity Widget Renderer implementation
    - embedded <widget name> node implementation
    - Domain/Context compilation
    - Gantt, Calendar, Pivot, Graph or Dashboard work
    - database, ACL, record-rule or business configuration changes
    - deployment or product acceptance
  rollback: Revert the P0-6 Producer, Decoder, registry and focused-test commit together.
