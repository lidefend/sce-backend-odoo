schema_version: 1

goal:
  id: CONTRACT-CONSUMER-EVIDENCE-20261125
  title: contract_consumer_error_evidence_and_runtime_routing
  status: blocked
  formal_product_layer: P0/P4
  layer_target: generic contract-consumer error evidence and risk-selected runtime validation
  module:
    - frontend
    - scripts/ci
    - scripts/verify
  standard_vs_user_specific: platform_standard
  objective: >-
    Preserve the original frontend consumer failure stage and component evidence
    at the contract error boundary, and make generic form, overlay and relation
    carrier changes deterministically select their owning runtime validation.
  product_result: >-
    A consumer error identifies whether it is a contract declaration problem,
    a contract decode mismatch or a frontend implementation failure without
    losing the original lifecycle stage, while affected general UI changes
    trigger the lifecycle and contract runtime checks that can expose composed
    failures.
  why_here:
    - Error attribution, overlay lifecycle and path-to-check routing are cross-industry platform mechanisms.
    - The runtime diagnostic must consume the same producer contract rather than invent construction-specific behavior.
  why_not_elsewhere:
    - No construction business semantics belong in this platform fix.
    - No database, fixture or product scenario data is required.
    - No second task or contract engine will be introduced.
  blast_radius:
    - generic ContractFormPage and ActionView consumer error surfaces
    - shared ScDialog lifecycle validation
    - local incremental and remote frontend risk routing
  acceptance:
    - Consumer defects retain stage, component trace and original error identity.
    - Generic form and overlay changes select their lifecycle checks.
    - Contract-carrier changes select the bounded production contract diagnostic.
    - Unknown errors do not become contract-missing declarations.
  exclusions:
    - No product business-state changes.
    - No database migration, fixture rebuild or demo-data modification.
    - No deployment.
  rollback: Revert the owning P0/P4 commits.
