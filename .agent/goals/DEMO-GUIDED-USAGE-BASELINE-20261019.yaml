  constraints:
    - 先做只读覆盖盘点，再按缺口分批补数；不为凑数创建无业务意义的记录
    - 组织事实由 DEMO-ORG-MASTER-20261019 提供，本任务不重复创建部门/岗位/员工
    - 不写权限语义字段；不改变产品契约与前端
    - 每条新增样例必须绑定正式入口/动作，并在批次记录登记覆盖矩阵
    - 不 commit/push/部署；由调度者安排受管 seed 与回读
  next_exact_step: >-
