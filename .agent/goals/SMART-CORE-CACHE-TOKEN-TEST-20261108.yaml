    Replace the non-discriminating business-category projection test with explicit
    non-empty before/after token assertions for each projected field.
  acceptance:
    - form_policy_json change invalidates a non-empty source token
    - required_fields_json change invalidates a non-empty source token
    - default_values_json change invalidates a non-empty source token
    - name change remains independently covered
    - non-projection metadata keeps a stable non-empty token
  exclusions:
