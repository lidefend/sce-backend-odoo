schema_version: 1
goal:
  id: FE-SYSTEMIC-CONVERGENCE-M5-20261110
  title: "自定义前端系统性收敛 M5 富文本净化收敛"
  status: completed
  formal_product_layer: P0 platform kernel product
  layer_target: generic safe rich-text rendering boundary
  module: frontend rich-text formatter, native form canvas, professional fields and scene overview
  standard_vs_user_specific: platform_engineering_standard
  why_here: >
    Rich-text sanitization and rendering are generic frontend security and
    presentation mechanisms shared by contract-driven surfaces.
  why_not_elsewhere: >
    No business copy or field semantics is changing. Page-local sanitizers or
    naked v-html sites would multiply security authority and style behavior.
  blast_radius:
    paths:
      - .agent/active-runs.json
      - .agent/goals/FE-SYSTEMIC-CONVERGENCE-M5-20261110.yaml
      - .agent/runs/FE-SYSTEMIC-CONVERGENCE-M5-20261110/run.json
      - docs/engineering_convergence/complexity_budget_report.md
      - docs/engineering_convergence/e2e_journey_matrix.md
      - docs/engineering_convergence/split_plan_queue.md
      - docs/engineering_convergence/test_inventory.csv
      - docs/engineering_convergence/test_inventory_summary.md
      - docs/frontend_productization/rendering-detail/component-driver-takeover-inventory-v1.json
      - docs/ops/iterations/frontend_systemic_m5_rich_text_20261110.md
      - frontend/apps/web/scripts/
      - frontend/apps/web/src/
      - scripts/verify/
      - make/frontend.mk
    product_behavior: >
      The same sanitized rich text renders with equivalent readable content and
      wrapping while every Vue consumer routes through one safe component.
  objective: >
    Consolidate all four current v-html consumers behind one sanitized rich-text
    component and prohibit new naked v-html use.
  acceptance:
    - one reviewed component owns v-html
    - naked v-html outside that component is zero
    - readonly and restricted sanitization policies remain distinct
    - targeted component and consumer tests pass non-zero
    - affected 1440/390 golden samples remain stable
  exclusions:
    - contract_v2_change
    - acl_or_permission_change
    - backend_business_logic
    - database_or_runtime_write
    - deployment
  rollback: Revert M5 commits; no persistent data or service state is involved.
