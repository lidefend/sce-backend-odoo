services:

  # ============================================================
  # PostgreSQL 数据库（后端核心）
  # ============================================================
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-odoo} -d ${DB_NAME} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis（缓存 / 队列）
  # ============================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Odoo 后端服务（核心）
  # ============================================================
  odoo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-default}
        ODOO_BASE_IMAGE: ${ODOO_BASE_IMAGE:-odoo:17.0@sha256:f88f646a0f5fc0b225995ee28953d9ce7367cc731b1756765114691fb97d18e5}
        SOURCE_SHA: ${SOURCE_SHA:-unknown}
    image: ${ODOO_IMAGE:-odoo17-odoo:latest}
    restart: unless-stopped

    # 解决屏幕闪烁问题
    tty: true
    stdin_open: true

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - ${ENV_FILE:-.env}

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ODOO_DBFILTER: ${ODOO_DBFILTER}
      LIST_DB: ${LIST_DB:-false}

      ADMIN_PASSWD: ${ADMIN_PASSWD}
      JWT_SECRET: ${JWT_SECRET}
      SC_BOOTSTRAP_SECRET: ${SC_BOOTSTRAP_SECRET}
      SC_BOOTSTRAP_LOGIN: ${SC_BOOTSTRAP_LOGIN}
      SCENE_CHANNEL: ${SCENE_CHANNEL}
      SCENE_USE_PINNED: ${SCENE_USE_PINNED}
      SCENE_ROLLBACK: ${SCENE_ROLLBACK}
      # Source-mounted acceptance runtimes must expose the exact candidate SHA
      # through system.init; callers set this explicitly and unknown fails
      # closed in browser acceptance.
      SC_SOURCE_REVISION: ${SC_SOURCE_REVISION:-unknown}

      REDIS_HOST: redis
      # === 新增：runtime 明确配置出口 ===
      ODOO_CONF_OUT: /var/lib/odoo/odoo.conf
      ODOO_DB: ${DB_NAME}
      
      # 终端环境变量
      TERM: xterm-256color
      COLORTERM: truecolor

    volumes:
      - odoo_data:/var/lib/odoo
      - odoo_data:/opt/sce-runtime
      # Development source mount. Immutable production candidates do not use
      # this path; they contain only /mnt/product-addons and may mount one
      # private customer artifact through docker-compose.customer-addons.yml.
      - ./addons:/mnt/source-addons
      # Demo payload is physically isolated from the product addons tree
      # (PRODUCTIZATION R3). Development/CI/audit surfaces mount it here;
      # immutable production images never COPY or mount this root.
      - ./demo_addons:/mnt/demo-addons
      - ./addons_external:/mnt/addons_external
      - ./artifacts:/mnt/artifacts
      - ./scripts:/mnt/scripts:ro
      - ./docs:/mnt/docs:ro
      # Daily/source-mounted runtimes do not carry the immutable image copy at
      # /opt/sce-product/VERSION, so expose the same repository authority there.
      - ./VERSION:/opt/sce-product/VERSION:ro
      - ./config/odoo.conf.template:/etc/odoo/odoo.conf.template:ro
      - ./scripts/render_odoo_conf.py:/usr/local/bin/render_odoo_conf.py:ro
      - ./scripts/odoo-entrypoint.sh:/usr/local/bin/odoo-entrypoint.sh:ro

    ports:
      - "${ODOO_PORT:-8069}:8069"

    entrypoint: [ "/bin/sh", "/usr/local/bin/odoo-entrypoint.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=8)\"" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  # ============================================================
  # NGINX 统一反向代理
  # ============================================================
  nginx:
    image: nginx:latest
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_healthy
    environment:
      # Rendered into the proxy's database fallback by the image's envsubst
      # entrypoint.  Only these proxy variables are substituted, so nginx's own
      # $variables in the template survive verbatim.  The platform route is a
      # declared database-to-upstream mapping; a profile that does not serve the
      # platform control duty points it back at its own application, where the
      # exact dbfilter refuses a database it does not own.
      SC_PROXY_DEFAULT_DB: ${DB_NAME}
      SC_PROXY_PLATFORM_DB: ${SC_PROXY_PLATFORM_DB:-sc_platform_control}
      SC_PROXY_PLATFORM_UPSTREAM: ${SC_PROXY_PLATFORM_UPSTREAM:-odoo:8069}
      # The governed daily stack always renders the exact entry route set.  The
      # generic local profile keeps its previous pass-through behaviour so an
      # unrelated development database is not refused by this default.
      SC_PROXY_ALLOWED_DB_PATTERN: '${SC_PROXY_ALLOWED_DB_PATTERN:-~^.+$}'
      NGINX_ENVSUBST_FILTER: '^SC_PROXY_(DEFAULT_DB|PLATFORM_DB|PLATFORM_UPSTREAM|ALLOWED_DB_PATTERN)$'
    volumes:
      - ./config/nginx/templates:/etc/nginx/templates:ro
      - ${FRONTEND_DIST_DIR:-./frontend/apps/web/dist}:/usr/share/nginx/html:ro
    ports:
      - "${NGINX_PORT:-18080}:80"
    healthcheck:
      test: [ "CMD-SHELL", "nginx -t || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
    name: ${DB_DATA}
  redis_data:
    name: ${REDIS_DATA}
  odoo_data:
    name: ${ODOO_DATA}
