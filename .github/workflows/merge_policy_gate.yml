name: merge_policy_gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:candidate'
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.risk.outputs.lane }}
      head: ${{ steps.identity.outputs.head }}
      frontend_mode: ${{ steps.risk.outputs.frontend_mode }}
      professional_mode: ${{ steps.risk.outputs.professional_mode }}
      candidate_requested: ${{ github.event_name != 'pull_request' || github.event.action == 'labeled' && github.event.label.name == 'ci:candidate' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: risk
        run: >-
          python3 scripts/ci/ci_risk_classifier.py
          --base "${{ github.event.pull_request.base.sha || github.event.before || github.sha }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"
          --event "$GITHUB_EVENT_NAME"
          --ref "$GITHUB_REF" --github-output "$GITHUB_OUTPUT"

  fast:
    needs: classify
    if: needs.classify.outputs.lane == 'FAST'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.classify.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -euo pipefail
          python3 scripts/ci/test_ci_risk_classifier.py
          python3 scripts/ci/test_ci_risk_workflow_contract.py
          python3 scripts/ci/test_select_authoritative_workflow_run.py
          python3 scripts/verify/test_repository_clean_history_guard.py
          python3 scripts/verify/test_github_actions_security_guard.py
          python3 scripts/verify/github_actions_security_guard.py
          make verify.product.release.version
          git diff --check

  merge_policy_gate:
    name: merge_policy_gate
    needs: [classify, fast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.classify.outputs.head }}
          persist-credentials: false

      - name: Resolve merge-policy lane once
        run: |
          set -euo pipefail
          if [ "${{ needs.classify.outputs.lane }}" = "FAST" ]; then
            test "${{ needs.fast.result }}" = success
            exit 0
          fi
          test "${{ needs.fast.result }}" = skipped

      - name: Publish lane summary
        env:
          RISK_LANE: ${{ needs.classify.outputs.lane }}
          FRONTEND_MODE: ${{ needs.classify.outputs.frontend_mode }}
          PROFESSIONAL_MODE: ${{ needs.classify.outputs.professional_mode }}
          CANDIDATE_REQUESTED: ${{ needs.classify.outputs.candidate_requested }}
          FAST_RESULT: ${{ needs.fast.result }}
        run: |
          set -euo pipefail
          effective_frontend="${FRONTEND_MODE}"
          effective_professional="${PROFESSIONAL_MODE}"
          if [ "${CANDIDATE_REQUESTED}" != "true" ]; then
            if [ "${effective_frontend}" = "full" ]; then
              effective_frontend="standard"
            fi
            if [ "${effective_professional}" = "full" ]; then
              effective_professional="governance"
            fi
          fi
          if [ "${RISK_LANE}" = "FAST" ]; then
            selected_lane="fast"
          else
            selected_lane="required"
          fi
          {
            echo "## Merge Policy Lane"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Risk lane | ${RISK_LANE} |"
            echo "| Candidate requested | ${CANDIDATE_REQUESTED} |"
            echo "| Effective aggregate lane | ${selected_lane} |"
            echo "| Effective frontend lane | ${effective_frontend} |"
            echo "| Effective professional lane | ${effective_professional} |"
            echo "| Fast job result | ${FAST_RESULT} |"
            echo ""
            if [ "${CANDIDATE_REQUESTED}" != "true" ] && { [ "${FRONTEND_MODE}" = "full" ] || [ "${PROFESSIONAL_MODE}" = "full" ]; }; then
              echo "Ordinary PR governance changes were downgraded from candidate-grade validation to daily iteration lanes."
            elif [ "${CANDIDATE_REQUESTED}" = "true" ]; then
              echo "Explicit candidate validation was requested for this exact head."
            else
              echo "This head stayed on the default daily iteration lanes."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
