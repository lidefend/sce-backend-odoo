name: professional_quality_gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: professional-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  professional_authorization:
    name: professional_authorization
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    outputs:
      lane: ${{ steps.risk.outputs.lane }}
      professional_mode: ${{ steps.risk.outputs.professional_mode }}
      frontend_changed: ${{ steps.risk.outputs.frontend_changed }}
      backend_changed: ${{ steps.risk.outputs.backend_changed }}
      candidate_requested: ${{ github.event_name != 'pull_request' || github.event.action == 'labeled' && github.event.label.name == 'ci:candidate' }}
    steps:
      - name: Deny forks and non-owner actors
        env:
          EXPECTED_REPOSITORY: lidefend/sce-backend-odoo
          EXPECTED_OWNER: lidefend
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail
          test "${REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${REPOSITORY_OWNER}" = "${EXPECTED_OWNER}"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            test "${HEAD_REPOSITORY}" = "${REPOSITORY}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            test "${REF}" = "refs/heads/main"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            test "${ACTOR}" = "${REPOSITORY_OWNER}"
          else
            exit 1
          fi

      - name: Checkout authorized commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify change risk
        id: risk
        run: |
          set -euo pipefail
          python3 scripts/ci/ci_risk_classifier.py \
            --base "${BASE_SHA}" \
            --head "${CHECKOUT_SHA}" \
            --event "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Prove chatter timeline authorization with real ORM
        if: >-
          github.event_name != 'push' &&
          steps.risk.outputs.professional_mode == 'full' &&
          steps.risk.outputs.backend_changed == 'true'
        run: make test.chatter-timeline.authorization.orm

  python310_runtime_compatibility:
    name: python310_runtime_compatibility
    if: >-
      github.repository == 'lidefend/sce-backend-odoo' &&
      github.event_name != 'push' &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - name: Checkout authorized commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify change risk
        id: risk
        run: |
          set -euo pipefail
          python3 scripts/ci/ci_risk_classifier.py \
            --base "${BASE_SHA}" \
            --head "${CHECKOUT_SHA}" \
            --event "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Install Python 3.10
        if: steps.risk.outputs.professional_mode == 'full'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Verify production admin identity tool on Python 3.10
        if: steps.risk.outputs.professional_mode == 'full'
        run: |
          set -euo pipefail
          python --version
          python -m py_compile scripts/release/production_admin_identity_baseline.py
          python scripts/release/test_production_admin_identity_baseline.py
          python -m py_compile scripts/release/production_user_activation_readiness.py
          python scripts/release/test_production_user_activation_readiness.py
          python -m py_compile scripts/release/production_user_activation_predeploy.py
          python scripts/release/test_production_user_activation_predeploy.py
          python -m py_compile scripts/release/production_public_signup_close.py
          python scripts/release/test_production_public_signup_close.py
          set +e
          output="$(env -i PATH="${PATH}" python \
            scripts/release/production_admin_identity_baseline.py 2>&1)"
          status=$?
          set -e
          test "${status}" -ne 0
          grep -F "ENV=prod is required" <<<"${output}"

  professional_quality_gate:
    name: professional_quality_gate
    needs: professional_authorization
    if: >-
      always() &&
      needs.professional_authorization.result == 'success' &&
      github.repository == 'lidefend/sce-backend-odoo' &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_REMOTE_URL: https://github.com/lidefend/sce-backend-odoo.git
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      CI_PROJECT_NAME: sc-prof-${{ github.run_id }}
      CANDIDATE_REQUESTED: ${{ needs.professional_authorization.outputs.candidate_requested }}
      PROFESSIONAL_MODE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'mainline' || (needs.professional_authorization.outputs.candidate_requested == 'true' && needs.professional_authorization.outputs.professional_mode) || (needs.professional_authorization.outputs.professional_mode == 'full' && needs.professional_authorization.outputs.backend_changed == 'true' && 'standard_backend') || (needs.professional_authorization.outputs.professional_mode == 'full' && needs.professional_authorization.outputs.frontend_changed == 'true' && 'standard_frontend') || (needs.professional_authorization.outputs.professional_mode == 'full' && 'governance') || needs.professional_authorization.outputs.professional_mode }}
      FRONTEND_CHANGED: ${{ needs.professional_authorization.outputs.frontend_changed }}
      BACKEND_CHANGED: ${{ needs.professional_authorization.outputs.backend_changed }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout exact authoritative GitHub commit
        run: |
          set -euo pipefail
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init "${GITHUB_WORKSPACE}"
          git remote add origin "${CI_REMOTE_URL}"
          for attempt in 1 2 3; do
            if timeout 60 git fetch --no-tags origin "${BASE_SHA}" &&
              timeout 60 git fetch --no-tags origin "${HEAD_SHA}" &&
              test "$(git rev-parse FETCH_HEAD)" = "${HEAD_SHA}"; then
              git checkout --detach FETCH_HEAD
              test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          echo "authoritative GitHub checkout failed for authorized commit" >&2
          exit 1

      - name: Re-prove checkout identity after base fetch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"

      - name: Restore pip dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-python-${{ hashFiles('requirements-odoo.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-python-

      - name: Run full professional quality gate (parallel shards)
        if: env.PROFESSIONAL_MODE == 'full'
        run: |
          set -euo pipefail
          # Determine which shards to run based on change type
          # If only docs/config changed (no frontend/backend code), skip test shard
          RUN_TESTS=1
          if [ "${FRONTEND_CHANGED}" = "false" ] && [ "${BACKEND_CHANGED}" = "false" ]; then
            echo "Change detected: docs/config only - skipping test shard"
            RUN_TESTS=0
          fi
          # Run shards in parallel
          make ci.professional.backend.shard-verify &
          pid_verify=$!
          make ci.professional.backend.shard-reports &
          pid_reports=$!
          if [ "${RUN_TESTS}" = "1" ]; then
            make ci.professional.backend.shard-tests &
            pid_tests=$!
          fi
          # Wait for all shards and capture exit codes
          status_verify=0
          status_reports=0
          status_tests=0
          wait "${pid_verify}" || status_verify=$?
          wait "${pid_reports}" || status_reports=$?
          if [ "${RUN_TESTS}" = "1" ]; then
            wait "${pid_tests}" || status_tests=$?
          fi
          # Fail if any shard failed
          test "${status_verify}" -eq 0
          test "${status_reports}" -eq 0
          test "${status_tests}" -eq 0
          if [ "${RUN_TESTS}" = "1" ]; then
            echo "[OK] All professional backend shards passed (verify + reports + tests)"
          else
            echo "[OK] Professional backend shards passed (verify + reports only, tests skipped for docs/config change)"
          fi

      - name: Run mainline integrity gate
        if: env.PROFESSIONAL_MODE == 'mainline'
        run: |
          set -euo pipefail
          python3 scripts/ci/test_ci_risk_classifier.py
          python3 scripts/ci/test_ci_risk_workflow_contract.py
          python3 scripts/verify/test_github_actions_security_guard.py
          python3 scripts/verify/github_actions_security_guard.py
          make verify.product.release.version
          make ci.generated_reports.guard architecture.complexity_baseline_lock
          git diff --check

      - name: Run standard backend quality gate
        if: env.PROFESSIONAL_MODE == 'standard_backend'
        run: |
          set -euo pipefail
          make test.unit test.contract test.e2e.preflight
          make verify.tenant.data_responsibility_boundary \
            verify.tenant.module_set_matrix \
            verify.tenant.payload_boundary \
            verify.tenant.product_legacy_boundary \
            verify.tenant.legacy_xmlid_boundary
          make ci.generated_reports.guard architecture.complexity_baseline_lock
          git diff --check

      - name: Run governance-only quality gate
        if: env.PROFESSIONAL_MODE == 'governance'
        run: |
          set -euo pipefail
          python3 scripts/ci/test_ci_risk_classifier.py
          python3 scripts/ci/test_ci_risk_workflow_contract.py
          python3 scripts/verify/test_github_actions_security_guard.py
          python3 scripts/verify/github_actions_security_guard.py
          make verify.product.release.version
          make ci.generated_reports.guard architecture.complexity_baseline_lock
          git diff --check

      - name: Run Fast lightweight quality gate
        if: env.PROFESSIONAL_MODE == 'fast'
        run: |
          set -euo pipefail
          python3 scripts/ci/test_ci_risk_classifier.py
          python3 scripts/verify/test_github_actions_security_guard.py
          python3 scripts/verify/github_actions_security_guard.py
          make verify.product.release.version
          git diff --check

      - name: Run standard frontend quality gate
        if: env.PROFESSIONAL_MODE == 'standard_frontend'
        run: |
          set -euo pipefail
          python3 scripts/ci/frontend_professional_extension_guard.py
          python3 scripts/ci/test_ci_risk_classifier.py
          python3 scripts/verify/test_github_actions_security_guard.py
          python3 scripts/verify/github_actions_security_guard.py
          make verify.product.release.version
          make ci.generated_reports.guard architecture.complexity_baseline_lock
          git diff --check

      - name: Clean isolated runner state
        if: always()
        run: bash scripts/ci/self_hosted_runner_cleanup.sh
