name: professional_quality_gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: professional-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  professional_authorization:
    name: professional_authorization
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    outputs:
      lane: ${{ steps.risk.outputs.lane }}
      professional_mode: ${{ steps.risk.outputs.professional_mode }}
    steps:
      - name: Deny forks and non-owner actors
        env:
          EXPECTED_REPOSITORY: lidefend/sce-backend-odoo
          EXPECTED_OWNER: lidefend
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail
          test "${REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${REPOSITORY_OWNER}" = "${EXPECTED_OWNER}"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            test "${HEAD_REPOSITORY}" = "${REPOSITORY}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            test "${REF}" = "refs/heads/main"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            test "${ACTOR}" = "${REPOSITORY_OWNER}"
          else
            exit 1
          fi

      - name: Checkout authorized commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify change risk
        id: risk
        run: |
          set -euo pipefail
          python3 scripts/ci/ci_risk_classifier.py \
            --base "${BASE_SHA}" \
            --head "${CHECKOUT_SHA}" \
            --event "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Prove chatter timeline authorization with real ORM
        if: >-
          steps.risk.outputs.professional_mode == 'full' &&
          steps.risk.outputs.backend_changed == 'true'
        run: make test.chatter-timeline.authorization.orm

  python310_runtime_compatibility:
    name: python310_runtime_compatibility
    needs: professional_authorization
    if: >-
      github.repository == 'lidefend/sce-backend-odoo' &&
      needs.professional_authorization.outputs.professional_mode == 'full' &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authorized commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Verify production admin identity tool on Python 3.10
        run: |
          set -euo pipefail
          python --version
          python -m py_compile scripts/release/production_admin_identity_baseline.py
          python scripts/release/test_production_admin_identity_baseline.py
          python -m py_compile scripts/release/production_user_activation_readiness.py
          python scripts/release/test_production_user_activation_readiness.py
          python -m py_compile scripts/release/production_user_activation_predeploy.py
          python scripts/release/test_production_user_activation_predeploy.py
          python -m py_compile scripts/release/production_public_signup_close.py
          python scripts/release/test_production_public_signup_close.py
          set +e
          output="$(env -i PATH="${PATH}" python \
            scripts/release/production_admin_identity_baseline.py 2>&1)"
          status=$?
          set -e
          test "${status}" -ne 0
          grep -F "ENV=prod is required" <<<"${output}"

  professional_quality_gate:
    name: professional_quality_gate
    needs: [professional_authorization, python310_runtime_compatibility]
    if: >-
      always() &&
      needs.professional_authorization.result == 'success' &&
      (needs.python310_runtime_compatibility.result == 'success' ||
      needs.python310_runtime_compatibility.result == 'skipped') &&
      github.repository == 'lidefend/sce-backend-odoo' &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_REMOTE_URL: https://github.com/lidefend/sce-backend-odoo.git
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      CI_PROJECT_NAME: sc-prof-${{ github.run_id }}
      PROFESSIONAL_MODE: ${{ needs.professional_authorization.outputs.professional_mode }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout exact authoritative GitHub commit
        run: |
          set -euo pipefail
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init "${GITHUB_WORKSPACE}"
          git remote add origin "${CI_REMOTE_URL}"
          for attempt in 1 2 3 4 5; do
            if timeout 90 git fetch --no-tags origin "${BASE_SHA}" &&
              timeout 90 git fetch --no-tags origin "${HEAD_SHA}" &&
              test "$(git rev-parse FETCH_HEAD)" = "${HEAD_SHA}"; then
              git checkout --detach FETCH_HEAD
              test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          echo "authoritative GitHub checkout failed for authorized commit" >&2
          exit 1

      - name: Re-prove checkout identity after base fetch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"

      - name: Run full professional quality gate
        if: env.PROFESSIONAL_MODE == 'full'
        run: make ci.professional.backend

      - name: Run standard backend quality gate
        if: env.PROFESSIONAL_MODE == 'standard_backend'
        run: |
          set -euo pipefail
          make test.unit test.contract test.e2e.preflight
          make verify.tenant.data_responsibility_boundary \
            verify.tenant.module_set_matrix \
            verify.tenant.payload_boundary \
            verify.tenant.product_legacy_boundary \
            verify.tenant.legacy_xmlid_boundary
          make ci.generated_reports.guard architecture.complexity_baseline_lock
          git diff --check

      - name: Run lightweight fixed-check contract
        if: env.PROFESSIONAL_MODE == 'fast' || env.PROFESSIONAL_MODE == 'standard_frontend'
        run: |
          set -euo pipefail
          python3 scripts/ci/test_ci_risk_classifier.py
          python3 scripts/verify/test_github_actions_security_guard.py
          python3 scripts/verify/github_actions_security_guard.py
          make verify.product.release.version
          if [ "${PROFESSIONAL_MODE}" = "standard_frontend" ]; then
            make ci.generated_reports.guard architecture.complexity_baseline_lock
          fi
          git diff --check

      - name: Clean isolated runner state
        if: always()
        run: bash scripts/ci/self_hosted_runner_cleanup.sh
