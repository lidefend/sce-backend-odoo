name: backend_test_suite

# R9 (productization audit): automated entry for the backend Odoo test
# suite, which needs a live database. Runs nightly on the default branch
# and on demand; each module with a tests/ directory is tested in an
# isolated per-run database. Odoo tests and repository-level Python unit
# tests use their respective governed runners; a zero-test Odoo invocation
# is never accepted as a passing result.

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      head_ref:
        required: true
        type: string
  schedule:
    - cron: "37 19 * * *"  # 03:37 Asia/Shanghai nightly
  workflow_dispatch:
    inputs:
      head_ref:
        description: "Branch or tag to test (default: default branch)"
        required: false
        default: ""
      modules:
        description: "Comma-separated module override (default: all runnable module tests)"
        required: false
        default: ""
      test_tags:
        description: "Odoo --test-tags override (default: module default tags)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: backend-test-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.repository == 'lidefend/sce-backend-odoo' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      head: ${{ steps.scope.outputs.head }}
    steps:
      - name: Checkout exact candidate for scope planning
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Partition exact scope without reducing coverage
        id: scope
        env:
          IMPACT_BASE: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha || github.sha }}
          MODULE_OVERRIDE: ${{ github.event.inputs.modules }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          python3 scripts/ci/backend_suite_plan.py --base "${IMPACT_BASE}" \
            --head "${HEAD_SHA}" --modules "${MODULE_OVERRIDE}" \
            --output "${RUNNER_TEMP}/backend-plan.json" --github-output "${GITHUB_OUTPUT}"
          cat "${RUNNER_TEMP}/backend-plan.json" >> "${GITHUB_STEP_SUMMARY}"

  backend_suite:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      CI_REMOTE_URL: https://github.com/lidefend/sce-backend-odoo.git
      HEAD_REF: ${{ inputs.head_ref || github.event.inputs.head_ref || github.ref_name }}
      HEAD_SHA: ${{ inputs.head_sha || github.sha }}
      IMPACT_BASE: ${{ inputs.base_sha }}
      CI_PROJECT_NAME: sc-suite-${{ github.run_id }}-${{ matrix.index }}
      COMPOSE_PROJECT_NAME: sc-suite-${{ github.run_id }}-${{ matrix.index }}
      DB_NAME: sc_suite_ci
      TEST_TAGS_INPUT: ${{ github.event.inputs.test_tags }}
      SHARD_INDEX: ${{ matrix.index }}
      MODULE_OVERRIDE: ${{ github.event.inputs.modules }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout exact authoritative GitHub commit
        run: |
          set -euo pipefail
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init "${GITHUB_WORKSPACE}"
          git remote add origin "${CI_REMOTE_URL}"
          for attempt in 1 2 3 4 5; do
            if timeout 90 git fetch --no-tags origin \
              "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}" && \
              git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              git checkout --detach "${HEAD_SHA}"
              git config --global --add safe.directory "${GITHUB_WORKSPACE}"
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          echo "GitHub checkout failed for ${HEAD_REF}/${HEAD_SHA}" >&2
          exit 1

      - name: Resolve module list
        run: |
          set -euo pipefail
          if [ -n "${IMPACT_BASE}" ]; then
            git fetch --no-tags origin "${IMPACT_BASE}"
          fi
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          MODULES=""
          PYTHON_MODULES=""
          # Recompute the partition from exact trees; a matrix value cannot
          # supply or silently shrink the module list.
          candidates="$(python3 scripts/ci/backend_suite_plan.py --base "${IMPACT_BASE}" \
            --head "${HEAD_SHA}" --modules "${MODULE_OVERRIDE}" --shard "${SHARD_INDEX}" \
            --output "${RUNNER_TEMP}/backend-plan.json")"
          cat "${RUNNER_TEMP}/backend-plan.json" >> "${GITHUB_STEP_SUMMARY}"
          for module in ${candidates}; do
            test_dir=""
            for root in addons demo_addons; do
              if [ -d "${root}/${module}/tests" ]; then
                test_dir="${root}/${module}/tests"
                break
              fi
            done
            test -n "${test_dir}" || { echo "module ${module} has no tests/ directory" >&2; exit 1; }
            if grep -RqsE '(^|[[:space:]])(from|import)[[:space:]]+odoo\.tests' "${test_dir}"; then
              MODULES="${MODULES} ${module}"
            else
              PYTHON_MODULES="${PYTHON_MODULES} ${module}"
            fi
          done
          test -n "${MODULES}${PYTHON_MODULES}" || { echo "no runnable module tests found"; exit 1; }
          MODULES="${MODULES# }"
          PYTHON_MODULES="${PYTHON_MODULES# }"
          echo "MODULES=${MODULES}" >> "${GITHUB_ENV}"
          echo "PYTHON_MODULES=${PYTHON_MODULES}" >> "${GITHUB_ENV}"
          printf 'backend Odoo modules:\n%s\n' "${MODULES:-<none>}"
          printf 'backend Python unit modules:\n%s\n' "${PYTHON_MODULES:-<none>}"

      - name: Configure compose environment
        run: |
          set -euo pipefail
          ci_env="${RUNNER_TEMP}/backend-suite-env-${GITHUB_RUN_ID}"
          db_password="$(openssl rand -hex 16)"
          admin_password="$(openssl rand -hex 16)"
          jwt_secret="$(openssl rand -hex 24)"
          bootstrap_secret="$(openssl rand -hex 16)"
          for secret_value in "${db_password}" "${admin_password}" "${jwt_secret}" "${bootstrap_secret}"; do
            echo "::add-mask::${secret_value}"
          done
          {
            printf 'DB_USER=odoo\n'
            printf 'DB_PASSWORD=%s\n' "${db_password}"
            printf 'DB_NAME=%s\n' "${DB_NAME}"
            printf 'ADMIN_PASSWD=%s\n' "${admin_password}"
            printf 'JWT_SECRET=%s\n' "${jwt_secret}"
            printf 'SC_BOOTSTRAP_SECRET=%s\n' "${bootstrap_secret}"
            printf 'SC_BOOTSTRAP_LOGIN=backend_suite_ci\n'
            printf 'SCENE_CHANNEL=stable\n'
            printf 'SCENE_USE_PINNED=0\n'
            printf 'SCENE_ROLLBACK=0\n'
            printf 'ODOO_DBFILTER=^%s$\n' "${DB_NAME}"
            printf 'DB_DATA=%s-db-data\n' "${COMPOSE_PROJECT_NAME}"
            printf 'REDIS_DATA=%s-redis-data\n' "${COMPOSE_PROJECT_NAME}"
            printf 'ODOO_DATA=%s-odoo-data\n' "${COMPOSE_PROJECT_NAME}"
            printf 'SC_ENVIRONMENT=test\n'
          } > "${ci_env}"
          {
            printf 'ENV_FILE=%s\n' "${ci_env}"
            printf 'DB_USER=odoo\n'
            printf 'DB_PASSWORD=%s\n' "${db_password}"
            printf 'ADMIN_PASSWD=%s\n' "${admin_password}"
            printf 'JWT_SECRET=%s\n' "${jwt_secret}"
            printf 'SC_BOOTSTRAP_SECRET=%s\n' "${bootstrap_secret}"
            printf 'SC_BOOTSTRAP_LOGIN=backend_suite_ci\n'
            printf 'SCENE_CHANNEL=stable\n'
            printf 'SCENE_USE_PINNED=0\n'
            printf 'SCENE_ROLLBACK=0\n'
            printf 'ODOO_DBFILTER=^%s$\n' "${DB_NAME}"
            printf 'DB_DATA=%s-db-data\n' "${COMPOSE_PROJECT_NAME}"
            printf 'REDIS_DATA=%s-redis-data\n' "${COMPOSE_PROJECT_NAME}"
            printf 'ODOO_DATA=%s-odoo-data\n' "${COMPOSE_PROJECT_NAME}"
            printf 'SC_ENVIRONMENT=test\n'
          } >> "${GITHUB_ENV}"

      # BuildKit revalidates each layer's inputs; these are build artifacts,
      # never cached test verdicts or database state. Prefix fallback is safe
      # because the builder still evaluates the current Dockerfile/context.
      - name: Set up isolated BuildKit builder
        run: |
          set -euo pipefail
          docker buildx version
          docker buildx create --name "${CI_PROJECT_NAME}-builder" \
            --driver docker-container --driver-opt default-load=true --use
          docker buildx inspect --bootstrap
          echo "BUILDX_BUILDER=${CI_PROJECT_NAME}-builder" >> "${GITHUB_ENV}"

      - name: Restore frontend build layers
        id: frontend_layers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/backend-frontend-buildkit
          key: backend-frontend-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile.production-frontend-builder', '.dockerignore', 'frontend/**', '.github/workflows/backend_test_suite.yml') }}
          restore-keys: |
            backend-frontend-v2-${{ runner.os }}-${{ runner.arch }}-

      # The frontend is a separate static carrier: the Odoo Dockerfile no
      # longer has any frontend/nginx stage. Build the dist from the dedicated
      # builder export stage and derive the immutable fingerprint from those
      # files. The exported directory is also what the local-dev nginx service
      # mounts, so it stays available for the compose build below.
      - name: Calculate frontend build fingerprint
        run: |
          set -euo pipefail
          dist_dir="${RUNNER_TEMP}/frontend-dist-${GITHUB_RUN_ID}"
          rm -rf "${dist_dir}"
          docker buildx build \
            --file Dockerfile.production-frontend-builder \
            --target frontend-dist \
            --cache-from "type=local,src=${RUNNER_TEMP}/backend-frontend-buildkit" \
            --cache-to "type=local,dest=${RUNNER_TEMP}/backend-frontend-buildkit-next,mode=max" \
            --output "type=local,dest=${dist_dir}" \
            --build-arg "VITE_ODOO_DB=${DB_NAME}" \
            .
          # Export into a fresh directory so old cache blobs cannot accumulate.
          python3 - <<'PY_CACHE'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          previous = root / 'backend-frontend-buildkit'
          if previous.exists():
              shutil.rmtree(previous)
          (root / 'backend-frontend-buildkit-next').rename(previous)
          PY_CACHE
          printf 'frontend layers exact-key-hit=%s; output hash revalidated below\n' '${{ steps.frontend_layers.outputs.cache-hit }}' >> "${GITHUB_STEP_SUMMARY}"
          test -s "${dist_dir}/index.html"
          calculated_hash="$(cd "${dist_dir}" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test -n "${calculated_hash}"
          if [ -n "${EXPECTED_FRONTEND_BUILD_SHA256:-}" ]; then
            test "${calculated_hash}" = "${EXPECTED_FRONTEND_BUILD_SHA256}"
          fi
          echo "FRONTEND_BUILD_SHA256=${calculated_hash}" >> "${GITHUB_ENV}"
          echo "FRONTEND_DIST_DIR=${dist_dir}" >> "${GITHUB_ENV}"
          echo "SOURCE_SHA=${HEAD_SHA}" >> "${GITHUB_ENV}"

      - name: Build images and start database
        run: |
          set -euo pipefail
          docker --version
          docker compose version
          docker compose pull || true
          docker compose build --builder "${BUILDX_BUILDER}"
          docker compose up -d db redis
          for i in $(seq 1 60); do
            if docker compose exec -T db pg_isready -U odoo -d postgres >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color --tail=200 db
          exit 1

      - name: Run backend test suite per module
        run: |
          source scripts/ci/orm_result_guard.sh
          set -uo pipefail
          # GitHub runs this step with bash -e (errexit). Leaving errexit on
          # aborts the step on the first failing module, silently skips every
          # later module, makes the accumulated `failed` flag dead code, and
          # lets a truncated scope be reported as a pass - exactly how the
          # 2026-10-09 nightly masked the smart_construction_scene import
          # failure. Disable errexit explicitly so every planned module runs
          # and the loop's own assertions decide the outcome.
          set +e
          failed=0
          attempted=0
          planned_odoo="$(printf '%s\n' ${MODULES} | wc -w | tr -d ' ')"
          planned_python="$(printf '%s\n' ${PYTHON_MODULES} | wc -w | tr -d ' ')"
          for module in ${MODULES}; do
            attempted=$((attempted + 1))
            echo "===== backend suite: ${module} ====="
            # Each module gets a fresh isolated database: modules must not
            # observe state left behind by earlier modules in the same run.
            module_db="${DB_NAME}_${module}"
            module_test_tags="${TEST_TAGS_INPUT}"
            if [ -z "${module_test_tags}" ]; then
              # Select only tests owned by this module. Bare sc_gate/sc_smoke
              # tags also select dependency tests and made wrapper modules run
              # smart_construction_core's suite repeatedly.
              module_test_tags="sc_smoke/${module},sc_gate/${module}"
            fi
            module_env_file=""
            if [ "${module}" = "smart_construction_demo" ]; then
              # The demo payload's pre_init_hook refuses non-demo databases
              # by design (guard_demo_scope): authorized db name +
              # SC_ENVIRONMENT=demo + SC_ALLOW_DEMO_DATA=1 +
              # SC_DEMO_USER_PASSWORD are all required.
              module_db="sc_demo_${DB_NAME}"
              demo_env="${RUNNER_TEMP}/backend-suite-demo-env-${GITHUB_RUN_ID}"
              sed -e "s/^SC_ENVIRONMENT=.*/SC_ENVIRONMENT=demo/" \
                  -e "s/^DB_NAME=.*/DB_NAME=${module_db}/" \
                  -e "s|^ODOO_DBFILTER=.*|ODOO_DBFILTER=^${module_db}$|" \
                  "${ENV_FILE}" > "${demo_env}"
              demo_password="$(openssl rand -hex 12)"
              echo "::add-mask::${demo_password}"
              printf 'SC_ALLOW_DEMO_DATA=1\nSC_DEMO_USER_PASSWORD=%s\n' \
                "${demo_password}" >> "${demo_env}"
              module_env_file="${demo_env}"
            fi
            module_status=1
            module_log=""
            for module_attempt in 1 2; do
              attempt_db="${module_db}"
              attempt_env_file="${module_env_file}"
              if [ "${module_attempt}" -eq 2 ]; then
                attempt_db="${module_db}_retry1"
                if [ -n "${module_env_file}" ]; then
                  attempt_env_file="${module_env_file}.retry1"
                  sed -e "s/^DB_NAME=.*/DB_NAME=${attempt_db}/" \
                      -e "s|^ODOO_DBFILTER=.*|ODOO_DBFILTER=^${attempt_db}$|" \
                      "${module_env_file}" > "${attempt_env_file}"
                fi
              fi
              module_log="${RUNNER_TEMP}/backend-suite-odoo-${module}-${GITHUB_RUN_ID}-attempt${module_attempt}.log"
              if [ -n "${attempt_env_file}" ]; then
                ENV_FILE="${attempt_env_file}" make test MODULE="${module}" \
                  TEST_TAGS="${module_test_tags}" DB_NAME="${attempt_db}" 2>&1 | tee "${module_log}"
              else
                make test MODULE="${module}" TEST_TAGS="${module_test_tags}" \
                  DB_NAME="${attempt_db}" 2>&1 | tee "${module_log}"
              fi
              module_status="${PIPESTATUS[0]}"
              if [[ ! "${module_status}" =~ ^(137|139)$ ]] || [ "${module_attempt}" -eq 2 ]; then
                break
              fi
              echo "::warning::backend suite process exited ${module_status} for ${module}; retrying once with isolated database"
            done
            orm_expect_identity="odoo.addons.${module}.tests."
            orm_expect_database="${attempt_db}"
            if ! evaluate_orm_outcome "${module_status}" "${module_log}"; then
              echo "::error::backend suite failed execution/count/identity guard for module ${module}"
              failed=1
            fi
          done
          for module in ${PYTHON_MODULES}; do
            attempted=$((attempted + 1))
            echo "===== backend Python unit suite: ${module} ====="
            test_dir=""
            for root in addons demo_addons; do
              if [ -d "${root}/${module}/tests" ]; then
                test_dir="${root}/${module}/tests"
                break
              fi
            done
            test -n "${test_dir}" || { echo "::error::missing Python test directory for ${module}"; failed=1; continue; }
            python_log="${RUNNER_TEMP}/backend-suite-python-${module}-${GITHUB_RUN_ID}.log"
            if ! python3 -m unittest discover -s "${test_dir}" -p 'test*.py' 2>&1 | tee "${python_log}"; then
              echo "::error::backend Python unit suite failed for module ${module}"
              failed=1
            elif ! grep -Eq 'Ran [1-9][0-9]* test[s]?[[:space:]]' "${python_log}"; then
              echo "::error::backend Python unit suite collected zero tests for module ${module}"
              failed=1
            fi
          done
          # A truncated step must never look like a pass. Assert that the
          # executed scope equals the resolved module list before trusting
          # `failed`; an early abort (image/docker/db failure) then fails the
          # step instead of skipping the remaining modules invisibly.
          planned_total=$((planned_odoo + planned_python))
          if [ "${attempted}" -ne "${planned_total}" ]; then
            echo "::error::backend suite execution truncated: attempted ${attempted} of ${planned_total} planned module run(s)"
            failed=1
          fi
          echo "backend suite executed ${attempted} of ${planned_total} planned module run(s); failed=${failed}"
          printf 'shard=%s executed=%s planned=%s failed=%s\n' "${SHARD_INDEX}" "${attempted}" "${planned_total}" "${failed}" >> "${GITHUB_STEP_SUMMARY}"
          test "${failed}" -eq 0

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=200 || true

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          docker buildx rm "${CI_PROJECT_NAME}-builder" || true
          bash scripts/ci/self_hosted_runner_cleanup.sh
