name: backend_test_suite

# R9 (productization audit): automated entry for the backend Odoo test
# suite, which needs a live database. Runs nightly on the default branch
# and on demand; each module with test_*.py files is installed and
# tested in an isolated per-run database.

on:
  schedule:
    - cron: "37 19 * * *"  # 03:37 Asia/Shanghai nightly
  workflow_dispatch:
    inputs:
      head_ref:
        description: "Branch or tag to test (default: default branch)"
        required: false
        default: ""
      modules:
        description: "Comma-separated module override (default: all modules with test files)"
        required: false
        default: ""
      test_tags:
        description: "Odoo --test-tags override (default: clean-safe module selectors)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: backend-test-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend_suite:
    if: >-
      github.repository == 'lidefend/sce-backend-odoo' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner))
    runs-on: [self-hosted, huawei, ubuntu22]
    timeout-minutes: 240

    env:
      CI_REMOTE_URL: https://github.com/lidefend/sce-backend-odoo.git
      HEAD_REF: ${{ github.event.inputs.head_ref || github.ref_name }}
      HEAD_SHA: ${{ github.sha }}
      CI_PROJECT_NAME: sc-suite-${{ github.run_id }}
      COMPOSE_PROJECT_NAME: sc-suite-${{ github.run_id }}
      DB_NAME: sc_suite_ci
      TEST_TAGS_INPUT: ${{ github.event.inputs.test_tags }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout exact authoritative GitHub commit
        run: |
          set -euo pipefail
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init "${GITHUB_WORKSPACE}"
          git remote add origin "${CI_REMOTE_URL}"
          for attempt in 1 2 3 4 5; do
            if timeout 90 git fetch --no-tags origin \
              "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}" && \
              git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              git checkout --detach "${HEAD_SHA}"
              git config --global --add safe.directory "${GITHUB_WORKSPACE}"
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          echo "GitHub checkout failed for ${HEAD_REF}/${HEAD_SHA}" >&2
          exit 1

      - name: Resolve module list
        run: |
          set -euo pipefail
          override="${{ github.event.inputs.modules }}"
          if [ -n "${override}" ]; then
            MODULES="${override//,/ }"
          else
            MODULES="$(find addons demo_addons -mindepth 3 -maxdepth 3 \
              -type f -path '*/tests/test_*.py' -printf '%h\n' \
              | sort -u \
              | while read -r tests_dir; do
                  dir="${tests_dir%/tests}"
                  [ -f "${dir}/__manifest__.py" ] && basename "${dir}"
                done | sort -u | tr '\n' ' ')"
          fi
          test -n "${MODULES}" || { echo "no modules with tests/ found"; exit 1; }
          echo "MODULES=${MODULES}" >> "${GITHUB_ENV}"
          printf 'backend suite modules:\n%s\n' "${MODULES}"

      - name: Configure compose environment
        run: |
          set -euo pipefail
          ci_env="${RUNNER_TEMP}/backend-suite-env-${GITHUB_RUN_ID}"
          db_password="$(openssl rand -hex 16)"
          admin_password="$(openssl rand -hex 16)"
          jwt_secret="$(openssl rand -hex 24)"
          bootstrap_secret="$(openssl rand -hex 16)"
          for secret_value in "${db_password}" "${admin_password}" "${jwt_secret}" "${bootstrap_secret}"; do
            echo "::add-mask::${secret_value}"
          done
          {
            printf 'DB_USER=odoo\n'
            printf 'DB_PASSWORD=%s\n' "${db_password}"
            printf 'DB_NAME=%s\n' "${DB_NAME}"
            printf 'ADMIN_PASSWD=%s\n' "${admin_password}"
            printf 'JWT_SECRET=%s\n' "${jwt_secret}"
            printf 'SC_BOOTSTRAP_SECRET=%s\n' "${bootstrap_secret}"
            printf 'SC_BOOTSTRAP_LOGIN=backend_suite_ci\n'
            printf 'SCENE_CHANNEL=stable\n'
            printf 'SCENE_USE_PINNED=0\n'
            printf 'SCENE_ROLLBACK=0\n'
            printf 'ODOO_DBFILTER=^%s$\n' "${DB_NAME}"
            printf 'DB_DATA=%s-db-data\n' "${COMPOSE_PROJECT_NAME}"
            printf 'REDIS_DATA=%s-redis-data\n' "${COMPOSE_PROJECT_NAME}"
            printf 'ODOO_DATA=%s-odoo-data\n' "${COMPOSE_PROJECT_NAME}"
            printf 'SC_ENVIRONMENT=test\n'
          } > "${ci_env}"
          {
            printf 'ENV_FILE=%s\n' "${ci_env}"
            printf 'DB_USER=odoo\n'
            printf 'DB_PASSWORD=%s\n' "${db_password}"
            printf 'ADMIN_PASSWD=%s\n' "${admin_password}"
            printf 'JWT_SECRET=%s\n' "${jwt_secret}"
            printf 'SC_BOOTSTRAP_SECRET=%s\n' "${bootstrap_secret}"
            printf 'SC_BOOTSTRAP_LOGIN=backend_suite_ci\n'
            printf 'SCENE_CHANNEL=stable\n'
            printf 'SCENE_USE_PINNED=0\n'
            printf 'SCENE_ROLLBACK=0\n'
            printf 'ODOO_DBFILTER=^%s$\n' "${DB_NAME}"
            printf 'DB_DATA=%s-db-data\n' "${COMPOSE_PROJECT_NAME}"
            printf 'REDIS_DATA=%s-redis-data\n' "${COMPOSE_PROJECT_NAME}"
            printf 'ODOO_DATA=%s-odoo-data\n' "${COMPOSE_PROJECT_NAME}"
            printf 'SC_ENVIRONMENT=test\n'
          } >> "${GITHUB_ENV}"

      # The compose build enforces the immutable frontend fingerprint via the
      # Dockerfile 'frontend-verified' stage, so the expected hash must be
      # derived from the 'frontend-artifact' stage before docker compose
      # build (same approach as demo-ci.yml). First real execution on the
      # self-hosted runner (run 32179847781) failed without this step.
      - name: Calculate frontend build fingerprint
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/frontend-artifact-${GITHUB_RUN_ID}"
          docker buildx build \
            --file Dockerfile \
            --target frontend-artifact \
            --output "type=local,dest=${artifact_dir}" \
            --build-arg "APT_MIRROR=${APT_MIRROR:-default}" \
            .
          recorded_hash="$(cat "${artifact_dir}/.build-sha256")"
          calculated_hash="$(cd "${artifact_dir}" && LC_ALL=C find . -type f ! -name .build-sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test -n "${recorded_hash}"
          test "${recorded_hash}" = "${calculated_hash}"
          echo "FRONTEND_BUILD_SHA256=${recorded_hash}" >> "${GITHUB_ENV}"
          echo "SOURCE_SHA=${HEAD_SHA}" >> "${GITHUB_ENV}"
          find "${artifact_dir}" -mindepth 1 -delete
          rmdir "${artifact_dir}"

      - name: Build images and start database
        run: |
          set -euo pipefail
          docker --version
          docker compose version
          docker compose pull || true
          docker compose build
          docker compose up -d db redis
          for i in $(seq 1 60); do
            if docker compose exec -T db pg_isready -U odoo -d postgres >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color --tail=200 db
          exit 1

      - name: Run backend test suite per module
        run: |
          set -uo pipefail
          NON_ZERO_RESULT_RE='0 failed, 0 error\(s\) of [1-9][0-9]* tests'

          default_test_tags() {
            local module="$1"
            local tag
            case "${module}" in
              sc_norm_engine) tag="sc_regression" ;;
              smart_construction_acceptance_fixture) tag="acceptance_fixture_gate" ;;
              smart_construction_bootstrap) tag="locale_baseline" ;;
              smart_construction_core) tag="sc_install" ;;
              smart_construction_demo) tag="demo_gate" ;;
              smart_construction_portal) tag="contract_dashboard" ;;
              smart_construction_seed) tag="sc_smoke" ;;
              smart_core) tag="sc_smoke" ;;
              smart_license_core) tag="tier_gate" ;;
              smart_owner_bundle) tag="registry_consistency" ;;
              smart_owner_core) tag="extension_contract" ;;
              smart_scene) tag="scene_resolver" ;;
              *)
                module_test_tags="/${module}"
                printf '%s\n' "${module_test_tags}"
                return 0
                ;;
            esac
            printf '%s/%s\n' "${tag}" "${module}"
          }

          scope_test_tags() {
            local module="$1"
            local raw="$2"
            local scoped=""
            local selector
            local selected_module
            local requested=()

            if [ -z "${raw}" ]; then
              default_test_tags "${module}"
              return
            fi

            raw="${raw// /}"
            IFS=',' read -r -a requested <<< "${raw}"
            for selector in "${requested[@]}"; do
              [ -n "${selector}" ] || continue
              if [[ "${selector}" == /* ]]; then
                if [[ "${selector}" != "/${module}" &&
                      "${selector}" != "/${module}:"* &&
                      "${selector}" != "/${module}."* ]]; then
                  echo "::error::test selector ${selector} escapes target module ${module}" >&2
                  return 2
                fi
              elif [[ "${selector}" == */* ]]; then
                selected_module="${selector#*/}"
                selected_module="${selected_module%%[:.]*}"
                if [[ "${selected_module}" != "${module}" ]]; then
                  echo "::error::test selector ${selector} escapes target module ${module}" >&2
                  return 2
                fi
              elif [[ "${selector}" == :* || "${selector}" == .* ]]; then
                selector="/${module}${selector}"
              else
                if [[ "${selector}" == -* ]]; then
                  selector="-${selector#-}/${module}"
                else
                  selector="${selector}/${module}"
                fi
              fi
              scoped="${scoped:+${scoped},}${selector}"
            done
            [ -n "${scoped}" ] || {
              echo "::error::no valid test selector for module ${module}" >&2
              return 2
            }
            printf '%s\n' "${scoped}"
          }

          run_module_test() {
            local module="$1"
            local module_db="$2"
            local module_env_file="$3"
            local module_test_tags="$4"
            local module_log="${RUNNER_TEMP}/backend-suite-${GITHUB_RUN_ID}-${module}.log"

            if ! ENV_FILE="${module_env_file}" make test \
              MODULE="${module}" \
              TEST_TAGS="${module_test_tags}" \
              DB_NAME="${module_db}" 2>&1 | tee "${module_log}"; then
              echo "::error::backend suite failed for module ${module}"
              return 1
            fi
            if ! grep -Eq "${NON_ZERO_RESULT_RE}" "${module_log}"; then
              echo "::error::backend suite produced no non-zero passing test summary for module ${module}"
              return 1
            fi
          }

          failed=0
          for module in ${MODULES}; do
            echo "===== backend suite: ${module} ====="
            # Each module gets a fresh isolated database: modules must not
            # observe state left behind by earlier modules in the same run.
            module_db="${DB_NAME}_${module}"
            if ! module_test_tags="$(scope_test_tags "${module}" "${TEST_TAGS_INPUT}")"; then
              failed=1
              continue
            fi
            echo "backend suite selector: ${module_test_tags}"
            if [ "${module}" = "smart_construction_demo" ]; then
              # The demo payload's pre_init_hook refuses non-demo databases
              # by design (guard_demo_scope): authorized db name +
              # SC_ENVIRONMENT=demo + SC_ALLOW_DEMO_DATA=1 +
              # SC_DEMO_USER_PASSWORD are all required.
              module_db="sc_demo_${DB_NAME}"
              demo_env="${RUNNER_TEMP}/backend-suite-demo-env-${GITHUB_RUN_ID}"
              sed -e "s/^SC_ENVIRONMENT=.*/SC_ENVIRONMENT=demo/" \
                  -e "s/^DB_NAME=.*/DB_NAME=${module_db}/" \
                  -e "s|^ODOO_DBFILTER=.*|ODOO_DBFILTER=^${module_db}$|" \
                  "${ENV_FILE}" > "${demo_env}"
              demo_password="$(openssl rand -hex 12)"
              echo "::add-mask::${demo_password}"
              printf 'SC_ALLOW_DEMO_DATA=1\nSC_DEMO_USER_PASSWORD=%s\n' \
                "${demo_password}" >> "${demo_env}"
              if ! run_module_test "${module}" "${module_db}" "${demo_env}" "${module_test_tags}"; then
                failed=1
              fi
            else
              if ! run_module_test "${module}" "${module_db}" "${ENV_FILE}" "${module_test_tags}"; then
                failed=1
              fi
            fi
          done
          test "${failed}" -eq 0

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=200 || true

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          bash scripts/ci/self_hosted_runner_cleanup.sh
