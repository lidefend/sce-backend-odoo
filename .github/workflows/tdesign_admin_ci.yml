name: tdesign_admin_ci

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/tdesign-admin/**'
      - '.github/workflows/tdesign_admin_ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/tdesign-admin/**'
      - '.github/workflows/tdesign_admin_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tdesign-admin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tdesign_admin:
    name: tdesign_admin
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash
        working-directory: frontend/tdesign-admin

    steps:
      - name: Checkout source
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: frontend/tdesign-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build:type

      - name: Run API capability and runtime tests
        run: npm run test

      - name: Build production bundle
        run: npm run build
