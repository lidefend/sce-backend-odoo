name: release_candidate_gate

on:
  pull_request:
    branches: [main]
    types: [labeled]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: release-candidate-${{ github.event_name == 'pull_request' && 'pull_request' || github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:candidate' && 'ignored-label' || 'validation' }}
  cancel-in-progress: true

jobs:
  classify:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'ci:candidate') &&
      (github.event_name != 'pull_request' || github.event.action == 'labeled' && github.event.label.name == 'ci:candidate')
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.identity.outputs.head }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  wait_for_candidate_checks:
    needs: classify
    timeout-minutes: 360
    if: needs.classify.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ needs.classify.outputs.head }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.classify.outputs.head }}
          persist-credentials: false

      - name: Observe scheduled validation time
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/scheduled_validation.py

      - name: Wait for exact-head candidate checks
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            expected_head_branch="${GITHUB_HEAD_REF:?pull request head ref is required}"
          else
            expected_head_branch=main
          fi
          case "${GITHUB_EVENT_NAME}" in
            schedule|pull_request|workflow_dispatch) producer_event="${GITHUB_EVENT_NAME}" ;;
            *) echo "unsupported aggregate event: ${GITHUB_EVENT_NAME}" >&2; exit 1 ;;
          esac
          echo "EXPECTED_HEAD_BRANCH=${expected_head_branch}" >> "$GITHUB_ENV"
          echo "PRODUCER_EVENT=${producer_event}" >> "$GITHUB_ENV"
          required=(public_guard.yml professional_quality_gate.yml frontend_release_gate.yml merge_policy_gate.yml)
          if [ "${GITHUB_EVENT_NAME}" != pull_request ]; then
            required+=(auxiliary_backend_suite.yml)
          fi
          runs_file="${RUNNER_TEMP}/release-condition/required-runs.ndjson"
          mkdir -p "$(dirname "${runs_file}")"
          missing_grace_attempts="${MISSING_DEPENDENCY_GRACE_ATTEMPTS:-90}"
          missing_streak=0
          for attempt in $(seq 1 1020); do
            pending=0
            missing=()
            : > "${runs_file}"
            for workflow in "${required[@]}"; do
              runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${HEAD_SHA}&per_page=100")"
              latest="$(python3 scripts/ci/select_authoritative_workflow_run.py \
                --repository "$GITHUB_REPOSITORY" \
                --workflow-path ".github/workflows/${workflow}" \
                --head "$HEAD_SHA" \
                --aggregate-event "$GITHUB_EVENT_NAME" \
                --head-branch "$expected_head_branch" \
                --head-repository "$GITHUB_REPOSITORY" \
                --workflow-dispatch-producer workflow_dispatch <<<"$runs")"
              test -n "$latest" || { pending=1; missing+=("$workflow"); continue; }
              status="$(jq -r '.status' <<<"$latest")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$latest")"
              test "$status" = completed || { pending=1; continue; }
              test "$conclusion" = success || { echo "candidate workflow failed: $workflow" >&2; exit 1; }
              printf '%s\n' "${latest}" >> "${runs_file}"
            done
            test "$pending" = 0 && exit 0
            if [ "${#missing[@]}" -gt 0 ]; then
              missing_streak=$((missing_streak + 1))
            else
              missing_streak=0
            fi
            if [ "$missing_streak" -ge "$missing_grace_attempts" ]; then
              missing_csv="$(IFS=,; echo "${missing[*]}")"
              echo "::error::required dependency workflows unavailable head=${HEAD_SHA} aggregate_event=${GITHUB_EVENT_NAME} producer_event=${producer_event} branch=${expected_head_branch} workflows=${missing_csv}"
              {
                echo "## Missing Candidate Dependencies"
                echo ""
                echo "| Field | Value |"
                echo "| --- | --- |"
                echo "| Head SHA | ${HEAD_SHA} |"
                echo "| Aggregate event | ${GITHUB_EVENT_NAME} |"
                echo "| Required producer event | ${producer_event} |"
                echo "| Required source branch | ${expected_head_branch} |"
                echo "| Missing workflows | ${missing_csv} |"
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi
            sleep 20
          done
          echo "timed out waiting for exact-head candidate checks" >&2
          exit 1

      - name: Prove validated main is still authoritative
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if ! [[ "${current_main}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::current main is not a full lowercase SHA: ${current_main}"
            exit 1
          fi
          if [ "${current_main}" != "${HEAD_SHA}" ]; then
            echo "::error::STALE_MAIN validated_head=${HEAD_SHA} current_main=${current_main}"
            exit 1
          fi
          echo "CURRENT_MAIN_SHA=${current_main}" >> "${GITHUB_ENV}"

      - name: Materialize exact formal release condition
        if: success()
        env:
          HEAD_SHA: ${{ needs.classify.outputs.head }}
        run: |
          set -euo pipefail
          condition_root="${RUNNER_TEMP}/release-condition"
          output="${condition_root}/release-condition.json"
          tree="$(git rev-parse 'HEAD^{tree}')"
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            expected_head_branch="${GITHUB_HEAD_REF:?pull request head ref is required}"
          else
            expected_head_branch=main
          fi
          args=(
            --runs "${condition_root}/required-runs.ndjson"
            --output "${output}"
            --repository "${GITHUB_REPOSITORY}"
            --head-sha "${HEAD_SHA}"
            --tree "${tree}"
            --event "${GITHUB_EVENT_NAME}"
            --head-branch "${expected_head_branch}"
            --workflow-dispatch-producer workflow_dispatch
          )
          if [ "${GITHUB_EVENT_NAME}" != pull_request ]; then
            args+=(--current-main "${CURRENT_MAIN_SHA}")
          fi
          if [ "${GITHUB_EVENT_NAME}" = schedule ]; then
            args+=(--scheduled-slot "${SCHEDULED_SLOT}")
          fi
          python3 scripts/ci/release_condition.py "${args[@]}"
          cat "${output}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve exact release-condition identity
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-condition-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.classify.outputs.head }}
          path: ${{ runner.temp }}/release-condition/release-condition.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish release-candidate summary
        run: |
          {
            echo "## Exact-Head Release Gate"
            echo ""
            if [ "${GITHUB_EVENT_NAME}" = schedule ]; then
              echo "The scheduled mainline release condition is satisfied for this exact head."
              echo "This authorizes immutable candidate construction; it does not authorize deployment."
            else
              echo "This exact head passed explicit candidate validation."
            fi
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Head SHA | ${HEAD_SHA} |"
            echo "| Aggregate event | ${GITHUB_EVENT_NAME} |"
            echo "| Producer event | ${PRODUCER_EVENT} |"
            echo "| Source branch | ${EXPECTED_HEAD_BRANCH} |"
            echo "| Candidate trigger | explicit candidate path |"
          } >> "${GITHUB_STEP_SUMMARY}"

  release_candidate_gate:
    name: release_candidate_gate
    needs: wait_for_candidate_checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          result="${{ needs.wait_for_candidate_checks.result }}"
          if [ "$result" = success ]; then
            if [ "${{ github.event_name }}" = schedule ]; then
              echo "Formal mainline release condition: satisfied (candidate-build eligible; deployment not authorized)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Candidate validation: executed and passed" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "$result" = skipped ]; then
            echo "Candidate validation: not applicable (not executed); this status grants no candidate acceptance" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Candidate validation: pending or failed ($result)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
