name: release_candidate_gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'ci:candidate') &&
      (github.event_name != 'pull_request' || github.event.action == 'labeled' && github.event.label.name == 'ci:candidate')
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.identity.outputs.head }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  wait_for_candidate_checks:
    needs: classify
    if: needs.classify.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ needs.classify.outputs.head }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.classify.outputs.head }}
          persist-credentials: false

      - name: Wait for exact-head candidate checks
        run: |
          set -euo pipefail
          required=(public_guard.yml professional_quality_gate.yml frontend_release_gate.yml merge_policy_gate.yml)
          for attempt in $(seq 1 90); do
            pending=0
            for workflow in "${required[@]}"; do
              runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${HEAD_SHA}&event=${GITHUB_EVENT_NAME}&per_page=100")"
              latest="$(python3 scripts/ci/select_authoritative_workflow_run.py \
                --repository "$GITHUB_REPOSITORY" \
                --workflow-path ".github/workflows/${workflow}" \
                --head "$HEAD_SHA" \
                --event "$GITHUB_EVENT_NAME" <<<"$runs")"
              test -n "$latest" || { pending=1; continue; }
              status="$(jq -r '.status' <<<"$latest")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$latest")"
              test "$status" = completed || { pending=1; continue; }
              test "$conclusion" = success || { echo "candidate workflow failed: $workflow" >&2; exit 1; }
            done
            test "$pending" = 0 && exit 0
            sleep 20
          done
          echo "timed out waiting for exact-head candidate checks" >&2
          exit 1

      - name: Publish release-candidate summary
        run: |
          {
            echo "## Release Candidate Gate"
            echo ""
            echo "This exact head passed merge eligibility and explicit candidate validation."
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Head SHA | ${HEAD_SHA} |"
            echo "| Event | ${GITHUB_EVENT_NAME} |"
            echo "| Candidate trigger | explicit candidate path |"
          } >> "${GITHUB_STEP_SUMMARY}"

  release_candidate_gate:
    name: release_candidate_gate
    needs: wait_for_candidate_checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          result="${{ needs.wait_for_candidate_checks.result }}"
          test "$result" = success || test "$result" = skipped
