name: frontend_release_gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend_release_gate:
    name: frontend_release_gate
    if: >-
      github.repository == 'lidefend/sce-backend-odoo' &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      CI_PROJECT_NAME: sc-fe-release-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout the authoritative code object
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove checkout identity
        id: identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CHECKOUT_SHA}"
          {
            printf 'sha=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          } >> "${GITHUB_OUTPUT}"

      - name: Classify change risk
        id: risk
        run: |
          set -euo pipefail
          python3 scripts/ci/ci_risk_classifier.py \
            --base "${BASE_SHA}" \
            --head "${CHECKOUT_SHA}" \
            --event "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Generate isolated acceptance environment
        if: steps.risk.outputs.frontend_mode == 'full'
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -hex 32)"
          jwt_secret="$(openssl rand -hex 32)"
          bootstrap_secret="$(openssl rand -hex 32)"
          for secret in "${db_password}" "${admin_password}" "${jwt_secret}" "${bootstrap_secret}"; do
            echo "::add-mask::${secret}"
          done
          ci_env="${RUNNER_TEMP}/sce-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-frontend-release.env"
          identity_file="${RUNNER_TEMP}/sce-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-frontend-release.identity"
          umask 077
          {
            printf 'ENV=test\n'
            printf 'ENV_FILE=%s\n' "${ci_env}"
            printf 'COMPOSE_PROJECT_NAME=%s\n' "${CI_PROJECT_NAME}"
            printf 'DB_USER=odoo\n'
            printf 'DB_PASSWORD=%s\n' "${db_password}"
            printf 'DB_NAME=sc_frontend_acceptance\n'
            printf 'ADMIN_PASSWD=%s\n' "${admin_password}"
            printf 'JWT_SECRET=%s\n' "${jwt_secret}"
            printf 'SC_BOOTSTRAP_SECRET=%s\n' "${bootstrap_secret}"
            printf 'SC_BOOTSTRAP_LOGIN=frontend_release_ci\n'
            printf 'SCENE_CHANNEL=stable\n'
            printf 'SCENE_USE_PINNED=0\n'
            printf 'SCENE_ROLLBACK=0\n'
            printf 'ODOO_DBFILTER=^sc_frontend_acceptance$\n'
            printf 'ODOO_PORT=18082\n'
            printf 'SC_SOURCE_REVISION=%s\n' "${CHECKOUT_SHA}"
            printf 'DB_DATA=%s-db-data\n' "${CI_PROJECT_NAME}"
            printf 'REDIS_DATA=%s-redis-data\n' "${CI_PROJECT_NAME}"
            printf 'ODOO_DATA=%s-odoo-data\n' "${CI_PROJECT_NAME}"
            printf 'SC_ENVIRONMENT=acceptance\n'
            printf 'SC_ALLOW_DEMO_DATA=1\n'
          } > "${ci_env}"
          {
            printf 'ENV=test\n'
            printf 'ENV_FILE=%s\n' "${ci_env}"
            printf 'COMPOSE_PROJECT_NAME=%s\n' "${CI_PROJECT_NAME}"
            printf 'DB_USER=odoo\n'
            printf 'DB_PASSWORD=%s\n' "${db_password}"
            printf 'DB_NAME=sc_frontend_acceptance\n'
            printf 'ADMIN_PASSWD=%s\n' "${admin_password}"
            printf 'JWT_SECRET=%s\n' "${jwt_secret}"
            printf 'SC_BOOTSTRAP_SECRET=%s\n' "${bootstrap_secret}"
            printf 'SC_BOOTSTRAP_LOGIN=frontend_release_ci\n'
            printf 'SCENE_CHANNEL=stable\n'
            printf 'SCENE_USE_PINNED=0\n'
            printf 'SCENE_ROLLBACK=0\n'
            printf 'ODOO_DBFILTER=^sc_frontend_acceptance$\n'
            printf 'ODOO_PORT=18082\n'
            printf 'SC_SOURCE_REVISION=%s\n' "${CHECKOUT_SHA}"
            printf 'DB_DATA=%s-db-data\n' "${CI_PROJECT_NAME}"
            printf 'REDIS_DATA=%s-redis-data\n' "${CI_PROJECT_NAME}"
            printf 'ODOO_DATA=%s-odoo-data\n' "${CI_PROJECT_NAME}"
            printf 'SC_ENVIRONMENT=acceptance\n'
            printf 'SC_ALLOW_DEMO_DATA=1\n'
            printf 'SC_FRONTEND_RELEASE_IDENTITY_FILE=%s\n' "${identity_file}"
          } >> "${GITHUB_ENV}"

      - name: Freeze isolated frontend release identity
        if: steps.risk.outputs.frontend_mode == 'full'
        run: |
          set -euo pipefail
          bash scripts/common/frontend_release_ci_identity.sh freeze "${GITHUB_WORKSPACE}"

      - name: Pin frontend Node toolchain
        if: steps.risk.outputs.frontend_mode != 'skip'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.0

      - name: Restore content-addressed pnpm store
        if: steps.risk.outputs.frontend_mode != 'skip'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-node22.17.0-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-node22.17.0-

      - name: Restore content-addressed Playwright browser
        id: playwright-cache
        if: steps.risk.outputs.frontend_mode == 'full'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install locked frontend toolchain
        if: steps.risk.outputs.frontend_mode != 'skip'
        run: |
          set -euo pipefail
          python3 scripts/ci/frontend_professional_extension_guard.py
          corepack enable
          corepack prepare pnpm@9.12.3 --activate
          pnpm config set store-dir "${HOME}/.local/share/pnpm/store"
          pnpm -C frontend install --frozen-lockfile
          if [ '${{ steps.risk.outputs.frontend_mode }}' = 'full' ]; then
            if [ '${{ steps.playwright-cache.outputs.cache-hit }}' = 'true' ]; then
              pnpm -C frontend/apps/web exec playwright install-deps chromium
            else
              pnpm -C frontend/apps/web exec playwright install --with-deps chromium
            fi
          fi

      - name: Run the single authoritative frontend release command
        id: release
        if: steps.risk.outputs.frontend_mode == 'full'
        env:
          FRONTEND_RELEASE_PR_HEAD_SHA: ${{ env.PR_HEAD_SHA }}
        run: |
          set -euo pipefail
          cd frontend/apps/web
          pnpm test:release

      - name: Run standard frontend checks in parallel
        id: standard
        if: steps.risk.outputs.frontend_mode == 'standard'
        run: |
          set -euo pipefail
          (
            pnpm -C frontend/apps/web lint:src
          ) &
          lint_pid=$!
          (
            pnpm -C frontend/apps/web typecheck:strict
          ) &
          typecheck_pid=$!
          (
            pnpm -C frontend/apps/web test
          ) &
          unit_pid=$!
          lint_status=0
          typecheck_status=0
          unit_status=0
          wait "${lint_pid}" || lint_status=$?
          wait "${typecheck_pid}" || typecheck_status=$?
          wait "${unit_pid}" || unit_status=$?
          test "${lint_status}" -eq 0
          test "${typecheck_status}" -eq 0
          test "${unit_status}" -eq 0
          pnpm -C frontend/apps/web build

      - name: Fail closed on command or evidence identity
        if: always() && steps.risk.outputs.frontend_mode == 'full'
        env:
          RELEASE_COMMAND_OUTCOME: ${{ steps.release.outcome }}
        run: |
          set -euo pipefail
          python3 scripts/verify/frontend_release_gate.py \
            --report artifacts/frontend-release-audit/report.json \
            --sha '${{ steps.identity.outputs.sha }}' \
            --tree '${{ steps.identity.outputs.tree }}' \
            --command-outcome "${RELEASE_COMMAND_OUTCOME}" \
            --event "${GITHUB_EVENT_NAME}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Record explicit non-release lane result
        if: always() && steps.risk.outputs.frontend_mode != 'full'
        env:
          FRONTEND_MODE: ${{ steps.risk.outputs.frontend_mode }}
          STANDARD_OUTCOME: ${{ steps.standard.outcome }}
          RISK_LANE: ${{ steps.risk.outputs.lane }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci-risk-tiering
          if [ "${FRONTEND_MODE}" = "standard" ]; then
            test "${STANDARD_OUTCOME}" = "success"
          else
            test "${FRONTEND_MODE}" = "skip"
          fi
          python3 - "${RISK_LANE}" "${FRONTEND_MODE}" "${CHECKOUT_SHA}" \
            > artifacts/ci-risk-tiering/frontend-release-gate.json <<'PY'
          import json
          import sys

          print(json.dumps({
              "schema_version": "ci-risk-lane-result/v1",
              "check": "frontend_release_gate",
              "lane": sys.argv[1],
              "mode": sys.argv[2],
              "sha": sys.argv[3],
              "result": "PASS",
          }, indent=2, sort_keys=True))
          PY

      - name: Upload current-run non-sensitive release evidence
        if: always() && steps.risk.outputs.frontend_mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CHECKOUT_SHA }}
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/frontend-release-audit/*.json
            artifacts/frontend-page-identity/navigation-report.json
            artifacts/frontend-page-identity/full-surface-report.json
            artifacts/frontend-page-identity/failure-summary.json
            artifacts/frontend-delivery-hardening/report.json
            artifacts/frontend-delivery-hardening/accessibility.json
            artifacts/frontend-delivery-hardening/performance.json
            artifacts/frontend-delivery-hardening/responsive.json
            artifacts/frontend-delivery-hardening/error-recovery.json

      - name: Upload current-run risk-lane evidence
        if: always() && steps.risk.outputs.frontend_mode != 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-risk-lane-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.CHECKOUT_SHA }}
          retention-days: 30
          if-no-files-found: error
          path: artifacts/ci-risk-tiering/frontend-release-gate.json

      - name: Clean isolated runner state
        if: always()
        env:
          FRONTEND_MODE: ${{ steps.risk.outputs.frontend_mode }}
        run: bash scripts/ci/self_hosted_runner_cleanup.sh
