name: public_guard

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_head:
        required: true
        type: string
      expected_base:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: public_guard_classify
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.risk.outputs.lane }}
    env:
      CHECKOUT_SHA: ${{ inputs.expected_head || github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ inputs.expected_base || github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - name: Checkout untrusted source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify change risk
        id: risk
        run: |
          set -euo pipefail
          python3 scripts/ci/ci_risk_classifier.py \
            --base "${BASE_SHA}" \
            --head "${CHECKOUT_SHA}" \
            --event "${{ github.event_name == 'workflow_dispatch' && 'pull_request' || github.event_name }}" \
            --ref "${GITHUB_REF}" \
            --github-output "${GITHUB_OUTPUT}"

  public_guard:
    name: public_guard
    needs: classify
    if: needs.classify.outputs.lane != 'FAST'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ inputs.expected_base || github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - name: Checkout classified source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compile repository guards
        run: >-
          python3 -m py_compile
          scripts/verify/repository_clean_history_guard.py
          scripts/verify/test_repository_clean_history_guard.py
          scripts/verify/github_actions_security_guard.py
          scripts/verify/test_github_actions_security_guard.py
          scripts/ci/ci_risk_classifier.py
          scripts/ci/test_ci_risk_classifier.py
          scripts/ci/test_ci_risk_workflow_contract.py
          scripts/ci/test_merge_policy_gate.py
          scripts/ci/frontend_professional_extension_guard.py
          scripts/ci/test_frontend_professional_extension_guard.py
          scripts/release/frontend_release_evidence.py
          scripts/release/generate_frontend_release_evidence_bundle.py
          scripts/verify/frontend_release_evidence_bundle.py
          scripts/verify/test_frontend_release_evidence_bundle.py

      - name: Run guard unit and negative tests
        run: |
          python3 scripts/verify/test_repository_clean_history_guard.py
          python3 scripts/verify/test_github_actions_security_guard.py
          python3 scripts/ci/test_ci_risk_classifier.py
          python3 scripts/ci/test_ci_risk_workflow_contract.py
          python3 scripts/ci/test_merge_policy_gate.py
          python3 scripts/ci/test_frontend_professional_extension_guard.py
          python3 scripts/ci/frontend_professional_extension_guard.py
          python3 scripts/verify/test_frontend_release_evidence_bundle.py

      - name: Scan governed product history
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            python3 scripts/verify/repository_clean_history_guard.py --trusted-base "${BASE_SHA}"
          else
            make verify.repository.clean_history
          fi

      - name: Run clean product boundary scan
        run: >-
          python3 scripts/verify/clean_product_release_scan.py
          --report "${RUNNER_TEMP}/clean-product-release-scan.json"

      - name: Verify workflow security policy
        run: python3 scripts/verify/github_actions_security_guard.py
