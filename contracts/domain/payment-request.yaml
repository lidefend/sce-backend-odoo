id: payment_request
version: 2

entity: payment.request

title: 支付申请

source_of_truth:
  model: payment.request
  module: smart_construction_core
  state_machine: ScStateMachine.PAYMENT_REQUEST

identity:
  field: id
  type: integer

# 字段的 `semantic`（"这个字段意味着什么"）不在这里手写：后端输入唯一收敛到
# 模型元数据 + 视图 arch（+ 权限），语义由 contracts/registry/semantic.yaml 的
# 推导规则从字段事实解出，再投影到运行时可消费载体
# addons/smart_core/core/contract_runtime/domain_field_semantics_generated.py
# （运行时镜像不挂载 contracts/）。本文件只保留代码里没有的东西：领域类型、
# 状态机与转移、能力名。漂移由 `make verify.semantic.registry.lint` 拦截。
fields:
  name:
    type: string
    title: 申请单号
    readonly: true
  project_id:
    type: ProjectRef
    required: true
  contract_id:
    type: ContractRef
    required: false
  settlement_id:
    type: SettlementRef
    required: false
  amount:
    type: Money
    required: true
    minimum: 0
  state:
    type: string
    enum:
      - draft
      - submit
      - approve
      - approved
      - rejected
      - done
      - cancel

states:
  draft:
    label: 草稿
    mutable: true
    actions:
      - edit
      - submit
      - cancel
  submit:
    label: 提交
    mutable: false
    actions:
      - approve
      - reject
      - cancel
  approve:
    label: 审批中
    mutable: false
    actions:
      - approve_pass
      - reject
      - cancel
  approved:
    label: 已批准
    mutable: false
    actions:
      - create_execution
      - done
      - cancel
  rejected:
    label: 已驳回
    mutable: false
    actions:
      - edit
      - submit
      - cancel
  done:
    label: 已完成
    mutable: false
    actions:
      - reverse_payment
  cancel:
    label: 已取消
    mutable: false
    actions: []

transitions:
  submit:
    from: [draft, rejected]
    to: submit
    capability: payment_request.submit
    note: 草稿提交；驳回后可直接重新提交（或先 resubmit 退回草稿修改）。
  approve:
    from: [submit]
    to: approve
    capability: payment_request.approve
  approve_pass:
    from: [submit, approve]
    to: approved
    capability: payment_request.approve
    note: 审批通过；submit→approved 为未配置审批链时的自动通过路径。
  reject:
    from: [submit, approve]
    to: rejected
    capability: payment_request.reject
  resubmit:
    from: [rejected]
    to: draft
    capability: payment_request.resubmit
    note: 退回草稿重新编辑。
  done:
    from: [approved]
    to: done
    capability: payment_request.complete
  reverse_payment:
    from: [done]
    to: approved
    capability: payment_request.mark_reversed
    note: 撤销已付款登记（payment.execution.action_reverse_payment）后退回已批准态。
  cancel:
    from: [draft, submit, approve, approved, rejected]
    to: cancel
    capability: payment_request.cancel
  create_execution:
    from: [approved]
    to: approved
    capability: payment_request.create_execution
    note: 续接付款登记表单，不改变本单状态。

notes:
  - >-
    本文件是 payment.request 的领域声明（对账与生成用），不是运行时权威。运行时的
    "状态 -> 可用动作"由 P1 行业档案
    ScWorkflowContractService.PROFILE_BY_MODEL['payment.request']
    （state_field / state_phase / state_actions / method_by_action）投影；转移的
    合法性由 ORM 守卫 ScStateMachine.PAYMENT_REQUEST_TRANSITIONS 与模型方法
    （_check_approval_state_transition / action_* / action_reverse_payment）执行。
    归属细则见 docs/contract-runtime-state-ownership.md。
  - >-
    本文件 transitions 与 ScStateMachine.PAYMENT_REQUEST_TRANSITIONS 按能力名
    一一对应：draft->{submit,cancel}；submit->{approve,approved,rejected,cancel}；
    approve->{approved,rejected,cancel}；approved->{done,cancel}；
    rejected->{draft,submit,cancel}；done->{approved}；cancel->{}。其中
    approve_pass 覆盖 submit/approve->approved，reverse_payment 覆盖
    done->approved（已付款撤销），create_execution 为 approved 自环（不改变状态）。
  - >-
    v1 的 submitted/approved 直连与 paid/reversed 终态为产品语义命名，与模型
    状态机不一致，已在 v2 废弃；v2 状态集合与 ScStateMachine.PAYMENT_REQUEST_STATES
    一致。
