$schema: https://json-schema.org/draft/2020-12/schema
$id: https://smart-construction.local/contracts/native-view-normalized-capability-map-v1.yaml
title: Native View Normalized Capability Map V1
type: object
additionalProperties: false
required: [schema, authority, unknown_capability_policy, canonical_view_types, classified_capability_pairs_sha256, forbidden_source_aliases, mappings]
properties:
  schema: {const: native_view_normalized_capability_map/v1}
  authority: {const: p0_normalized_evidence_mapping}
  unknown_capability_policy: {const: fail_closed}
  canonical_view_types:
    type: array
    minItems: 1
    uniqueItems: true
    items: {enum: [form, tree, search, kanban, pivot, graph, activity]}
  classified_capability_pairs_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  forbidden_source_aliases:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  mappings:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, view_types, source_selectors, value_regions, matcher, cardinality_policy, mapping_status, source_authority, missing_reason_code, reduced_reason_code, unproven_reason_code]
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9_]+$'}
        view_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: {enum: [form, tree, search, kanban, pivot, graph, activity]}
        capability_keys:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        capability_prefixes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        excluded_capability_keys:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
        source_selectors:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        value_regions:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^(|/.*)$'}
        matcher: {enum: [surface_identity, recursive_native_occurrence, native_action_identity, named_occurrence, ordered_occurrence, native_lineage_required, unproven]}
        cardinality_policy: {enum: [exactly_one, occurrence_preserving, unproven]}
        mapping_status: {enum: [proven, mapping_unproven]}
        source_authority: {const: final_response_normalized_carrier}
        missing_reason_code: {type: string, pattern: '^[A-Z][A-Z0-9_]+$'}
        reduced_reason_code: {type: string, pattern: '^[A-Z][A-Z0-9_]+$'}
        unproven_reason_code: {type: string, pattern: '^[A-Z][A-Z0-9_]+$'}
      anyOf:
        - required: [capability_keys]
        - required: [capability_prefixes]
