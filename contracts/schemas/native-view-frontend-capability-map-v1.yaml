$schema: https://json-schema.org/draft/2020-12/schema
$id: https://smart-construction.local/contracts/native-view-frontend-capability-map-v1.yaml
title: Native View Frontend Capability Map V1
type: object
additionalProperties: false
required: [schema, authority, unknown_capability_policy, static_ready_allowed, symbols, mappings]
properties:
  schema: {const: native_view_frontend_capability_map/v1}
  authority: {const: p4_evidence_classification_only}
  unknown_capability_policy: {const: fail_closed}
  static_ready_allowed: {const: true}
  symbols:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties: false
      required: [path, selector]
      properties:
        path: {type: string, minLength: 1}
        selector: {type: string, pattern: '^symbol:.+'}
  mappings:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, capability_keys, view_types, consumer_symbol, renderer_key, interaction_symbol, frontend_status, terminal_status, reason_code]
      properties:
        id: {type: string, minLength: 1}
        capability_keys: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        view_types: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        consumer_symbol: {type: string, minLength: 1}
        renderer_key: {type: string, minLength: 1}
        interaction_symbol: {type: string, minLength: 1}
        frontend_status: {enum: [present, reduced, missing, unproven]}
        terminal_status: {enum: [fallback, unsupported]}
        reason_code: {type: string, minLength: 1}
