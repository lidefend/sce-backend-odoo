$schema: https://json-schema.org/draft/2020-12/schema
$id: https://smart-construction.local/contracts/native-view-capability-taxonomy-v1.yaml
title: Native View Capability Taxonomy V1
type: object
additionalProperties: false
required: [schema, authority, unknown_atom_policy, ambiguous_atom_policy, canonical_view_types, input_aliases, excluded_native_syntax, tag_sets, node_rules, attribute_rules, locator, atom_identity, origin_policy]
properties:
  schema: {const: native_view_capability_taxonomy/v1}
  authority: {const: p4_evidence_classification_only}
  unknown_atom_policy: {const: fail_closed}
  ambiguous_atom_policy: {const: fail_closed}
  canonical_view_types: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  input_aliases: {type: object}
  excluded_native_syntax: {type: array, minItems: 1, items: {type: object, required: [kind, reason]}}
  tag_sets:
    type: object
    minProperties: 1
    additionalProperties: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  node_rules: {$ref: '#/$defs/rules'}
  attribute_rules: {$ref: '#/$defs/rules'}
  locator: {type: object, required: [prefix, segment_identity_priority, duplicate_rule, translated_label_is_identity, value_hash_is_identity]}
  atom_identity: {type: object, required: [algorithm, fields]}
  origin_policy: {type: object, required: [unresolved_contributor, synthetic_default]}
$defs:
  rules:
    type: array
    minItems: 1
    items:
      type: object
      required: [id]
      properties:
        id: {type: string, minLength: 1}
        tags: {type: string, minLength: 1}
        tags_exact: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        view_types: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        ancestor_tags: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        absent_ancestor_tags: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        attributes: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        attribute_prefixes: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        capability_key: {type: string, minLength: 1}
        capability_key_template: {type: string, minLength: 1}
      additionalProperties: false
