schema: native_view_capability_reason_codes/v1
scope: product_view_capability_ledger/v1
authority: p4_evidence_classification_only
entries:
  - {code: CAPABILITY_NORMALIZED_CARRIER_MISSING, category: contract_loss, stage: normalized, status: unsupported, meaning: Native capability has no normalized contract carrier., exit_condition: Add a versioned normalized carrier and atom-level evidence.}
  - {code: CAPABILITY_SEMANTIC_CARRIER_MISSING, category: contract_loss, stage: semantic, status: unsupported, meaning: Normalized capability has no semantic contract carrier., exit_condition: Add a semantic carrier without reconstructing business meaning in the frontend.}
  - {code: CAPABILITY_PARSER_FALLBACK_UNTRACED, category: evidence_gap, stage: normalized, status: fallback, meaning: Parser failure or defaulting is not represented as explicit evidence., exit_condition: Emit fail-closed parser outcome and source evidence.}
  - {code: CAPABILITY_DYNAMIC_VERDICT_NOT_EVALUATED, category: runtime_gap, stage: semantic, status: fallback, meaning: Dynamic modifiers or expressions were not evaluated for the governed runtime context., exit_condition: Record context-bound evaluation evidence for each occurrence.}
  - {code: CAPABILITY_PERMISSION_PRUNING_UNTRACED, category: evidence_gap, stage: semantic, status: fallback, meaning: Permission pruning removed a capability without rejection evidence., exit_condition: Preserve the rejected occurrence and governed identity context.}
  - {code: CAPABILITY_ACTION_IDENTITY_REDUCED, category: semantic_reduction, stage: semantic, status: fallback, meaning: Native action identity or invocation semantics were reduced., exit_condition: Preserve native action identity parameters and interaction mapping.}
  - {code: CAPABILITY_SEARCH_SEMANTICS_REDUCED, category: semantic_reduction, stage: semantic, status: fallback, meaning: Native search context operator domain panel or favorite semantics were reduced., exit_condition: Carry and consume each search capability explicitly.}
  - {code: CAPABILITY_NATIVE_SOURCE_GRAPH_INCOMPLETE, category: provenance_gap, stage: native, status: fallback, meaning: Native inheritance contributors cannot be traced to the resolved occurrence., exit_condition: Export the complete contributor graph and resolved occurrence lineage.}
  - {code: CAPABILITY_MULTI_SOURCE_COMPAT_PROJECTION, category: frontend_projection, stage: frontend, status: fallback, meaning: Runtime behavior depends on a compatibility projection across multiple contract sources., exit_condition: Consume one canonical atom with explicit projection lineage.}
  - {code: CAPABILITY_SOURCE_AUTHORITY_AMBIGUOUS, category: provenance_gap, stage: frontend, status: fallback, meaning: Multiple sources can override the same capability without declared authority., exit_condition: Declare and enforce one source authority for the capability atom.}
  - {code: CAPABILITY_ROUTE_DERIVED_PRESENTATION, category: frontend_inference, stage: frontend, status: fallback, meaning: Route state changes presentation semantics without a canonical contract atom., exit_condition: Move presentation intent into the canonical contract.}
  - {code: CAPABILITY_ADVANCED_FIELD_GUESSED, category: frontend_inference, stage: frontend, status: fallback, meaning: Frontend guesses an advanced view field from generic model fields., exit_condition: Export and consume the exact field capability atom.}
  - {code: CAPABILITY_WIDGET_NOT_REGISTERED, category: renderer_gap, stage: frontend, status: unsupported, meaning: A native widget has no registered generic contract renderer., exit_condition: Register a generic renderer and bind interaction evidence.}
  - {code: CAPABILITY_NATIVE_SUBVIEW_NOT_TRACED, category: provenance_gap, stage: frontend, status: fallback, meaning: Embedded native subview lineage is absent from the consumed contract., exit_condition: Carry the subview reference and resolved atom lineage end to end.}
  - {code: CAPABILITY_INTERACTION_EVIDENCE_MISSING, category: evidence_gap, stage: frontend, status: fallback, meaning: A rendered capability has no verified interaction carrier., exit_condition: Bind the renderer output to a tested interaction symbol.}
  - {code: RENDERER_PIVOT_PLANNED, category: renderer_gap, stage: frontend, status: fallback, meaning: Pivot uses the governed readable-records fallback., exit_condition: Deliver and verify the pivot renderer.}
  - {code: RENDERER_GRAPH_PLANNED, category: renderer_gap, stage: frontend, status: fallback, meaning: Graph uses the governed readable-records fallback., exit_condition: Deliver and verify the graph renderer.}
  - {code: RENDERER_CALENDAR_PLANNED, category: renderer_gap, stage: frontend, status: fallback, meaning: Calendar uses the governed readable-records fallback., exit_condition: Deliver and verify the calendar renderer.}
  - {code: RENDERER_GANTT_PLANNED, category: renderer_gap, stage: frontend, status: fallback, meaning: Gantt uses the governed readable-records fallback., exit_condition: Deliver and verify the gantt renderer.}
  - {code: RENDERER_ACTIVITY_PLANNED, category: renderer_gap, stage: frontend, status: fallback, meaning: Activity uses the governed readable-records fallback., exit_condition: Deliver and verify the activity renderer.}
  - {code: RENDERER_DASHBOARD_PLANNED, category: renderer_gap, stage: frontend, status: fallback, meaning: Dashboard uses the governed readable-records fallback., exit_condition: Deliver and verify the dashboard renderer.}
  - {code: ACTION_SURFACE_RENDERER_NOT_REGISTERED, category: renderer_gap, stage: frontend, status: unsupported, meaning: The semantic action surface has no registered renderer., exit_condition: Register an allowed generic renderer or reject the surface at publication.}
