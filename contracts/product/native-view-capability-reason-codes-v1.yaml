schema: native_view_capability_reason_codes/v1
scope: product_view_capability_ledger/v1
authority: p4_evidence_classification_only
entries:
  - {code: CAPABILITY_NATIVE_ATOM_UNCLASSIFIED, category: native_failure, stage: native, status: unsupported, gate_effect: silent_loss, meaning: Native syntax is outside the governed taxonomy., exit_condition: Classify or explicitly exclude the native syntax.}
  - {code: CAPABILITY_NATIVE_VIEW_RESOLUTION_FAILED, category: native_failure, stage: native, status: unsupported, gate_effect: silent_loss, meaning: A formal product view could not be resolved., exit_condition: Restore deterministic native view resolution.}
  - {code: CAPABILITY_ATOM_LOCATOR_COLLISION, category: native_failure, stage: native, status: unsupported, gate_effect: silent_loss, meaning: Two native occurrences produced the same stable identity., exit_condition: Correct locator and occurrence identity rules.}
  - {code: CAPABILITY_NATIVE_SOURCE_GRAPH_INCOMPLETE, category: provenance_gap, stage: native, status: fallback, gate_effect: classified_gap, meaning: Native inheritance contributors cannot be traced to the resolved occurrence., exit_condition: Export the complete contributor graph and occurrence lineage.}
  - {code: CAPABILITY_NATIVE_CONTRIBUTOR_APPLICATION_UNPROVEN, category: provenance_gap, stage: native, status: fallback, gate_effect: classified_gap, meaning: Contributor applicability or order is not proven by the native engine., exit_condition: Bind the graph to the native inheritance application order.}
  - {code: CAPABILITY_NORMALIZED_CARRIER_MISSING, category: contract_loss, stage: normalized, status: unsupported, gate_effect: classified_gap, meaning: Native capability has no normalized contract carrier., exit_condition: Add a versioned normalized carrier and atom-level evidence.}
  - {code: CAPABILITY_PARSER_PRIMARY_FAILED, category: contract_loss, stage: normalized, status: unsupported, gate_effect: classified_gap, meaning: The primary parser failed for a resolved native view., exit_condition: Make the primary parser produce a valid explicit result.}
  - {code: CAPABILITY_PARSER_FALLBACK_ACTIVE, category: contract_loss, stage: normalized, status: fallback, gate_effect: classified_gap, meaning: An explicitly traced fallback parser carries the capability., exit_condition: Restore equivalent primary parser output.}
  - {code: CAPABILITY_PARSER_FALLBACK_UNTRACED, category: evidence_gap, stage: normalized, status: unsupported, gate_effect: silent_loss, meaning: Parser defaulting cannot be traced to an explicit outcome., exit_condition: Emit a fail-closed parser outcome and source evidence.}
  - {code: CAPABILITY_STAGE_VALUE_REDUCED, category: semantic_reduction, stage: normalized, status: fallback, gate_effect: classified_gap, meaning: A carrier exists but occurrence count or canonical value is reduced., exit_condition: Preserve equivalent occurrence count and canonical value.}
  - {code: CAPABILITY_SEMANTIC_CARRIER_MISSING, category: contract_loss, stage: semantic, status: unsupported, gate_effect: classified_gap, meaning: Normalized capability has no semantic contract carrier., exit_condition: Add a semantic carrier without frontend reconstruction.}
  - {code: CAPABILITY_DYNAMIC_VERDICT_NOT_EVALUATED, category: runtime_gap, stage: semantic, status: fallback, gate_effect: classified_gap, meaning: Dynamic behavior was not evaluated for the governed record context., exit_condition: Record context-bound evaluation evidence for each occurrence.}
  - {code: CAPABILITY_PERMISSION_PRUNING_UNTRACED, category: evidence_gap, stage: semantic, status: unsupported, gate_effect: silent_loss, meaning: Permission pruning removed a capability without rejection evidence., exit_condition: Preserve the rejected occurrence and governed identity context.}
  - {code: CAPABILITY_ACTION_IDENTITY_REDUCED, category: semantic_reduction, stage: semantic, status: fallback, gate_effect: classified_gap, meaning: Native action identity or invocation semantics were reduced., exit_condition: Preserve action identity parameters and interaction mapping.}
  - {code: CAPABILITY_SEARCH_SEMANTICS_REDUCED, category: semantic_reduction, stage: semantic, status: fallback, gate_effect: classified_gap, meaning: Native search context operator domain panel or favorite semantics were reduced., exit_condition: Carry and consume each search capability explicitly.}
  - {code: CAPABILITY_MULTI_SOURCE_COMPAT_PROJECTION, category: frontend_projection, stage: frontend, status: fallback, gate_effect: classified_gap, meaning: Runtime behavior depends on a compatibility projection across multiple sources., exit_condition: Consume one canonical atom with explicit projection lineage.}
  - {code: CAPABILITY_SOURCE_AUTHORITY_AMBIGUOUS, category: provenance_gap, stage: frontend, status: fallback, gate_effect: classified_gap, meaning: Multiple sources override one capability without declared authority., exit_condition: Declare and enforce one source authority.}
  - {code: CAPABILITY_ROUTE_DERIVED_PRESENTATION, category: frontend_inference, stage: frontend, status: fallback, gate_effect: classified_gap, meaning: Route state changes presentation without a canonical atom., exit_condition: Move presentation intent into the canonical contract.}
  - {code: CAPABILITY_ADVANCED_FIELD_GUESSED, category: frontend_inference, stage: frontend, status: fallback, gate_effect: classified_gap, meaning: Frontend guesses an advanced field from generic model fields., exit_condition: Export and consume the exact field atom.}
  - {code: CAPABILITY_WIDGET_NOT_REGISTERED, category: renderer_gap, stage: frontend, status: unsupported, gate_effect: classified_gap, meaning: A native widget has no registered generic renderer., exit_condition: Register a generic renderer and bind interaction evidence.}
  - {code: CAPABILITY_NATIVE_SUBVIEW_NOT_TRACED, category: provenance_gap, stage: frontend, status: fallback, gate_effect: classified_gap, meaning: Embedded native subview lineage is absent from the consumed contract., exit_condition: Carry the subview reference and lineage end to end.}
  - {code: CAPABILITY_INTERACTION_EVIDENCE_MISSING, category: evidence_gap, stage: interaction, status: fallback, gate_effect: classified_gap, meaning: A rendered capability has no verified interaction carrier., exit_condition: Bind renderer output to a non-zero tested interaction.}
  - {code: RENDERER_PIVOT_READABLE_RECORDS_FALLBACK, category: renderer_gap, stage: frontend, status: fallback, gate_effect: classified_gap, meaning: Pivot uses the readable-records fallback., exit_condition: Deliver and verify the pivot renderer.}
  - {code: RENDERER_GRAPH_READABLE_RECORDS_FALLBACK, category: renderer_gap, stage: frontend, status: fallback, gate_effect: classified_gap, meaning: Graph uses the readable-records fallback., exit_condition: Deliver and verify the graph renderer.}
  - {code: RENDERER_CALENDAR_READABLE_RECORDS_FALLBACK, category: renderer_gap, stage: frontend, status: fallback, gate_effect: classified_gap, meaning: Calendar uses the readable-records fallback., exit_condition: Deliver and verify the calendar renderer.}
  - {code: RENDERER_GANTT_READABLE_RECORDS_FALLBACK, category: renderer_gap, stage: frontend, status: fallback, gate_effect: classified_gap, meaning: Gantt uses the readable-records fallback., exit_condition: Deliver and verify the gantt renderer.}
  - {code: RENDERER_ACTIVITY_READABLE_RECORDS_FALLBACK, category: renderer_gap, stage: frontend, status: fallback, gate_effect: classified_gap, meaning: Activity uses the readable-records fallback., exit_condition: Deliver and verify the activity renderer.}
  - {code: RENDERER_DASHBOARD_READABLE_RECORDS_FALLBACK, category: renderer_gap, stage: frontend, status: fallback, gate_effect: classified_gap, meaning: Dashboard uses the readable-records fallback., exit_condition: Deliver and verify the dashboard renderer.}
  - {code: ACTION_SURFACE_RENDERER_NOT_REGISTERED, category: renderer_gap, stage: frontend, status: unsupported, gate_effect: classified_gap, meaning: The semantic action surface has no registered renderer., exit_condition: Register an allowed generic renderer or reject the surface.}
