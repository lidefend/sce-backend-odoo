# contracts registry —— 契约版本登记表（权威）
#
# 规则：
# 1. contracts/ 下每一个契约文档必须在 registry 登记 path 与 version。
# 2. product/ domain/ extensions/ 文档自身必须带同值 `version` 键（lint 双向校验）。
# 3. schemas/ 为纯结构映射（顶层键即 schema 名），版本只登记在 registry。
# 4. api/openapi.yaml 版本以 info.version 为准，registry 同值登记。
# 5. 版本为正整数，破坏性变更 +1；generated/contract-registry.json 由
#    `make contract.registry.export` 从本表再生成，禁止手改。

registry_version: 1

contracts:
  - path: product/payment-request.yaml
    kind: product
    domain: payment_request
    version: 1
  - path: domain/payment-request.yaml
    kind: domain
    domain: payment_request
    version: 2
  - path: domain/payment-execution.yaml
    kind: domain
    domain: payment_execution
    version: 1
  - path: domain/general-contract.yaml
    kind: domain
    domain: general_contract
    version: 1
  - path: domain/settlement.yaml
    kind: domain
    domain: settlement
    version: 1
  - path: domain/expense-claim.yaml
    kind: domain
    domain: expense_claim
    version: 1
  - path: domain/invoice-registration.yaml
    kind: domain
    domain: invoice_registration
    version: 1
  - path: domain/receipt-income.yaml
    kind: domain
    domain: receipt_income
    version: 1
  - path: domain/project-lifecycle.yaml
    kind: domain
    domain: project_lifecycle
    version: 1
  - path: schemas/common.yaml
    kind: schema
    version: 1
  - path: schemas/contract-ref.yaml
    kind: schema
    version: 1
  - path: schemas/money.yaml
    kind: schema
    version: 1
  - path: schemas/project-ref.yaml
    kind: schema
    version: 1
  - path: schemas/payment-request.yaml
    kind: schema
    version: 1
  - path: api/openapi.yaml
    kind: api
    version: 0.1.0
  - path: api/payment-request.yaml
    kind: api
    version: 1
  - path: extensions/permission.yaml
    kind: extension
    version: 1
  - path: extensions/ui.yaml
    kind: extension
    version: 1
  - path: extensions/workflow.yaml
    kind: extension
    version: 1
