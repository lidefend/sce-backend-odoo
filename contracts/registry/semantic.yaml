# 语义词典 —— 契约层唯一的"字段意味着什么"声明权威（FE-CONTRACT-RUNTIME-01）
#
# 解决的问题（00 清单 G1）：组件键词表此前由后端私有映射函数
# `unified_page_contract_v2_assembler._component_key()` 与前端
# `professionalComponentRegistry.ts` 各持一半，契约层既不枚举也不校验，
# 后端可以产出前端未登记的键，且未识别 widget 会静默回落。
#
# 本文件把这条链路收敛为单一声明：
#
#   semantic（本文件） --derivation--> semantic --component--> componentKey
#
# `derivation` 是数据而不是代码：Odoo 字段事实（ttype / widget）命中即得
# semantic，再经 component.yaml 得到组件键。新增业务字段时，只要命中已有
# 规则、或由上层契约直接声明 `semantic`，就不需要新增任何前后端映射代码。
#
# 范围边界：
# - 语义文件不声明 capabilities；Renderer 实现所需能力及平台 provider 在
#   component.yaml 中声明，并由 FormSection 宿主在运行时提供和校验。
# - 不声明状态机：状态与转移的归属见 docs/contract-runtime-state-ownership.md。
registry: semantic

# Native View Widget support classification. This does not select a component;
# it records whether the explicit XML token has a real native takeover path.
# `unsupported` must never fall back to the field-type control because that
# would turn an unknown editor into a seemingly valid input.
native_widgets:
  input: {status: ready}
  select: {status: ready}
  date: {status: ready}
  datetime: {status: ready}
  number: {status: ready}
  table: {status: ready}
  upload: {status: ready}
  button: {status: ready}
  textarea: {status: ready}
  checkbox: {status: ready}
  radio: {status: ready}
  tree: {status: ready}
  relation: {status: ready}
  display: {status: ready}
  binary: {status: ready}
  many2many_tags: {status: ready}
  selection: {status: ready}
  many2one: {status: ready}
  many2many: {status: ready}
  one2many: {status: ready}
  one2many_list: {status: ready}
  boolean: {status: ready}
  boolean_favorite: {status: ready}
  boolean_toggle:
    status: fallback
    reason_code: NATIVE_WIDGET_GENERIC_VISUAL_FALLBACK
  monetary: {status: ready}
  float_time: {status: ready}
  percentage: {status: ready}
  percentpie: {status: ready}
  statusbar: {status: ready}
  badge: {status: ready}
  image:
    status: fallback
    reason_code: NATIVE_WIDGET_GENERIC_VISUAL_FALLBACK
  html: {status: ready}
  text: {status: ready}
  handle:
    status: fallback
    reason_code: NATIVE_WIDGET_GENERIC_VISUAL_FALLBACK
  phone: {status: ready}
  url: {status: ready}
  email: {status: ready}
  json: {status: ready}
  daterange: {status: ready}
  analytic_distribution: {status: ready}
  many2many_binary: {status: ready}
  many2one_avatar_user: {status: ready}
  account_type_selection:
    status: fallback
    reason_code: NATIVE_WIDGET_PLATFORM_COMPONENT_SUBSTITUTION
  list_activity:
    status: fallback
    reason_code: NATIVE_WIDGET_PLATFORM_COMPONENT_SUBSTITUTION
  res_partner_many2one:
    status: fallback
    reason_code: NATIVE_WIDGET_GENERIC_VISUAL_FALLBACK
  field_partner_autocomplete:
    status: fallback
    reason_code: NATIVE_WIDGET_GENERIC_VISUAL_FALLBACK
  domain:
    status: unsupported
    reason_code: NATIVE_WIDGET_DOMAIN_EDITOR_UNSUPPORTED
  tier_validation:
    status: unsupported
    reason_code: NATIVE_WIDGET_QWEB_RENDERER_UNSUPPORTED
  account-tax-totals-field: {status: ready}
  payment: {status: ready}
  statinfo: {status: ready}

# Embedded Form <widget name="..."/> nodes are layout nodes, not field editor
# widgets. The default channel preserves every unrecognized node for explicit
# fail-closed consumption and diagnostics.
native_view_widget_default:
  status: unsupported
  component: sc.unsupported.native_node
  reason_code: NATIVE_VIEW_WIDGET_UNSUPPORTED
native_view_widgets:
  web_ribbon:
    status: ready
    component: sc.display.ribbon
  sc_insight_banner:
    status: ready
    component: sc.insight.summary
    payload_required: true
  sc_stage_requirements:
    status: ready
    component: sc.action.list
    payload_required: true
  sc_next_actions:
    status: ready
    component: sc.action.list
    payload_required: true

# 推导规则：有序，首个匹配生效；全部未命中时使用 default。
derivation:
  default: readable_value
  rules:
    - semantic: reference
      when: {field_types: [many2one_reference, reference]}
      reason: reference 值是 (model, id) 对，客户端解析后展示只读文本；声明类型优先于任何 widget 拼写。
    - semantic: money
      when: {field_types: [monetary]}
    - semantic: money
      when: {widgets: [monetary]}
    - semantic: percentage
      when: {widgets: [percentage, percentpie]}
    - semantic: duration
      when: {widgets: [float_time]}
    - semantic: status
      when: {widgets: [statusbar, badge]}
    - semantic: choice
      when: {widgets: [account_type_selection]}
      reason: account_type_selection 只表达选择项，由平台远程选择组件承接，不执行 Odoo 嵌入 widget。
    - semantic: activity_collection
      when: {widgets: [list_activity]}
      reason: list_activity 表达活动集合，由平台活动集合语义组件承接，不执行 Odoo 嵌入 widget。
    - semantic: boolean
      when: {field_types: [boolean]}
    - semantic: readable_value
      when: {widgets: [account-tax-totals-field, payment, statinfo]}
      reason: 会计只读摘要/统计载体（tax_totals、支付挂件、statinfo）是可读展示，不是可编辑的二进制或数字控件。
    - semantic: relation
      when: {field_types: [many2one]}
    - semantic: relation
      when: {widget_suffix: many2one}
    - semantic: relation_collection
      when: {field_types: [many2many], widgets_exclude: [many2many_tags]}
    - semantic: detail_collection
      when: {field_types: [one2many]}
    - semantic: relation
      when: {widgets: [relation]}
      reason: 残余 relation 控件等价于关系语义；many2many/one2many 已由更早的字段类型规则接管。
    - semantic: text
      when: {widgets: [input]}
    - semantic: binary
      when: {widgets: [binary]}
    - semantic: binary
      when: {widgets: [upload]}
      reason: upload 是 binary 字段的上传控件，与 binary 同一渲染族；声明类型优先于控件拼写。
    - semantic: long_text
      when: {widgets: [textarea]}
    - semantic: number
      when: {widgets: [number]}
    - semantic: choice
      when: {widgets: [select]}
    - semantic: choice
      when: {widgets: [radio]}
      reason: radio 是 selection 的单选呈现，与 select 同义。
    - semantic: boolean
      when: {widgets: [checkbox]}
    - semantic: date
      when: {widgets: [date]}
    - semantic: datetime
      when: {widgets: [datetime]}
    - semantic: detail_table
      when: {widgets: [table]}
    - semantic: detail_table
      when: {widgets: [gantt]}
      reason: gantt 是集合的时间轴呈现，暂由通用集合渲染器接管；没有独立甘特组件。
    - semantic: hierarchical_collection
      when: {widgets: [tree]}
    - semantic: tag_collection
      when: {widgets: [many2many_tags]}
    - semantic: action
      when: {widgets: [button]}
    - semantic: readable_value
      when: {widgets: [display]}

# 语义词表。`component` 指向 component.yaml 中登记的组件键。
semantics:
  text: {category: basic, component: sc.input.text}
  long_text: {category: basic, component: sc.input.textarea}
  number: {category: basic, component: sc.input.number}
  boolean: {category: basic, component: sc.input.boolean}
  choice: {category: basic, component: sc.select.remote}
  binary: {category: basic, component: sc.input.binary}
  reference: {category: basic, component: sc.display.text}
  readable_value: {category: basic, component: sc.display.text}
  date: {category: temporal, component: sc.input.date}
  datetime: {category: temporal, component: sc.input.datetime}
  duration: {category: temporal, component: sc.value.duration}
  money: {category: business, component: sc.value.money}
  percentage: {category: business, component: sc.value.percentage}
  status: {category: business, component: sc.display.status}
  relation: {category: relation, component: sc.relation.many2one}
  relation_collection: {category: relation, component: sc.relation.many2many}
  tag_collection: {category: relation, component: sc.select.tags}
  detail_collection: {category: collection, component: sc.relation.table}
  activity_collection: {category: collection, component: sc.relation.activity}
  detail_table: {category: collection, component: sc.table.data}
  hierarchical_collection: {category: collection, component: sc.tree.data}
  action: {category: behavioral, component: sc.button.action}
  credential_entry: {category: auth, component: sc.auth.credential_entry}
  secret_confirmation: {category: auth, component: sc.auth.secret_confirmation}
  challenge_status: {category: auth, component: sc.auth.challenge_status}
  one_time_secret: {category: auth, component: sc.auth.one_time_secret}
  support_action: {category: auth, component: sc.auth.support_action}
  payment_settlement_detail_collection: {category: industry, component: sc.payment.settlement_detail_collection}
  unsupported_native_widget: {category: behavioral, component: sc.unsupported.native_widget}
