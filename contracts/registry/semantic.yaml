# Contract V2.7 semantic specification.
#
# This is the client-independent authority for what a field or native node means:
# applicability, value shape, required constraints and payload protocol version.
# It does not name a Vue component, renderer, renderer version or visual profile.
# The frontend implementation registry owns those facts and resolves them from
# semantic identity.
#
# Backend semantic validity must remain decidable without loading any frontend
# implementation table.
registry: semantic

# Native View Widget support classification. This does not select a component;
# it records whether the explicit XML token has a real native takeover path.
# `unsupported` must never fall back to the field-type control because that
# would turn an unknown editor into a seemingly valid input.
native_widgets:
  input: {status: ready}
  select: {status: ready}
  date: {status: ready}
  datetime: {status: ready}
  number: {status: ready}
  table: {status: ready}
  upload: {status: ready}
  button: {status: ready}
  textarea: {status: ready}
  checkbox: {status: ready}
  radio: {status: ready}
  tree: {status: ready}
  relation: {status: ready}
  display: {status: ready}
  binary: {status: ready}
  many2many_tags: {status: ready}
  selection: {status: ready}
  many2one: {status: ready}
  many2many: {status: ready}
  one2many: {status: ready}
  one2many_list: {status: ready}
  boolean: {status: ready}
  boolean_favorite: {status: ready}
  boolean_toggle:
    status: fallback
    reason_code: NATIVE_WIDGET_GENERIC_VISUAL_FALLBACK
  monetary: {status: ready}
  float_time: {status: ready}
  percentage: {status: ready}
  percentpie: {status: ready}
  statusbar: {status: ready}
  badge: {status: ready}
  image:
    status: fallback
    reason_code: NATIVE_WIDGET_GENERIC_VISUAL_FALLBACK
  html: {status: ready}
  text: {status: ready}
  handle:
    status: fallback
    reason_code: NATIVE_WIDGET_GENERIC_VISUAL_FALLBACK
  phone: {status: ready}
  url: {status: ready}
  email: {status: ready}
  json: {status: ready}
  daterange: {status: ready}
  analytic_distribution: {status: ready}
  many2many_binary: {status: ready}
  many2one_avatar_user: {status: ready}
  account_type_selection:
    status: fallback
    reason_code: NATIVE_WIDGET_PLATFORM_COMPONENT_SUBSTITUTION
  list_activity:
    status: fallback
    reason_code: NATIVE_WIDGET_PLATFORM_COMPONENT_SUBSTITUTION
  res_partner_many2one:
    status: fallback
    reason_code: NATIVE_WIDGET_GENERIC_VISUAL_FALLBACK
  field_partner_autocomplete:
    status: fallback
    reason_code: NATIVE_WIDGET_GENERIC_VISUAL_FALLBACK
  domain:
    status: unsupported
    reason_code: NATIVE_WIDGET_DOMAIN_EDITOR_UNSUPPORTED
  tier_validation:
    status: unsupported
    reason_code: NATIVE_WIDGET_QWEB_RENDERER_UNSUPPORTED
  account-tax-totals-field: {status: ready}
  payment: {status: ready}
  statinfo: {status: ready}
  gantt: {status: ready}

# Embedded Form <widget name="..."/> nodes are layout nodes, not field editor
# widgets. The default channel preserves every unrecognized node for explicit
# fail-closed consumption and diagnostics.
native_view_widget_default:
  status: unsupported
  semantic: unsupported_native_node
  reason_code: NATIVE_VIEW_WIDGET_UNSUPPORTED
native_view_widgets:
  web_ribbon:
    status: ready
    semantic: display_ribbon
  sc_insight_banner:
    status: ready
    semantic: insight_summary
    payload_required: true
    payload_schema: insight_summary.v1
  sc_stage_requirements:
    status: ready
    semantic: action_list
    payload_required: true
    payload_schema: action_list.v1
  sc_next_actions:
    status: ready
    semantic: action_list
    payload_required: true
    payload_schema: action_list.v1

# 推导规则：有序，首个匹配生效；全部未命中时使用 default。
derivation:
  default: readable_value
  rules:
    - semantic: reference
      when: {field_types: [many2one_reference, reference]}
      reason: reference 值是 (model, id) 对，客户端解析后展示只读文本；声明类型优先于任何 widget 拼写。
    - semantic: money
      when: {field_types: [monetary]}
    - semantic: money
      when: {widgets: [monetary]}
    - semantic: percentage
      when: {widgets: [percentage, percentpie]}
    - semantic: duration
      when: {widgets: [float_time]}
    - semantic: status
      when: {widgets: [statusbar, badge]}
    - semantic: choice
      when: {widgets: [account_type_selection]}
      reason: account_type_selection 只表达选择项，由平台远程选择组件承接，不执行 Odoo 嵌入 widget。
    - semantic: activity_collection
      when: {widgets: [list_activity]}
      reason: list_activity 表达活动集合，由平台活动集合语义组件承接，不执行 Odoo 嵌入 widget。
    - semantic: boolean
      when: {field_types: [boolean]}
    - semantic: readable_value
      when: {widgets: [account-tax-totals-field, payment, statinfo]}
      reason: 会计只读摘要/统计载体（tax_totals、支付挂件、statinfo）是可读展示，不是可编辑的二进制或数字控件。
    - semantic: relation
      when: {field_types: [many2one]}
    - semantic: relation
      when: {widget_suffix: many2one}
    - semantic: relation_collection
      when: {field_types: [many2many], widgets_exclude: [many2many_tags]}
    - semantic: detail_collection
      when: {field_types: [one2many]}
    - semantic: relation
      when: {widgets: [relation]}
      reason: 残余 relation 控件等价于关系语义；many2many/one2many 已由更早的字段类型规则接管。
    - semantic: text
      when: {widgets: [input]}
    - semantic: binary
      when: {widgets: [binary]}
    - semantic: binary
      when: {widgets: [upload]}
      reason: upload 是 binary 字段的上传控件，与 binary 同一渲染族；声明类型优先于控件拼写。
    - semantic: long_text
      when: {widgets: [textarea]}
    - semantic: number
      when: {widgets: [number]}
    - semantic: choice
      when: {widgets: [select]}
    - semantic: choice
      when: {widgets: [radio]}
      reason: radio 是 selection 的单选呈现，与 select 同义。
    - semantic: boolean
      when: {widgets: [checkbox]}
    - semantic: date
      when: {widgets: [date]}
    - semantic: datetime
      when: {widgets: [datetime]}
    - semantic: detail_table
      when: {widgets: [table]}
    - semantic: detail_table
      when: {widgets: [gantt]}
      reason: gantt 是集合的时间轴呈现，暂由通用集合渲染器接管；没有独立甘特组件。
    - semantic: hierarchical_collection
      when: {widgets: [tree]}
    - semantic: tag_collection
      when: {widgets: [many2many_tags]}
    - semantic: action
      when: {widgets: [button]}
    - semantic: readable_value
      when: {widgets: [display]}

# Field semantics. `field_types` is semantic applicability, not renderer support.
# `*` means any field type after any semantic-specific constraints are checked.
semantics:
  text: {category: basic, applies_to: field, field_types: [char]}
  long_text: {category: basic, applies_to: field, field_types: [text, html]}
  number: {category: basic, applies_to: field, field_types: [integer, float, monetary]}
  boolean: {category: basic, applies_to: field, field_types: [boolean]}
  choice: {category: basic, applies_to: field, field_types: [selection]}
  binary: {category: basic, applies_to: field, field_types: [binary]}
  reference: {category: basic, applies_to: field, field_types: [many2one_reference, reference]}
  readable_value: {category: basic, applies_to: field, field_types: ["*"]}
  date: {category: temporal, applies_to: field, field_types: [date]}
  datetime: {category: temporal, applies_to: field, field_types: [datetime]}
  duration: {category: temporal, applies_to: field, field_types: [float, integer]}
  money: {category: business, applies_to: field, field_types: [monetary, float]}
  percentage: {category: business, applies_to: field, field_types: [float, integer]}
  status: {category: business, applies_to: field, field_types: [selection, char]}
  relation: {category: relation, applies_to: field, field_types: [many2one]}
  relation_collection: {category: relation, applies_to: field, field_types: [many2many]}
  tag_collection: {category: relation, applies_to: field, field_types: [many2many]}
  detail_collection: {category: collection, applies_to: field, field_types: [one2many]}
  activity_collection: {category: collection, applies_to: field, field_types: [one2many]}
  detail_table: {category: collection, applies_to: field, field_types: [one2many, many2many]}
  hierarchical_collection: {category: collection, applies_to: field, field_types: [one2many, many2many]}
  action: {category: behavioral, applies_to: field, field_types: [action]}
  credential_entry: {category: auth, applies_to: field, field_types: [char]}
  secret_confirmation: {category: auth, applies_to: field, field_types: [char]}
  challenge_status: {category: auth, applies_to: field, field_types: [char, selection, text]}
  one_time_secret: {category: auth, applies_to: field, field_types: [char, text]}
  support_action: {category: auth, applies_to: field, field_types: [action]}
  payment_settlement_detail_collection: {category: industry, applies_to: field, field_types: [one2many]}
  unsupported_native_widget: {category: behavioral, applies_to: field, field_types: ["*"]}

# Native semantic nodes. Payload schemas and business constraints are owned here;
# concrete frontend implementations are resolved by the frontend.
node_semantics:
  feedback_message: {category: behavioral}
  navigation_anchor: {category: behavioral}
  display_ribbon: {category: behavioral}
  insight_summary: {category: industry}
  action_list: {category: behavioral}
  unsupported_native_node: {category: behavioral}
