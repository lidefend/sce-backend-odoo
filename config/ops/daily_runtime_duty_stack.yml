# Governed daily-runtime duty stack (P4).
#
# One duty = one cluster + one application instance + one exact route. The owner
# ruling of 2026-10-15 scopes this file to the *daily development server*; it is
# never used for a production tenant, and the production candidate template
# (`docker-compose.production-candidate.yml`) keeps its own single-tenant shape.
#
# Two properties of the 2026-10-15 incident are designed out rather than
# documented:
#
# * the cluster bootstrap role and the application role are *different* roles
#   (`POSTGRES_USER` is the maintenance role; the Odoo process connects as
#   `DB_USER`), because a cluster whose bootstrap superuser is also the
#   application role can never satisfy policy section 6, and the delegated
#   `CREATE ROLE ... NOSUPERUSER` path would be impossible;
# * every duty names its own volumes, so one data directory has exactly one
#   writer and two postmasters can never mount the same PGDATA.
#
# Environment values come from the duty env file rendered by
# `scripts/ops/daily_runtime_database_duty.py`; this file is passed explicitly
# with `-f`, so the executed definition is the reviewed one.
services:

  db:
    image: ${POSTGRES_IMAGE:-postgres:15}
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_MAINTENANCE_USER}
      POSTGRES_PASSWORD: ${DB_MAINTENANCE_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_MAINTENANCE_USER} -d postgres || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: ${ODOO_IMAGE}
    restart: unless-stopped
    tty: true
    stdin_open: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ODOO_DB: ${DB_NAME}
      ODOO_DBFILTER: ${ODOO_DBFILTER}
      LIST_DB: "false"
      # The runtime-environment discriminator is read *inside* the container, not
      # only by the host entry. `render_odoo_conf.py` may only drop an unavailable
      # optional addon root when `ENV` says this is not production, and product
      # code (`platform_database_contract`, `system_init`) reads `SC_ENVIRONMENT`.
      # A stack that declares the environment in its env file but never forwards
      # it keeps an `addons_path` entry for a directory the duty does not mount,
      # and then every `/api/*` route fails before dispatch (2026-10-16).
      ENV: ${ENV}
      SC_ENVIRONMENT: ${SC_ENVIRONMENT}
      # The demo-data switches travel with the environment discriminator, for
      # the same reason: a stack that declares the demo purpose in its env file
      # and never forwards the switch leaves the demo module's own guard to
      # refuse a seed that the declaration said was allowed (2026-10-16).
      SC_ALLOW_DEMO_DATA: ${SC_ALLOW_DEMO_DATA}
      SC_DEMO_USER_PASSWORD: ${SC_DEMO_USER_PASSWORD}
      ADMIN_PASSWD: ${ADMIN_PASSWD}
      JWT_SECRET: ${JWT_SECRET}
      SC_BOOTSTRAP_SECRET: ${SC_BOOTSTRAP_SECRET}
      SC_BOOTSTRAP_LOGIN: ${SC_BOOTSTRAP_LOGIN}
      SCENE_CHANNEL: ${SCENE_CHANNEL}
      SCENE_USE_PINNED: ${SCENE_USE_PINNED}
      SCENE_ROLLBACK: ${SCENE_ROLLBACK}
      SC_SOURCE_REVISION: ${SC_SOURCE_REVISION}
      # The build identity the application *publishes* for what it serves. The
      # source revision alone is not the served bundle: a merge that changes no
      # frontend source leaves the artifact at its previous generation, so the
      # acceptance lanes key their evidence reuse on the artifact fingerprint
      # and `/api/runtime-version` has to answer which frontend is deployed. A
      # stack that forwards only the revision reports an unidentified bundle and
      # silently degrades that reuse key to the deployment (2026-10-16).
      FRONTEND_BUILD_SHA256: ${FRONTEND_BUILD_SHA256}
      REDIS_HOST: redis
      ODOO_CONF_OUT: /var/lib/odoo/odoo.conf
      TERM: xterm-256color
      COLORTERM: truecolor
    volumes:
      - odoo_data:/var/lib/odoo
      - odoo_data:/opt/sce-runtime
      - ${SC_PRODUCT_ROOT}/addons:/mnt/source-addons:ro
      - ${DEMO_ADDONS_ROOT}:/mnt/demo-addons:ro
      - ${CUSTOMER_ADDONS_ROOT}:/mnt/customer-addons:ro
      - ${SC_PRODUCT_ROOT}/addons_external:/mnt/addons_external:ro
      - ${SC_PRODUCT_ROOT}/artifacts:/mnt/artifacts
      - ${SC_PRODUCT_ROOT}/scripts:/mnt/scripts:ro
      - ${SC_PRODUCT_ROOT}/docs:/mnt/docs:ro
      - ${SC_PRODUCT_ROOT}/VERSION:/opt/sce-product/VERSION:ro
      - ${SC_PRODUCT_ROOT}/config/odoo.conf.template:/etc/odoo/odoo.conf.template:ro
      - ${SC_PRODUCT_ROOT}/scripts/render_odoo_conf.py:/usr/local/bin/render_odoo_conf.py:ro
      - ${SC_PRODUCT_ROOT}/scripts/odoo-entrypoint.sh:/usr/local/bin/odoo-entrypoint.sh:ro
    ports:
      - "${ODOO_BIND_HOST:-0.0.0.0}:${ODOO_PORT}:8069"
    entrypoint: [ "/bin/sh", "/usr/local/bin/odoo-entrypoint.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=8)\"" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  nginx:
    image: nginx:latest
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_healthy
    environment:
      SC_PROXY_DEFAULT_DB: ${DB_NAME}
      SC_PROXY_PLATFORM_DB: ${SC_PROXY_PLATFORM_DB}
      SC_PROXY_PLATFORM_UPSTREAM: ${SC_PROXY_PLATFORM_UPSTREAM}
      NGINX_ENVSUBST_FILTER: '^SC_PROXY_(DEFAULT_DB|PLATFORM_DB|PLATFORM_UPSTREAM)$'
    volumes:
      - ${SC_PRODUCT_ROOT}/config/nginx/templates:/etc/nginx/templates:ro
      - ${FRONTEND_DIST_DIR}:/usr/share/nginx/html:ro
    ports:
      - "${NGINX_BIND_HOST:-0.0.0.0}:${NGINX_PORT}:80"
    networks:
      default:
      sc-daily-entry:
    healthcheck:
      test: [ "CMD-SHELL", "nginx -t || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
    name: ${DB_DATA}
  redis_data:
    name: ${REDIS_DATA}
  odoo_data:
    name: ${ODOO_DATA}

networks:
  default:
  sc-daily-entry:
    external: true
    name: ${SC_DAILY_ENTRY_NETWORK:-sc-daily-entry}
